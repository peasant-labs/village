services:
  postgres:
    # Project mirror (linux/amd64 only).
    image: quay.io/peasant-labs/postgres:16-alpine@sha256:763d98d8fe6c03b54aeddbc6767daf88f572e307a86514aaf7d31219a30f5f0b
    platform: linux/amd64
    environment:
      POSTGRES_USER: peasant
      POSTGRES_PASSWORD: peasant
      POSTGRES_DB: peasant
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U peasant"]
      interval: 2s
      timeout: 5s
      retries: 5

  rustfs:
    # RustFS replaces MinIO, whose official images were withdrawn from Docker
    # Hub and Quay in September 2026. The image is pinned by digest so no tag
    # can move or vanish under a local run. The same digest appears in
    # .github/workflows/backend-tests.yml; the three move together.
    image: ghcr.io/rustfs/rustfs@sha256:8cc9801755448b71a786705ce76692c77e14936cccd87cf2fc31842e58f4d1ff
    environment:
      RUSTFS_ACCESS_KEY: minioadmin
      RUSTFS_SECRET_KEY: minioadmin
    volumes:
      - rustfsdata:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/health/ready"]
      interval: 2s
      timeout: 5s
      retries: 5

  rustfs-init:
    # The official AWS CLI creates the bucket; the MinIO mc client is no longer published.
    image: public.ecr.aws/aws-cli/aws-cli@sha256:fdd8d1fcbea9c371678dee5a40df8b178c7a781b4586605756ee28114c97ead6
    restart: on-failure
    environment:
      AWS_ACCESS_KEY_ID: minioadmin
      AWS_SECRET_ACCESS_KEY: minioadmin
      AWS_DEFAULT_REGION: us-east-1
    depends_on:
      rustfs:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      until aws --endpoint-url http://rustfs:9000 s3api list-buckets >/dev/null 2>&1; do
        echo 'Waiting for RustFS...'; sleep 2;
      done;
      aws --endpoint-url http://rustfs:9000 s3api create-bucket --bucket peasant-transcripts || true;
      exit 0;
      "

  caddy:
    # Project mirror (linux/amd64 only).
    image: quay.io/peasant-labs/caddy:2-alpine@sha256:bf85abd81736f68906698c7e9bcbb8b59c03cb8e672e771d7f8461f4360338a5
    platform: linux/amd64
    restart: on-failure
    ports:
      - "8080:80"
      - "8443:443"
      - "8445:8445"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - backend
      - frontend

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    restart: on-failure
    volumes:
      - ./backend:/app
      - /app/tmp # Prevent host tmp from clobbering container tmp
    env_file:
      - .env
    environment:
      DATABASE_URL: postgres://peasant:peasant@postgres:5432/peasant?sslmode=disable
      S3_ENDPOINT: http://rustfs:9000
      S3_BUCKET: peasant-transcripts
      S3_ACCESS_KEY: minioadmin
      S3_SECRET_KEY: minioadmin
      S3_USE_PATH_STYLE: "true"
      JWT_SECRET: ${JWT_SECRET}
      BASE_URL: https://localhost:8443
      FRONTEND_URL: https://localhost:8443
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID:-}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET:-}
      GITLAB_CLIENT_ID: ${GITLAB_CLIENT_ID:-}
      GITLAB_CLIENT_SECRET: ${GITLAB_CLIENT_SECRET:-}
      HUGGINGFACE_CLIENT_ID: ${HUGGINGFACE_CLIENT_ID:-}
      HUGGINGFACE_CLIENT_SECRET: ${HUGGINGFACE_CLIENT_SECRET:-}
      CODEBERG_CLIENT_ID: ${CODEBERG_CLIENT_ID:-}
      CODEBERG_CLIENT_SECRET: ${CODEBERG_CLIENT_SECRET:-}
      SOURCEHUT_CLIENT_ID: ${SOURCEHUT_CLIENT_ID:-}
      SOURCEHUT_CLIENT_SECRET: ${SOURCEHUT_CLIENT_SECRET:-}
      PORT: "8080"
    depends_on:
      - postgres
      - rustfs-init

  frontend:
    build:
      # THIS repo is the whole build context: all deps are published registry
      # packages, so no sibling worktree (and no worktree-specific path) is
      # ever referenced; the old context reached two levels up and hardcoded
      # another worktree's name, breaking every other checkout.
      context: .
      dockerfile: frontend/Dockerfile.dev
      args:
        NEXT_PUBLIC_API_URL: https://localhost:8443/api/v1
    volumes:
      - ./frontend:/workspace/frontend
      - /workspace/frontend/node_modules # Prevent host node_modules from clobbering container
      - /workspace/frontend/.next # Prevent host build from clobbering container
    depends_on:
      - backend

volumes:
  pgdata:
  rustfsdata:
  caddy_data:
  caddy_config:
