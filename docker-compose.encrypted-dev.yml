services:
  postgres:
    # Project mirror (linux/amd64 only).
    image: quay.io/peasant-labs/postgres:16-alpine@sha256:763d98d8fe6c03b54aeddbc6767daf88f572e307a86514aaf7d31219a30f5f0b
    platform: linux/amd64
    environment:
      POSTGRES_USER: peasant
      POSTGRES_PASSWORD: peasant
      POSTGRES_DB: peasant
    ports:
      - "127.0.0.1:${VILLAGE_DEV_POSTGRES_PORT:-55432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U peasant -d peasant"]
      interval: 1s
      timeout: 3s
      retries: 60
  minio:
    # The same server build the integration gates run, by digest: no tag can
    # move or vanish under a local run, and a local run tests the build CI
    # tests. The digest also appears as MINIO_IMAGE in
    # .github/workflows/backend-tests.yml — the three move together.
    image: quay.io/minio/minio@sha256:14cea493d9a34af32f524e538b8346cf79f3321eff8e708c1e2960462bd8936e
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "127.0.0.1:${VILLAGE_DEV_MINIO_PORT:-59000}:9000"
      - "127.0.0.1:${VILLAGE_DEV_MINIO_CONSOLE_PORT:-59001}:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 1s
      timeout: 3s
      retries: 60
  minio-init:
    # The client by digest for the same reason. Note this is the standalone
    # mc release, not the client bundled in the server image that CI execs.
    image: quay.io/minio/mc@sha256:fb8f773eac8ef9d6da0486d5dec2f42f219358bcb8de579d1623d518c9ebd4cc
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-ec"]
    command: ["mc alias set local http://minio:9000 minioadmin minioadmin && mc mb --ignore-existing local/peasant-transcripts"]
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    ports:
      - "127.0.0.1:${VILLAGE_DEV_BACKEND_PORT:-58080}:8080"
    volumes:
      - ./backend:/app
      - /app/tmp
    env_file:
      - .env.encrypted-dev
    environment:
      DATABASE_URL: postgres://peasant:peasant@postgres:5432/peasant?sslmode=disable
      S3_ENDPOINT: http://minio:9000
      S3_BUCKET: peasant-transcripts
      S3_ACCESS_KEY: minioadmin
      S3_SECRET_KEY: minioadmin
      S3_USE_PATH_STYLE: "true"
      BASE_URL: http://127.0.0.1:${VILLAGE_DEV_BACKEND_PORT:-58080}
      FRONTEND_URL: http://127.0.0.1:${VILLAGE_DEV_BACKEND_PORT:-58080}
      PORT: "8080"
    depends_on:
      postgres:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/api/v1/openapi.json"]
      interval: 2s
      timeout: 3s
      retries: 60
volumes:
  postgres-data:
  minio-data:
