services:
  postgres:
    # Project mirror (linux/amd64 only).
    image: quay.io/peasant-labs/postgres:16-alpine@sha256:763d98d8fe6c03b54aeddbc6767daf88f572e307a86514aaf7d31219a30f5f0b
    platform: linux/amd64
    environment:
      POSTGRES_USER: peasant
      POSTGRES_PASSWORD: peasant
      POSTGRES_DB: peasant
    ports:
      - "127.0.0.1:${VILLAGE_DEV_POSTGRES_PORT:-55432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U peasant -d peasant"]
      interval: 1s
      timeout: 3s
      retries: 60
  rustfs:
    # RustFS replaces MinIO, whose official images were withdrawn from Docker
    # Hub and Quay in September 2026. The image is pinned by digest so no tag
    # can move or vanish under a local run. The same digest appears in
    # .github/workflows/backend-tests.yml; the three move together.
    image: ghcr.io/rustfs/rustfs@sha256:8cc9801755448b71a786705ce76692c77e14936cccd87cf2fc31842e58f4d1ff
    environment:
      RUSTFS_ACCESS_KEY: minioadmin
      RUSTFS_SECRET_KEY: minioadmin
    ports:
      - "127.0.0.1:${VILLAGE_DEV_RUSTFS_PORT:-59000}:9000"
      - "127.0.0.1:${VILLAGE_DEV_RUSTFS_CONSOLE_PORT:-59001}:9001"
    volumes:
      - rustfs-data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/health/ready"]
      interval: 1s
      timeout: 3s
      retries: 60
  rustfs-init:
    # The official AWS CLI creates the bucket; the MinIO mc client is no longer published.
    image: public.ecr.aws/aws-cli/aws-cli@sha256:fdd8d1fcbea9c371678dee5a40df8b178c7a781b4586605756ee28114c97ead6
    depends_on:
      rustfs:
        condition: service_healthy
    environment:
      AWS_ACCESS_KEY_ID: minioadmin
      AWS_SECRET_ACCESS_KEY: minioadmin
      AWS_DEFAULT_REGION: us-east-1
    entrypoint: ["/bin/sh", "-ec"]
    command: ["until aws --endpoint-url http://rustfs:9000 s3api list-buckets >/dev/null 2>&1; do echo 'Waiting for RustFS...'; sleep 2; done; aws --endpoint-url http://rustfs:9000 s3api create-bucket --bucket peasant-transcripts || true"]
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    ports:
      - "127.0.0.1:${VILLAGE_DEV_BACKEND_PORT:-58080}:8080"
    volumes:
      - ./backend:/app
      - /app/tmp
    env_file:
      - .env.encrypted-dev
    environment:
      DATABASE_URL: postgres://peasant:peasant@postgres:5432/peasant?sslmode=disable
      S3_ENDPOINT: http://rustfs:9000
      S3_BUCKET: peasant-transcripts
      S3_ACCESS_KEY: minioadmin
      S3_SECRET_KEY: minioadmin
      S3_USE_PATH_STYLE: "true"
      BASE_URL: http://127.0.0.1:${VILLAGE_DEV_BACKEND_PORT:-58080}
      FRONTEND_URL: http://127.0.0.1:${VILLAGE_DEV_BACKEND_PORT:-58080}
      PORT: "8080"
    depends_on:
      postgres:
        condition: service_healthy
      rustfs-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/api/v1/openapi.json"]
      interval: 2s
      timeout: 3s
      retries: 60
volumes:
  postgres-data:
  rustfs-data:
