services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: peasant
      POSTGRES_PASSWORD: peasant
      POSTGRES_DB: peasant
    ports:
      - "127.0.0.1:${VILLAGE_DEV_POSTGRES_PORT:-55432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U peasant -d peasant"]
      interval: 1s
      timeout: 3s
      retries: 60
  minio:
    image: minio/minio:RELEASE.2025-07-23T15-54-02Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "127.0.0.1:${VILLAGE_DEV_MINIO_PORT:-59000}:9000"
      - "127.0.0.1:${VILLAGE_DEV_MINIO_CONSOLE_PORT:-59001}:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 1s
      timeout: 3s
      retries: 60
  minio-init:
    image: minio/mc:RELEASE.2025-07-21T05-28-08Z
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-ec"]
    command: ["mc alias set local http://minio:9000 minioadmin minioadmin && mc mb --ignore-existing local/peasant-transcripts"]
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    ports:
      - "127.0.0.1:${VILLAGE_DEV_BACKEND_PORT:-58080}:8080"
    volumes:
      - ./backend:/app
      - /app/tmp
    env_file:
      - .env.encrypted-dev
    environment:
      DATABASE_URL: postgres://peasant:peasant@postgres:5432/peasant?sslmode=disable
      S3_ENDPOINT: http://minio:9000
      S3_BUCKET: peasant-transcripts
      S3_ACCESS_KEY: minioadmin
      S3_SECRET_KEY: minioadmin
      S3_USE_PATH_STYLE: "true"
      BASE_URL: http://127.0.0.1:${VILLAGE_DEV_BACKEND_PORT:-58080}
      FRONTEND_URL: http://127.0.0.1:${VILLAGE_DEV_BACKEND_PORT:-58080}
      PORT: "8080"
    depends_on:
      postgres:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/api/v1/openapi.json"]
      interval: 2s
      timeout: 3s
      retries: 60
volumes:
  postgres-data:
  minio-data:
