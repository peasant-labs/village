# The pull request prompt attachment routes the served contract declares and
# the server mounts before their handlers exist. Each row is driven through
# the production router with no database. `anonymous` is the status an
# unauthenticated request receives; `authenticated` is the status a signed-in
# request receives and must be 501 for every row here. A 401 carries
# `unauthenticated_error`; a 501 carries `not_implemented_error`. A row with a
# `malformed` block also sends that body signed in and expects the contract
# violation, proving the body is checked before the stub answers.
#
# When a real handler lands, delete its row and its name from the required
# list in attachment_stubs_test.go. A row whose route stops answering 501
# fails the test, so this file only shrinks.

unauthenticated_error: Authentication required
not_implemented_error: Pull request prompt attachment is not implemented on this server yet

routes:
  - name: receive github webhook
    method: POST
    path: /api/v1/integrations/github/webhook
    target: /api/v1/integrations/github/webhook
    body: 'not json at all'
    anonymous: 501
    authenticated: 501
  - name: get pull request attachment
    method: GET
    path: /api/v1/pulls/{owner}/{name}/{number}
    target: /api/v1/pulls/acme/widgets/7
    anonymous: 501
    authenticated: 501
  - name: confirm pull request attachment
    method: POST
    path: /api/v1/pulls/{owner}/{name}/{number}/confirm
    target: /api/v1/pulls/acme/widgets/7/confirm
    anonymous: 401
    authenticated: 501
  - name: detach pull request attachment
    method: DELETE
    path: /api/v1/pulls/{owner}/{name}/{number}
    target: /api/v1/pulls/acme/widgets/7
    anonymous: 401
    authenticated: 501
  - name: list my prompt requests
    method: GET
    path: /api/v1/users/me/prompt-requests
    target: /api/v1/users/me/prompt-requests
    anonymous: 401
    authenticated: 501
  - name: get my settings
    method: GET
    path: /api/v1/users/me/settings
    target: /api/v1/users/me/settings
    anonymous: 401
    authenticated: 501
  - name: update my settings
    method: PATCH
    path: /api/v1/users/me/settings
    target: /api/v1/users/me/settings
    body: '{"preview_before_attach":true}'
    anonymous: 401
    authenticated: 501
    malformed:
      body: '{"preview_before_attach":"yes"}'
      status: 400
      error_contains: "/preview_before_attach: expected null or boolean, but got string"
