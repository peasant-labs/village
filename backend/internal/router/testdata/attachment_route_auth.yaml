# The anonymous status of the pull request attachment routes, driven through the
# production router. This is the guard the 501 stub fixture used to provide: a
# silent flip of AuthOptional to AuthRequired (or the reverse) on these routes
# would break public reads or expose an owner-only action, and nothing else
# asserts the router's own policy.
routes:
  - name: get pull request attachment is reachable anonymously
    method: GET
    path: /api/v1/pulls/acme/widgets/7
    anonymous: 404

  - name: confirm requires a session
    method: POST
    path: /api/v1/pulls/acme/widgets/7/confirm
    anonymous: 401

  - name: detach requires a session
    method: DELETE
    path: /api/v1/pulls/acme/widgets/7
    anonymous: 401

  - name: prompt requests require a session
    method: GET
    path: /api/v1/users/me/prompt-requests
    anonymous: 401

  - name: reading settings requires a session
    method: GET
    path: /api/v1/users/me/settings
    anonymous: 401

  - name: updating settings requires a session
    method: PATCH
    path: /api/v1/users/me/settings
    anonymous: 401

  - name: a transcript's pull requests are reachable anonymously
    method: GET
    path: /api/v1/transcripts/00000000-0000-4000-8000-000000000257/pulls
    anonymous: 404

  # A 404 alone would also be what an unmounted route answers. The handler's own
  # 400 for an identifier that is not one proves the route is mounted.
  - name: a transcript's pull requests route is mounted
    method: GET
    path: /api/v1/transcripts/not-a-transcript-id/pulls
    anonymous: 400

  - name: personal totals require a session
    method: GET
    path: /api/v1/users/me/stats
    anonymous: 401
