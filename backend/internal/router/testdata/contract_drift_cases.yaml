# Each case compares mounted and declared routes and lists the exact findings.

- name: mounted route absent from the contract is a finding
  why: >
    The drift this gate exists to catch. A route the server answers but the
    contract never describes is invisible to every client and validated by
    nothing.
  mounted:
    - method: GET
      path: /api/v1/groups/{id}
    - method: POST
      path: /api/v1/groups/{id}/shares
  declared:
    - method: GET
      path: /api/v1/groups/{id}
  findings:
    - "POST /api/v1/groups/{id}/shares is mounted but the served contract does not declare it; declare it in the schema module and re-pin"

- name: mounted route the contract declares passes
  why: >
    The normal state for every collectives route after the contract landed.
  mounted:
    - method: PATCH
      path: /api/v1/groups/{id}/shares/{transcriptID}
  declared:
    - method: PATCH
      path: /api/v1/groups/{id}/shares/{transcriptID}
  findings: []

- name: path parameter names do not matter
  why: >
    The router says {id} where the contract says {groupId}. The same segment
    position is the same route; only the names differ.
  mounted:
    - method: GET
      path: /api/v1/users/me/collectives/{groupId}/submissions
  declared:
    - method: GET
      path: /api/v1/users/me/collectives/{id}/submissions
  findings: []

- name: declared route that is not mounted is a finding
  why: >
    The router takes each declared route's pattern from its schema route
    member, so a mount that names the wrong member is still a declared route
    and passes the mounted-side check; the route it was meant to serve is
    silently dropped. A route the contract declares ahead of its handler is
    mounted as a 501 stub, so it is mounted too.
  mounted: []
  declared:
    - method: GET
      path: /api/v1/pulls/{owner}/{name}/{number}
  findings:
    - "GET /api/v1/pulls/{owner}/{name}/{number} is declared by the served contract but the server does not mount it; mount it from its schema route member, or as a 501 stub listed in the declared-stub-routes manifest until its handler lands"

- name: attachment route mounted without a declaration is a finding
  why: >
    The pull request prompt attachment routes are mounted before their
    handlers exist. If the served contract stopped declaring one, or the
    router spelled one differently, the gate must say so rather than let the
    stub pass unnoticed.
  mounted:
    - method: GET
      path: /api/v1/pulls/{owner}/{name}/{number}
    - method: POST
      path: /api/v1/pulls/{owner}/{name}/{number}/confirm
  declared:
    - method: GET
      path: /api/v1/pulls/{owner}/{name}/{number}
  findings:
    - "POST /api/v1/pulls/{owner}/{name}/{number}/confirm is mounted but the served contract does not declare it; declare it in the schema module and re-pin"

- name: a root route the contract declares passes
  mounted: [{method: GET, path: /health}]
  declared: [{method: GET, path: /health}]
  findings: []
- name: a root route the contract does not declare is a finding
  mounted: [{method: GET, path: /other}]
  declared: []
  findings:
    - "GET /other is mounted but the served contract does not declare it; declare it in the schema module and re-pin"
- name: a route declared at the root but mounted under the API prefix is a finding
  mounted: [{method: GET, path: /api/v1/health}]
  declared: [{method: GET, path: /health}]
  findings:
    - "GET /api/v1/health is mounted but the served contract does not declare it; declare it in the schema module and re-pin"
    - "GET /health is declared by the served contract but the server does not mount it; mount it from its schema route member, or as a 501 stub listed in the declared-stub-routes manifest until its handler lands"
