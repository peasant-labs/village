# Routes the served Village API contract declares before Village has a handler
# for them. Each is mounted as a stub that answers 501, so the contract and the
# server agree on the route while the handler is written.
#
# `route` is the mounted pattern and must be declared by the served contract.
# `path` is one concrete request for it. `anonymous` and `signed_in` are the
# statuses the production router answers without and with a session: they pin
# the route's auth policy, so a stub cannot change from optional to required
# auth unnoticed. Landing a real handler deletes its row.
#
# The test runs the router with no database. A session is accepted only after
# its account is read from the database, so with none the session cannot be
# confirmed: on an optional-auth stub `signed_in` equals `anonymous` (the
# caller is served anonymously and reaches the stub), and on an auth-required
# stub `signed_in` is 503 (the session is refused as unconfirmed before the
# stub runs). A signed-in caller with a live account is proved against
# PostgreSQL by the session identity probe test.
routes:
  - name: batch publish
    method: POST
    route: /api/v1/transcripts/publish/batch
    path: /api/v1/transcripts/publish/batch
    anonymous: 401
    signed_in: 503
  - name: list-contribution-projects
    method: GET
    route: /api/v1/collectives/{id}/contributable/projects
    path: /api/v1/collectives/00000000-0000-0000-0000-000000000001/contributable/projects
    anonymous: 401
    signed_in: 503
  - name: list-contribution-projects-deprecated
    method: GET
    route: /api/v1/groups/{id}/contributable/projects
    path: /api/v1/groups/00000000-0000-0000-0000-000000000001/contributable/projects
    anonymous: 401
    signed_in: 503
  - name: batch-share-selection
    method: POST
    route: /api/v1/collectives/{id}/shares/selection
    path: /api/v1/collectives/00000000-0000-0000-0000-000000000001/shares/selection
    anonymous: 401
    signed_in: 503
  - name: batch-share-selection-deprecated
    method: POST
    route: /api/v1/groups/{id}/shares/selection
    path: /api/v1/groups/00000000-0000-0000-0000-000000000001/shares/selection
    anonymous: 401
    signed_in: 503
