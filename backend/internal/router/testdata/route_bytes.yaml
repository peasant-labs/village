- name: health-no-pool
  method: GET
  path: /health
  status: 200
  want_headers: {Content-Type: application/json, Cache-Control: no-store}
  body: |
    {"status":"ok","serves":["publish-revision-n","segmented-reads-v2"]}
- name: logout
  method: POST
  path: /api/v1/auth/logout
  status: 200
  want_headers: {Content-Type: application/json, Set-Cookie: "peasant_token=; Path=/; Max-Age=0; HttpOnly"}
  body: |
    {"status":"logged out"}
- name: empty-organization-search
  method: GET
  path: /api/v1/orgs/search
  status: 200
  want_headers: {Content-Type: application/json}
  body: |
    {"organizations":[]}
- name: github-login-sixth-request
  method: GET
  path: /api/v1/auth/github
  repeat: 5
  status: 429
  want_headers:
    Content-Type: text/plain; charset=utf-8
    Retry-After: "60"
    X-RateLimit-Limit: "5"
    X-RateLimit-Remaining: "0"
  body: |
    Too Many Requests
- &anonymous
  name: delete-account-anonymous
  method: DELETE
  path: /api/v1/auth/me
  status: 401
  want_headers: {Content-Type: application/json}
  body: |
    {"error":"Authentication required"}
