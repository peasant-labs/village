- name: health-no-pool
  only_outcome_reason: Liveness remains 200 when the migration registry is unavailable.
  method: GET
  path: /health
  status: 200
  want_headers: {Content-Type: application/json, Cache-Control: no-store}
  body: |
    {"status":"ok","serves":["publish-revision-n","segmented-reads-v2"]}
- name: openapi-document
  only_outcome_reason: The document handler always answers 200; its bytes change with the pinned schema module.
  body_from_pinned_schema: true
  method: GET
  path: /api/v1/openapi.json
  status: 200
  want_headers: {Content-Type: application/json}
- name: logout
  only_outcome_reason: Logout always clears the cookie and answers 200.
  method: POST
  path: /api/v1/auth/logout
  status: 200
  want_headers: {Content-Type: application/json, Set-Cookie: "peasant_token=; Path=/; Max-Age=0; HttpOnly"}
  body: |
    {"status":"logged out"}
- name: empty-organization-search
  only_outcome_reason: An empty query answers an empty list without reading the database; the search answers otherwise only on a database failure (500).
  method: GET
  path: /api/v1/orgs/search
  status: 200
  want_headers: {Content-Type: application/json}
  body: |
    {"organizations":[]}
- &invalid_transcript
  name: list-attestations-invalid-id
  method: GET
  path: /api/v1/transcripts/invalid/attestations
  status: 400
  want_headers: {Content-Type: application/json}
  body: |
    {"error":"Invalid transcript ID"}
- <<: *invalid_transcript
  name: list-annotations-invalid-id
  path: /api/v1/transcripts/invalid/annotations
- <<: *invalid_transcript
  name: list-commits-invalid-id
  path: /api/v1/transcripts/invalid/commits
- name: github-login-sixth-request
  method: GET
  path: /api/v1/auth/github
  repeat: 5
  status: 429
  want_headers:
    Content-Type: text/plain; charset=utf-8
    Retry-After: "60"
    X-RateLimit-Limit: "5"
    X-RateLimit-Remaining: "0"
  body: |
    Too Many Requests
- &anonymous
  name: delete-account-anonymous
  method: DELETE
  path: /api/v1/auth/me
  status: 401
  want_headers: {Content-Type: application/json}
  body: |
    {"error":"Authentication required"}
- <<: *anonymous
  name: update-discoverability-anonymous
  method: PATCH
  path: /api/v1/auth/me/settings
- <<: *anonymous
  name: set-username-anonymous
  method: PATCH
  path: /api/v1/auth/me/username
- <<: *anonymous
  name: create-api-key-anonymous
  method: POST
  path: /api/v1/auth/api-keys
- <<: *anonymous
  name: list-api-keys-anonymous
  method: GET
  path: /api/v1/auth/api-keys
- <<: *anonymous
  name: revoke-api-key-anonymous
  method: DELETE
  path: /api/v1/auth/api-keys/00000000-0000-0000-0000-000000000001
- <<: *anonymous
  name: organization-visibility-anonymous
  method: PATCH
  path: /api/v1/auth/orgs/example/visibility
- <<: *anonymous
  name: delete-transcript-anonymous
  method: DELETE
  path: /api/v1/transcripts/00000000-0000-0000-0000-000000000001
- <<: *anonymous
  name: create-attestation-anonymous
  method: POST
  path: /api/v1/transcripts/00000000-0000-0000-0000-000000000001/attestations
- <<: *anonymous
  name: delete-attestation-anonymous
  method: DELETE
  path: /api/v1/transcripts/00000000-0000-0000-0000-000000000001/attestations/00000000-0000-0000-0000-000000000002
- <<: *anonymous
  name: create-annotation-anonymous
  method: POST
  path: /api/v1/transcripts/00000000-0000-0000-0000-000000000001/annotations
- <<: *anonymous
  name: batch-publish-anonymous
  only_outcome_reason: The batch handler is a stub and has no success response.
  method: POST
  path: /api/v1/transcripts/publish/batch
- <<: *anonymous
  name: set-project-name-anonymous
  method: PATCH
  path: /api/v1/users/me/projects/example
- <<: *anonymous
  name: clear-project-name-anonymous
  method: DELETE
  path: /api/v1/users/me/projects/example/display-name
- <<: *anonymous
  name: github-install-anonymous
  method: GET
  path: /api/v1/integrations/github/install
- <<: *anonymous
  name: github-install-callback-anonymous
  method: GET
  path: /api/v1/integrations/github/callback
- name: github-install-unconfigured
  database: true
  method: GET
  path: /api/v1/integrations/github/install
  headers: {Accept: application/json}
  status: 501
  want_headers: {Content-Type: application/json}
  body: |
    {"error":"GitHub App installation is not configured on this server"}
- name: github-install-callback-unconfigured
  database: true
  method: GET
  path: /api/v1/integrations/github/callback
  headers: {Accept: application/json}
  status: 501
  want_headers: {Content-Type: application/json}
  body: |
    {"error":"GitHub App installation is not configured on this server"}
- name: organization-visibility-updated
  database: true
  method: PATCH
  path: /api/v1/auth/orgs/{{org_null}}/visibility
  request_body: '{"visible":true}'
  status: 200
  want_headers: {Content-Type: application/json}
  body: |
    {"status":"updated","visible":true}
- name: organization-visibility-invalid-json
  database: true
  method: PATCH
  path: /api/v1/auth/orgs/{{org_null}}/visibility
  request_body: '{'
  status: 400
  want_headers: {Content-Type: application/json}
  body: |
    {"error":"Invalid request body"}
- name: delete-missing-attestation
  database: true
  method: DELETE
  path: /api/v1/transcripts/unused/attestations/00000000-0000-0000-0000-000000000002
  status: 200
  want_headers: {Content-Type: application/json}
  body: |
    {"status":"deleted"}
- name: delete-attestation-invalid-id
  database: true
  method: DELETE
  path: /api/v1/transcripts/unused/attestations/invalid
  status: 400
  want_headers: {Content-Type: application/json}
  body: |
    {"error":"Invalid attestation ID"}
- name: public-profile-missing
  database: true
  method: GET
  path: /api/v1/users/{{org_null}}
  status: 404
  want_headers: {Content-Type: application/json}
  body: |
    {"error":"User not found"}
- name: public-organizations-missing
  database: true
  method: GET
  path: /api/v1/users/{{org_null}}/orgs
  status: 404
  want_headers: {Content-Type: application/json}
  body: |
    {"error":"User not found"}
- name: create-api-key
  database: true
  capture: [api-key]
  method: POST
  path: /api/v1/auth/api-keys
  request_body: '{"label":"golden"}'
  status: 201
  want_headers: {Content-Type: application/json}
  body: |
    {"created_at":"{{created_at}}","id":"{{id}}","key":"{{key}}","label":"golden","prefix":"peasant_"}
- name: list-api-keys
  database: true
  method: GET
  path: /api/v1/auth/api-keys
  status: 200
  want_headers: {Content-Type: application/json}
  body: |
    [{"id":"{{id}}","key_prefix":"peasant_","label":"golden","created_at":"{{created_at}}","last_used":null,"revoked_at":null}]
- name: peasant-revoke-api-key
  database: true
  capture: [revoked]
  method: DELETE
  path: /api/v1/auth/api-keys/{{id}}
  headers: {Authorization: "Bearer {{key}}"}
  status: 200
  want_headers: {Content-Type: application/json}
  body: |
    {"status":"revoked"}
- name: batch-publish-signed-in
  database: true
  only_outcome_reason: The batch handler is a stub and has no success response.
  method: POST
  path: /api/v1/transcripts/publish/batch
  status: 501
  want_headers: {Content-Type: application/json}
  body: |
    {"error":"Batch publish coming soon"}
- name: organization-search-null-avatar
  database: true
  method: GET
  path: /api/v1/orgs/search?q={{org_null}}
  status: 200
  want_headers: {Content-Type: application/json}
  body: |
    {"organizations":[{"org_login":"{{org_null}}","avatar_url":null,"member_count":1,"transcript_count":1}]}
- name: organization-search-avatar
  database: true
  method: GET
  path: /api/v1/orgs/search?q={{org_avatar}}
  status: 200
  want_headers: {Content-Type: application/json}
  body: |
    {"organizations":[{"org_login":"{{org_avatar}}","avatar_url":"https://example.test/avatar.png","member_count":1,"transcript_count":1}]}
