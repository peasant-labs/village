# Each case runs in a rolled-back transaction against a seeded transcript.
# {transcript_id}, {owner_id} and {hash} are substituted before execution.
# expect is "ok" or a substring the PostgreSQL error must contain.
# check_sql, when set, runs after the statement and must return want as text.
- name: metadata_all_null_ok
  writer_marker: true
  statement: UPDATE transcripts SET publish_metadata_key = NULL, publish_metadata_hash = NULL, publish_metadata_size = NULL WHERE id = '{transcript_id}'
  expect: ok
- name: metadata_all_set_ok
  writer_marker: true
  statement: UPDATE transcripts SET publish_metadata_key = 'transcripts/00000000-0000-0000-0000-000000000001.bin', publish_metadata_hash = '{hash}', publish_metadata_size = 0 WHERE id = '{transcript_id}'
  expect: ok
- name: metadata_key_without_hash_refused
  writer_marker: true
  statement: UPDATE transcripts SET publish_metadata_key = 'transcripts/00000000-0000-0000-0000-000000000001.bin' WHERE id = '{transcript_id}'
  expect: transcripts_publish_metadata_complete
- name: metadata_key_bad_shape_refused
  writer_marker: true
  statement: UPDATE transcripts SET publish_metadata_key = 'other/x.bin', publish_metadata_hash = '{hash}', publish_metadata_size = 1 WHERE id = '{transcript_id}'
  expect: transcripts_publish_metadata_key_shape
- name: metadata_hash_bad_shape_refused
  writer_marker: true
  statement: UPDATE transcripts SET publish_metadata_key = 'transcripts/00000000-0000-0000-0000-000000000001.bin', publish_metadata_hash = 'ABC', publish_metadata_size = 1 WHERE id = '{transcript_id}'
  expect: transcripts_publish_metadata_hash_shape
- name: metadata_negative_size_refused
  writer_marker: true
  statement: UPDATE transcripts SET publish_metadata_key = 'transcripts/00000000-0000-0000-0000-000000000001.bin', publish_metadata_hash = '{hash}', publish_metadata_size = -1 WHERE id = '{transcript_id}'
  expect: transcripts_publish_metadata_size_nonnegative
- name: metadata_key_equal_to_blob_key_refused
  writer_marker: true
  statement: UPDATE transcripts SET publish_metadata_key = blob_key, publish_metadata_hash = '{hash}', publish_metadata_size = 1 WHERE id = '{transcript_id}'
  expect: transcripts_publish_metadata_key_not_blob_key
- name: metadata_update_without_writer_marker_refused
  writer_marker: false
  statement: UPDATE transcripts SET publish_metadata_key = 'transcripts/00000000-0000-0000-0000-000000000001.bin', publish_metadata_hash = '{hash}', publish_metadata_size = 1 WHERE id = '{transcript_id}'
  expect: writer marker
- name: rewrite_row_cascades_with_transcript
  writer_marker: true
  statement: >-
    INSERT INTO transcript_content_rewrites (transcript_id, replaced_content_hash, installed_content_hash, replaced_was_legacy)
    VALUES ('{transcript_id}', '{hash}', '{hash}', true);
    DELETE FROM transcripts WHERE id = '{transcript_id}'
  expect: ok
  check_sql: SELECT count(*)::text FROM transcript_content_rewrites WHERE transcript_id = '{transcript_id}'
  want: "0"
- name: rewrite_bad_hash_refused
  writer_marker: true
  statement: INSERT INTO transcript_content_rewrites (transcript_id, replaced_content_hash, installed_content_hash, replaced_was_legacy) VALUES ('{transcript_id}', 'nothex', '{hash}', false)
  expect: transcript_content_rewrites_replaced_hash_shape
- name: rewrite_installed_bad_hash_refused
  writer_marker: true
  statement: INSERT INTO transcript_content_rewrites (transcript_id, replaced_content_hash, installed_content_hash, replaced_was_legacy) VALUES ('{transcript_id}', '{hash}', 'nothex', false)
  expect: transcript_content_rewrites_installed_hash_shape
