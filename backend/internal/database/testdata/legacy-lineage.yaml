# rewrites are applied in order; hashes are names, mapped to 64-hex digests.
- name: raw_jsonl_rewrite_is_legacy
  rewrites:
    - {replaced: h1, installed: h2, legacy: true}
  query: h2
  want: true
- name: payload_rewrite_is_not_legacy
  rewrites:
    - {replaced: h1, installed: h2, legacy: false}
  query: h2
  want: false
- name: two_step_chain_from_legacy_is_legacy
  rewrites:
    - {replaced: h1, installed: h2, legacy: false}
    - {replaced: h2, installed: h3, legacy: true}
  query: h3
  want: true
- name: rewrite_of_a_legacy_rewrite_stays_legacy
  rewrites:
    - {replaced: h1, installed: h2, legacy: true}
    - {replaced: h2, installed: h3, legacy: false}
  query: h3
  want: true
- name: publisher_hash_is_not_legacy
  rewrites:
    - {replaced: h1, installed: h2, legacy: true}
  query: h1
  want: false
- name: cycle_terminates
  rewrites:
    - {replaced: h1, installed: h2, legacy: false}
    - {replaced: h2, installed: h1, legacy: false}
  query: h1
  want: false
