required_up:
  - ADD COLUMN input_submission_count BIGINT
  - ADD COLUMN root_session_id TEXT
  - ADD COLUMN session_purpose TEXT
  - ADD COLUMN session_relationships JSONB NOT NULL DEFAULT '[]'::jsonb
  - CHECK (input_submission_count BETWEEN 0 AND 9007199254740991)
  - transcripts_session_purpose_menu
  - transcripts_session_relationships_array
  - ON transcripts (owner_id, root_session_id)
required_down:
  - DROP COLUMN input_submission_count
  - DROP COLUMN root_session_id
  - DROP COLUMN session_purpose
  - DROP COLUMN session_relationships
  - DROP INDEX idx_transcripts_owner_root_session
forbidden_up:
  - UPDATE transcripts
  - DELETE FROM transcripts
  - REFERENCES transcripts
