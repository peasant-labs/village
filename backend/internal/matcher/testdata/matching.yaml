# The acceptance policy for pull-request matching, case by case.
#
# Every case names the evidence it turns on and the outcome it expects, so a
# change to the policy fails here rather than quietly re-selecting transcripts.
# A repository gate is discovery only; acceptance is a resolved commit
# intersection against a commit set the case declares COMPLETE (the fail-closed
# default, `commit_set_complete: false`, is the incomplete case below).
# Everything unresolved is REPORTED with the reason, never dropped and never
# promoted.
cases:
  - name: sha-only-evidence-accepts
    pull_request:
      base_repo: village
      head_repo: village
      head_ref: feat/picker
      commit_set_complete: true
      commits: ["aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa1"]
    candidates:
      - transcript: t-sha-only
        project_name: /workspace/village
        git_remote: github.com/peasant-labs/village.git
        git_branch: feat/something-else
        session_start: 2026-01-01T00:00:00Z
        commits:
          - sha: "aaaaaaa"
            authored_at: 2026-01-02T03:04:05Z
            additions: 12
            deletions: 3
            files_changed: 2
    expect:
      accepted:
        - transcript: t-sha-only
          anchors: ["aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa1"]
          anchor_details:
            - sha: "aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa1"
              authored_at: 2026-01-02T03:04:05Z
              additions: 12
              deletions: 3
              files_changed: 2
      unresolved: []
      excluded: []

  - name: accepted-transcripts-order-by-session-start
    pull_request:
      base_repo: village
      head_ref: feat/picker
      commit_set_complete: true
      commits:
        - "aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa1"
        - "bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb2"
    candidates:
      - transcript: t-later
        git_remote: github.com/peasant-labs/village.git
        session_start: 2026-02-02T00:00:00Z
        commits:
          - sha: "aaaaaaa"
      - transcript: t-earlier
        git_remote: github.com/peasant-labs/village.git
        session_start: 2026-01-01T00:00:00Z
        commits:
          - sha: "bbbbbbb"
    expect:
      accepted:
        - transcript: t-earlier
          anchors: ["bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb2"]
        - transcript: t-later
          anchors: ["aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa1"]
      unresolved: []
      excluded: []

  - name: unknown-session-start-orders-last
    pull_request:
      base_repo: village
      head_ref: feat/picker
      commit_set_complete: true
      commits:
        - "aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa1"
        - "bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb2"
    candidates:
      # First in discovery order and with no recorded start: the query orders
      # NULLS LAST, so it must sort after the dated transcript, not before it.
      - transcript: t-unknown-start
        git_remote: github.com/peasant-labs/village.git
        commits:
          - sha: "aaaaaaa"
      - transcript: t-dated
        git_remote: github.com/peasant-labs/village.git
        session_start: 2026-03-03T00:00:00Z
        commits:
          - sha: "bbbbbbb"
    expect:
      accepted:
        - transcript: t-dated
          anchors: ["bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb2"]
        - transcript: t-unknown-start
          anchors: ["aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa1"]
      unresolved: []
      excluded: []

  - name: branch-only-evidence-stays-unresolved
    pull_request:
      base_repo: village
      head_ref: feat/picker
      commit_set_complete: true
      commits:
        - "aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa1"
    candidates:
      - transcript: t-branch-only
        git_remote: github.com/peasant-labs/village.git
        git_branch: feat/picker
        session_start: 2026-01-01T00:00:00Z
    expect:
      accepted: []
      unresolved:
        - transcript: t-branch-only
          branch_matched: true
          reasons: {}
      excluded: []

  - name: no-recorded-commits-branch-match-unresolved
    pull_request:
      base_repo: village
      head_ref: main
      commit_set_complete: true
      commits:
        - "aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa1"
    candidates:
      - transcript: t-no-commits
        git_remote: github.com/peasant-labs/village.git
        git_branch: main
        session_start: 2026-01-01T00:00:00Z
    expect:
      accepted: []
      unresolved:
        - transcript: t-no-commits
          branch_matched: true
          reasons: {}
      excluded: []

  - name: over-attributed-legacy-sha-is-retained-not-accepted
    pull_request:
      base_repo: village
      head_ref: feat/picker
      commit_set_complete: true
      commits:
        - "aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa1"
    candidates:
      - transcript: t-legacy-sha
        git_remote: github.com/peasant-labs/village.git
        git_branch: feat/picker
        session_start: 2026-01-01T00:00:00Z
        commits:
          - sha: "deadbeefdeadbeefdeadbeefdeadbeefdeadbeef"
            authored_at: 2025-06-01T00:00:00Z
    expect:
      accepted: []
      unresolved:
        - transcript: t-legacy-sha
          branch_matched: true
          reasons:
            deadbeefdeadbeefdeadbeefdeadbeefdeadbeef: not_in_pull_request
      excluded: []

  - name: reused-branch-name-does-not-prove-relevance
    pull_request:
      base_repo: village
      head_ref: feat/picker
      commit_set_complete: true
      commits:
        - "aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa1"
    candidates:
      - transcript: t-reused-branch
        git_remote: github.com/peasant-labs/village.git
        git_branch: feat/picker
        session_start: 2025-01-01T00:00:00Z
        commits:
          - sha: "9999999999999999999999999999999999999999"
    expect:
      accepted: []
      unresolved:
        - transcript: t-reused-branch
          branch_matched: true
          reasons:
            9999999999999999999999999999999999999999: not_in_pull_request
      excluded: []

  - name: still-existing-branch-after-rebase-unresolved
    pull_request:
      base_repo: village
      head_ref: feat/picker
      commit_set_complete: true
      commits:
        - "aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa1"
        - "bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb2"
    candidates:
      - transcript: t-rebased
        git_remote: github.com/peasant-labs/village.git
        git_branch: feat/picker
        session_start: 2026-01-01T00:00:00Z
        commits:
          - sha: "ccccccccccccccccccccccccccccccccccccccc1"
          - sha: "ccccccccccccccccccccccccccccccccccccccc2"
    expect:
      accepted: []
      unresolved:
        - transcript: t-rebased
          branch_matched: true
          reasons:
            ccccccccccccccccccccccccccccccccccccccc1: not_in_pull_request
            ccccccccccccccccccccccccccccccccccccccc2: not_in_pull_request
      excluded: []

  - name: ambiguous-abbreviated-sha-names-no-commit
    pull_request:
      base_repo: village
      head_ref: feat/picker
      commit_set_complete: true
      commits:
        - "abc1234000000000000000000000000000000001"
        - "abc1234000000000000000000000000000000002"
    candidates:
      - transcript: t-ambiguous
        git_remote: github.com/peasant-labs/village.git
        session_start: 2026-01-01T00:00:00Z
        commits:
          - sha: "abc1234"
    expect:
      accepted: []
      unresolved:
        - transcript: t-ambiguous
          branch_matched: false
          reasons:
            abc1234: ambiguous
      excluded: []

  - name: abbreviated-sha-that-names-one-commit-accepts
    pull_request:
      base_repo: village
      head_ref: feat/picker
      commit_set_complete: true
      commits:
        - "abc1234000000000000000000000000000000001"
        - "abc9999000000000000000000000000000000002"
    candidates:
      - transcript: t-unambiguous
        git_remote: github.com/peasant-labs/village.git
        session_start: 2026-01-01T00:00:00Z
        commits:
          - sha: "abc1234"
    expect:
      accepted:
        - transcript: t-unambiguous
          anchors: ["abc1234000000000000000000000000000000001"]
      unresolved: []
      excluded: []

  - name: sha-shorter-than-a-resolving-prefix-unresolved
    pull_request:
      base_repo: village
      head_ref: feat/picker
      commit_set_complete: true
      commits:
        - "aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa1"
    candidates:
      - transcript: t-too-short
        git_remote: github.com/peasant-labs/village.git
        session_start: 2026-01-01T00:00:00Z
        commits:
          - sha: "aaaaaa"
    expect:
      accepted: []
      unresolved:
        - transcript: t-too-short
          branch_matched: false
          reasons:
            aaaaaa: too_short
      excluded: []

  - name: historical-commit-on-another-ref-is-not-coverage
    pull_request:
      base_repo: village
      head_ref: feat/picker
      commit_set_complete: true
      commits:
        - "aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa1"
    candidates:
      - transcript: t-other-ref
        git_remote: github.com/peasant-labs/village.git
        session_start: 2026-01-01T00:00:00Z
        commits:
          - sha: "ffffffffffffffffffffffffffffffffffffffff"
    expect:
      accepted: []
      unresolved:
        - transcript: t-other-ref
          branch_matched: false
          reasons:
            ffffffffffffffffffffffffffffffffffffffff: not_in_pull_request
      excluded: []

  - name: fork-pull-request-matches-its-head-repository
    pull_request:
      base_repo: village
      head_repo: village-fork
      head_ref: feature/x
      is_fork: true
      commit_set_complete: true
      commits:
        - "aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa1"
    candidates:
      - transcript: t-fork
        git_remote: git@github.com:author/village-fork.git
        git_branch: feature/x
        session_start: 2026-01-01T00:00:00Z
        commits:
          - sha: "aaaaaaa"
    expect:
      accepted:
        - transcript: t-fork
          anchors: ["aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa1"]
      unresolved: []
      excluded: []

  - name: same-repository-pull-request-cannot-match-a-stray-head-repo
    pull_request:
      base_repo: village
      head_repo: some-other-project
      head_ref: feat/picker
      commit_set_complete: true
      commits:
        - "aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa1"
    candidates:
      - transcript: t-stray
        git_remote: github.com/peasant-labs/some-other-project.git
        session_start: 2026-01-01T00:00:00Z
        commits:
          - sha: "aaaaaaa"
    expect:
      accepted: []
      unresolved: []
      excluded: [t-stray]

  - name: unrelated-repository-is-not-even-a-candidate
    pull_request:
      base_repo: village
      head_ref: feat/picker
      commit_set_complete: true
      commits:
        - "aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa1"
    candidates:
      - transcript: t-other-repo
        git_remote: github.com/peasant-labs/another-project.git
        session_start: 2026-01-01T00:00:00Z
        commits:
          - sha: "aaaaaaa"
    expect:
      accepted: []
      unresolved: []
      excluded: [t-other-repo]

  - name: project-path-only-transcript-is-not-a-candidate
    pull_request:
      base_repo: village
      head_ref: feat/picker
      commit_set_complete: true
      commits:
        - "aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa1"
    candidates:
      # The project path alone names the repository, but with no stored remote
      # there is nothing to compare: the candidate query would not return this
      # row either, so the matcher must not admit it.
      - transcript: t-project-only
        project_name: /workspace/village
        git_remote: ""
        session_start: 2026-01-01T00:00:00Z
        commits:
          - sha: "aaaaaaa"
    expect:
      accepted: []
      unresolved: []
      excluded: [t-project-only]

  - name: one-commit-recorded-twice-is-one-anchor
    pull_request:
      base_repo: village
      head_ref: feat/picker
      commit_set_complete: true
      commits: ["aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa1"]
    candidates:
      - transcript: t-double
        git_remote: github.com/peasant-labs/village.git
        session_start: 2026-01-01T00:00:00Z
        commits:
          - sha: "aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa1"
            authored_at: 2026-01-04T00:00:00Z
          - sha: "aaaaaaa"
            authored_at: 2026-01-03T00:00:00Z
    expect:
      accepted:
        - transcript: t-double
          anchors: ["aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa1"]
          # Two observations of one commit are one anchor, keeping the earliest
          # authored time rather than whichever was recorded first.
          anchor_details:
            - sha: "aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa1"
              authored_at: 2026-01-03T00:00:00Z
      unresolved: []
      excluded: []

  - name: two-anchors-are-both-kept
    pull_request:
      base_repo: village
      head_ref: feat/picker
      commit_set_complete: true
      commits:
        - "aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa1"
        - "bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb2"
    candidates:
      - transcript: t-two-anchors
        git_remote: github.com/peasant-labs/village.git
        session_start: 2026-01-01T00:00:00Z
        commits:
          - sha: "aaaaaaa"
            authored_at: 2026-01-01T00:00:00Z
            additions: 5
          - sha: "bbbbbbb"
            authored_at: 2026-01-02T00:00:00Z
            files_changed: 4
    expect:
      accepted:
        - transcript: t-two-anchors
          anchors:
            - "aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa1"
            - "bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb2"
          anchor_details:
            - sha: "aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa1"
              authored_at: 2026-01-01T00:00:00Z
              additions: 5
            - sha: "bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb2"
              authored_at: 2026-01-02T00:00:00Z
              files_changed: 4
      unresolved: []
      excluded: []

  - name: one-unresolved-commit-does-not-hold-back-an-accepted-anchor
    pull_request:
      base_repo: village
      head_ref: feat/picker
      commit_set_complete: true
      commits:
        - "aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa1"
    candidates:
      - transcript: t-mixed
        git_remote: github.com/peasant-labs/village.git
        session_start: 2026-01-01T00:00:00Z
        commits:
          - sha: "deadbeefdeadbeefdeadbeefdeadbeefdeadbeef"
          - sha: "aaaaaaa"
    expect:
      accepted:
        - transcript: t-mixed
          anchors: ["aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa1"]
          unresolved:
            deadbeefdeadbeefdeadbeefdeadbeefdeadbeef: not_in_pull_request
      unresolved: []
      excluded: []

  - name: incomplete-commit-set-resolves-only-exact-full-sha
    pull_request:
      base_repo: village
      head_ref: feat/picker
      # The default. The returned page holds one commit; a second commit that
      # shares the short SHA "abc1234" would have been on the page the fetch did
      # not follow, so nothing here may be called absent or unambiguous.
      commits: ["abc1234000000000000000000000000000000001"]
    candidates:
      - transcript: t-exact
        git_remote: github.com/peasant-labs/village.git
        session_start: 2026-01-01T00:00:00Z
        commits:
          - sha: "abc1234000000000000000000000000000000001"
      - transcript: t-short-collision
        git_remote: github.com/peasant-labs/village.git
        session_start: 2026-01-02T00:00:00Z
        commits:
          - sha: "abc1234"
      - transcript: t-absent
        git_remote: github.com/peasant-labs/village.git
        session_start: 2026-01-03T00:00:00Z
        commits:
          - sha: "ffffffffffffffffffffffffffffffffffffffff"
    expect:
      accepted:
        - transcript: t-exact
          anchors: ["abc1234000000000000000000000000000000001"]
      unresolved:
        - transcript: t-short-collision
          branch_matched: false
          reasons:
            abc1234: incomplete_commit_list
        - transcript: t-absent
          branch_matched: false
          reasons:
            ffffffffffffffffffffffffffffffffffffffff: incomplete_commit_list
      excluded: []

  # The repository gate compares the normalized NAME and not the owner: a remote
  # under another owner that carries the same repository name names the repository.
  # It is the same equality the publish hook applies, and the reason a fork (whose
  # clone keeps the name and changes the owner) can match its own attachment.
  - name: repository-name-is-the-comparison-not-the-owner
    pull_request:
      base_repo: village
      head_ref: feat/picker
      commit_set_complete: true
      commits:
        - "aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa1"
    candidates:
      - transcript: t-same-name-other-owner
        project_name: /workspace/fork-of-village
        git_remote: github.com/someone-else/village.git
        git_branch: feat/something-else
        session_start: 2026-01-01T00:00:00Z
        commits:
          - sha: "aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa1"
            authored_at: 2026-01-02T03:04:05Z
            additions: 4
            deletions: 1
            files_changed: 1
    expect:
      accepted:
        - transcript: t-same-name-other-owner
          anchors: ["aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa1"]
          anchor_details:
            - sha: "aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa1"
              authored_at: 2026-01-02T03:04:05Z
              additions: 4
              deletions: 1
              files_changed: 1
      unresolved: []
      excluded: []

