# Named digest cases. Each case is accepted input (the matcher owns acceptance)
# plus the header the builder must produce. Rendered output is pinned separately
# under testdata/golden/, one file per case and tier (regenerate with -update,
# never by hand).
#
# villageUrl is the pull request's page on village, which the renderer links as
# "view on village" and from every row it does not list. Each session also
# carries what the pull request says about its transcript besides its prompts:
# title, author (a village handle), and listed, which is true only for a
# transcript anyone can read. Only a listed transcript's title and prompts may
# appear in a render; absent lists the text that must appear in no render at
# any tier, and present lists text that must appear in every render.
cases:
  - name: short_session
    villageUrl: https://village.example/pulls/acme/widgets/7
    commitSet:
      - a1b2c3d4e5f6a7b8c9d0e1f2a3b4c5d6e7f8a9b0
      - "1111111111111111111111111111111111111111"
      - "2222222222222222222222222222222222222222"
    sessions:
      - transcriptId: 7b1e4d2a-9c3f-4e8b-a1d6-2f5c8e9a0b13
        harness: claude-code
        redactionLevel: standard
        sessionStart: "2026-09-06T14:00:00Z"
        title: Fix flaky ingest test
        author: alice-dev
        listed: true
        turns:
          - {index: 0, role: user, content: "first ask", timestamp: "2026-09-06T14:02:00Z"}
          - {index: 1, role: user, content: "run the plan", timestamp: "2026-09-06T14:02:30Z", command: {name: "/superpowers:brainstorming", args: the header story}}
          - {index: 2, role: assistant, content: "working on it", timestamp: "2026-09-06T14:03:00Z"}
          - {index: 3, role: user, content: "second ask with <REDACTED>", timestamp: "2026-09-06T14:05:00Z"}
    commits:
      - {transcriptId: 7b1e4d2a-9c3f-4e8b-a1d6-2f5c8e9a0b13, commitSha: a1b2c3d, authoredAt: "2026-09-06T14:04:00Z", additions: 10, deletions: 2, filesChanged: 3}
      - {transcriptId: 7b1e4d2a-9c3f-4e8b-a1d6-2f5c8e9a0b13, commitSha: deadbeefdeadbeefdeadbeefdeadbeefdeadbeef, authoredAt: "2026-09-06T14:06:00Z"}
    expected:
      sessionCount: 1
      promptCount: 2
      commitsCovered: 1
      commitsTotal: 3
      harness: claude-code
      redactionLevel: standard
      skills:
        - {name: "/superpowers:brainstorming", invocationCount: 1}
      present: ["Fix flaky ingest test", "first ask"]
      absent: ["redaction", "standard"]

