        redactionLevel: standard
        sessionStart: "2026-09-06T14:00:00Z"
        title: "Fix | the `table` <script>alert(1)</script> [click](https://evil.example) @mallory #12"
        author: "eve|`<b>`"
        listed: true
        turns:
          - {index: 0, role: user, content: "- a list?\n# a heading\n1. an ordinal | a pipe `code` <img src=x onerror=alert(1)> [x](https://evil.example) ![i](https://evil.example/i.png) @mallory owner/repo#34 $x^2$ **bold** ~~gone~~ &amp; \\escaped", timestamp: "2026-09-06T14:02:00Z"}
