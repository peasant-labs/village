# Who may learn that a transcript is in a collective, and what the three
# contribution counters say.
#
# Every case builds one collective, one project and one or more transcripts,
# drives the real share handlers through the declared steps, and then asks all
# four surfaces the same question as the declared viewer:
#
#   transcript_collectives  GET /transcripts/{id}/collectives, through the HTTP
#                           handler with a real viewer session
#   project_rollup          ListProjectCollectiveRollup, the query the project
#                           page calls
#   contributions           GET /users/me/collectives/contributions, always as
#                           the owner, because that route takes the caller's own
#                           id and has no other viewer
#   search_collectives      the shipped SearchCollectives, used as the ORACLE:
#                           the new surfaces must agree with it about collective
#                           visibility on this same corpus, which is what proves
#                           the copied predicate equivalent rather than merely
#                           similar
#
# The oracle is only comparable when the contributor opt-in is satisfied, since
# SearchCollectives has no opt-in gate. The two cases where it is not satisfied
# say so in their `why`.
#
# transcript_visibility is stated on every case rather than defaulted: it is a
# gate BEFORE the collectives list, and a case that silently inherited "public"
# would hide the difference.

- name: public_collective_listed_for_anonymous_viewer
  why: a collective whose data is public is visible to everyone, so a signed-out reader sees the membership
  collective: {data_access: public, acceptance_mode: curated}
  owner_is_discoverable: true
  transcript_visibility: public
  transcripts:
    - steps: [submit, approve]
  viewer: anonymous
  expect:
    transcript_collectives: listed
    project_rollup: listed
    project_rollup_transcript_count: 1
    search_collectives: visible
    contributions_listed: true
    approved_count: 1
    pending_count: 0
    rejected_attempt_count: 0

- name: public_collective_listed_for_other_signed_in_viewer
  why: signing in must not narrow what a public collective shows
  collective: {data_access: public, acceptance_mode: curated}
  owner_is_discoverable: true
  transcript_visibility: public
  transcripts:
    - steps: [submit, approve]
  viewer: other
  expect:
    transcript_collectives: listed
    project_rollup: listed
    project_rollup_transcript_count: 1
    search_collectives: visible
    contributions_listed: true
    approved_count: 1
    pending_count: 0
    rejected_attempt_count: 0

- name: public_collective_listed_for_contributing_owner
  why: the person who contributed always sees where their transcript went
  collective: {data_access: public, acceptance_mode: curated}
  owner_is_discoverable: true
  transcript_visibility: public
  transcripts:
    - steps: [submit, approve]
  viewer: owner
  expect:
    transcript_collectives: listed
    project_rollup: listed
    project_rollup_transcript_count: 1
    search_collectives: visible
    contributions_listed: true
    approved_count: 1
    pending_count: 0
    rejected_attempt_count: 0

- name: open_collective_listed_for_anonymous_viewer
  why: an open collective anyone may join is not a secret, even when its data access is members only
  collective: {data_access: members_only, acceptance_mode: open}
  owner_is_discoverable: true
  transcript_visibility: public
  transcripts:
    - steps: [submit]
  viewer: anonymous
  expect:
    transcript_collectives: listed
    project_rollup: listed
    project_rollup_transcript_count: 1
    search_collectives: visible
    contributions_listed: true
    approved_count: 1
    pending_count: 0
    rejected_attempt_count: 0

- name: open_collective_listed_for_other_signed_in_viewer
  why: the open branch of the predicate does not depend on who is asking
  collective: {data_access: members_only, acceptance_mode: open}
  owner_is_discoverable: true
  transcript_visibility: public
  transcripts:
    - steps: [submit]
  viewer: other
  expect:
    transcript_collectives: listed
    project_rollup: listed
    project_rollup_transcript_count: 1
    search_collectives: visible
    contributions_listed: true
    approved_count: 1
    pending_count: 0
    rejected_attempt_count: 0

- name: members_only_collective_hidden_from_anonymous_viewer
  why: dropping the viewer predicate would announce a private collective to the whole internet; this is the case that catches it
  collective: {data_access: members_only, acceptance_mode: curated}
  owner_is_discoverable: true
  transcript_visibility: public
  transcripts:
    - steps: [submit, approve]
  viewer: anonymous
  expect:
    transcript_collectives: absent
    project_rollup: absent
    project_rollup_transcript_count: 0
    search_collectives: hidden
    contributions_listed: true
    approved_count: 1
    pending_count: 0
    rejected_attempt_count: 0

- name: members_only_collective_hidden_from_non_member_viewer
  why: being signed in is not membership, and the predicate must distinguish the two
  collective: {data_access: members_only, acceptance_mode: curated}
  owner_is_discoverable: true
  transcript_visibility: public
  transcripts:
    - steps: [submit, approve]
  viewer: other
  expect:
    transcript_collectives: absent
    project_rollup: absent
    project_rollup_transcript_count: 0
    search_collectives: hidden
    contributions_listed: true
    approved_count: 1
    pending_count: 0
    rejected_attempt_count: 0

- name: members_only_collective_listed_for_member_viewer
  why: a member of the collective may see what it holds; without this case the predicate could be reduced to a blanket hide and stay green
  collective: {data_access: members_only, acceptance_mode: curated}
  owner_is_discoverable: true
  transcript_visibility: public
  transcripts:
    - steps: [submit, approve]
  viewer: member
  expect:
    transcript_collectives: listed
    project_rollup: listed
    project_rollup_transcript_count: 1
    search_collectives: visible
    contributions_listed: true
    approved_count: 1
    pending_count: 0
    rejected_attempt_count: 0

- name: members_only_collective_listed_for_contributing_owner
  why: submitting requires membership, so a contributor to a members-only collective sees it through the member branch
  collective: {data_access: members_only, acceptance_mode: curated}
  owner_is_discoverable: true
  transcript_visibility: public
  transcripts:
    - steps: [submit, approve]
  viewer: owner
  expect:
    transcript_collectives: listed
    project_rollup: listed
    project_rollup_transcript_count: 1
    search_collectives: visible
    contributions_listed: true
    approved_count: 1
    pending_count: 0
    rejected_attempt_count: 0

- name: collective_with_only_pending_shares
  why: a collective holding nothing but submissions awaiting review IS listed among the contributions, with approved_count zero; a join that filtered on approved status would drop the row and the person would never learn what they are waiting on
  collective: {data_access: public, acceptance_mode: curated}
  owner_is_discoverable: true
  transcript_visibility: public
  transcripts:
    - steps: [submit]
  viewer: owner
  expect:
    transcript_collectives: absent
    project_rollup: absent
    project_rollup_transcript_count: 0
    search_collectives: visible
    contributions_listed: true
    approved_count: 0
    pending_count: 1
    rejected_attempt_count: 0

- name: collective_with_rejected_share
  why: a refused submission is not a membership, and the refusal is still counted
  collective: {data_access: public, acceptance_mode: curated}
  owner_is_discoverable: true
  transcript_visibility: public
  transcripts:
    - steps: [submit, reject]
  viewer: owner
  expect:
    transcript_collectives: absent
    project_rollup: absent
    project_rollup_transcript_count: 0
    search_collectives: visible
    contributions_listed: true
    approved_count: 0
    pending_count: 0
    rejected_attempt_count: 1

- name: collective_with_repeatedly_rejected_share
  why: one transcript refused twice is TWO refusals; counting distinct transcripts instead of events would report one and hide that the collective keeps saying no
  collective: {data_access: public, acceptance_mode: curated}
  owner_is_discoverable: true
  transcript_visibility: public
  transcripts:
    - steps: [submit, reject, submit, reject]
  viewer: owner
  expect:
    transcript_collectives: absent
    project_rollup: absent
    project_rollup_transcript_count: 0
    search_collectives: visible
    contributions_listed: true
    approved_count: 0
    pending_count: 0
    rejected_attempt_count: 2

- name: collective_with_only_retracted_shares
  why: a withdrawn contribution counts in none of the three counters, and it is not a membership either
  collective: {data_access: public, acceptance_mode: curated}
  owner_is_discoverable: true
  transcript_visibility: public
  transcripts:
    - steps: [submit, approve, unshare]
  viewer: owner
  expect:
    transcript_collectives: absent
    project_rollup: absent
    project_rollup_transcript_count: 0
    search_collectives: visible
    contributions_listed: true
    approved_count: 0
    pending_count: 0
    rejected_attempt_count: 0

- name: collective_with_only_revoked_shares
  why: a contribution the collective removed counts in none of the three counters, and removal is not a refusal
  collective: {data_access: public, acceptance_mode: curated}
  owner_is_discoverable: true
  transcript_visibility: public
  transcripts:
    - steps: [submit, approve, remove]
  viewer: owner
  expect:
    transcript_collectives: absent
    project_rollup: absent
    project_rollup_transcript_count: 0
    search_collectives: visible
    contributions_listed: true
    approved_count: 0
    pending_count: 0
    rejected_attempt_count: 0

- name: approved_count_counts_transcripts_not_attempts
  why: the ONE case where counting transcripts and counting events genuinely diverge - this transcript was accepted, withdrawn and accepted again, so there are two acceptance events but only one contribution
  collective: {data_access: public, acceptance_mode: curated}
  owner_is_discoverable: true
  transcript_visibility: public
  transcripts:
    - steps: [submit, approve, unshare, submit, approve]
  viewer: owner
  expect:
    transcript_collectives: listed
    project_rollup: listed
    project_rollup_transcript_count: 1
    search_collectives: visible
    contributions_listed: true
    approved_count: 1
    pending_count: 0
    rejected_attempt_count: 0

- name: collective_with_approved_and_pending_transcripts
  why: the two live counters are independent, and a collective can hold one of each at the same time
  collective: {data_access: public, acceptance_mode: curated}
  owner_is_discoverable: true
  transcript_visibility: public
  transcripts:
    - steps: [submit, approve]
    - steps: [submit]
  viewer: owner
  expect:
    transcript_collectives: listed
    project_rollup: listed
    project_rollup_transcript_count: 1
    search_collectives: visible
    contributions_listed: true
    approved_count: 1
    pending_count: 1
    rejected_attempt_count: 0

- name: shared_transcript_hidden_from_anonymous_viewer
  why: transcript visibility gates the request BEFORE collective visibility does; a signed-out reader cannot ask about a transcript that is not public, and the answer must not distinguish that from a transcript that does not exist
  collective: {data_access: public, acceptance_mode: open}
  owner_is_discoverable: true
  transcript_visibility: shared
  transcripts:
    - steps: [submit]
  viewer: anonymous
  expect:
    transcript_collectives: not_found
    project_rollup: listed
    project_rollup_transcript_count: 1
    search_collectives: visible
    contributions_listed: true
    approved_count: 1
    pending_count: 0
    rejected_attempt_count: 0

- name: opted_out_owner_hidden_from_other_viewer_though_collective_is_public
  why: the opt-in gate is independent of collective visibility - the collective itself is visible to this viewer through the search oracle, and the memberships are still withheld, so the oracle comparison deliberately does not apply here
  collective: {data_access: public, acceptance_mode: curated}
  owner_is_discoverable: false
  transcript_visibility: public
  transcripts:
    - steps: [submit, approve]
  viewer: other
  expect:
    transcript_collectives: absent
    project_rollup: absent
    project_rollup_transcript_count: 0
    search_collectives: visible
    contributions_listed: true
    approved_count: 1
    pending_count: 0
    rejected_attempt_count: 0

- name: opted_out_owner_still_sees_their_own_memberships
  why: opting out of being listed as a contributor hides you from other people, not from yourself
  collective: {data_access: public, acceptance_mode: curated}
  owner_is_discoverable: false
  transcript_visibility: public
  transcripts:
    - steps: [submit, approve]
  viewer: owner
  expect:
    transcript_collectives: listed
    project_rollup: listed
    project_rollup_transcript_count: 1
    search_collectives: visible
    contributions_listed: true
    approved_count: 1
    pending_count: 0
    rejected_attempt_count: 0
