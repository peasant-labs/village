# The no-N+1 guard for the pull request summaries. The three surfaces a page of
# summaries is read from - the flat transcript list and the flat and grouped
# collective reads - must each answer a page of `page_sizes[0]` rows and a page
# of `page_sizes[1]` rows with the SAME number of database queries, counted at
# the connection pool. (The helper-member expansion fills its page through the
# same function as the grouped read.) A query per row - the realistic regression, one extra read added later
# for one more field - makes the larger page cost more and fails its case.
#
# Each page is built the same way: two authors in turn publish that many public
# transcripts, each shared with a public collective, tagged with the page's tag
# and a tag of its own, and bound to one attached pull request in a private
# repository and one in a public repository; a member of the collective reads
# the page (the list by the page's tag). Every row must then carry a summary of
# two, its own owner, and its own tags, and the collective surfaces a count of
# twice the page size, so a guard that passed on empty or misplaced reads would
# fail here instead.
page_sizes: [1, 50]
cases:
  - {name: the-transcript-list-costs-the-same-for-one-row-and-fifty, surface: list}
  - {name: the-flat-collective-read-costs-the-same-for-one-row-and-fifty, surface: collective}
  - {name: the-grouped-collective-read-costs-the-same-for-one-row-and-fifty, surface: collective_grouped}
