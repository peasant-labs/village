  - name: stored_edge_whitespace_raw_refused
    content: '{"id":"stored-edge","harness":"codex","startTime":"2026-01-01T00:00:00Z","endTime":"2026-01-01T00:01:00Z","durationMins":1,"tokensIn":60,"tokensOut":40,"totalTokens":100,"toolCallCount":0,"turnCount":1,"thinkingLevelRaw":"max ","turns":[{"index":0,"role":"assistant","timestamp":"2026-01-01T00:00:01Z","depth":0,"content":"hi"}]}'
    wantError: thinkingLevelRaw
