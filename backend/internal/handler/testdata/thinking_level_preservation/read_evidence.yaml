rewriteFailures:
  - name: level_bearing_blob_write_failure_denies
    contentCase: enriched_session_seed_and_per_turn_canonical_and_raw
    failure: blob_write
    wantStatus: 500
    wantLevels: false
  - name: legacy_blob_write_failure_serves
    contentCase: legacy_without_levels_stays_absent
    failure: blob_write
    wantStatus: 200
    wantLevels: false
