# Stored-read thinking-level validation. Previously stored invalid values are
# refused after migrate-on-read with no rewrite; the corrected blob reads back
# with the exact value. rewriteFailures pins that a level-bearing rewrite that
# cannot be installed is denied rather than served without its evidence.
reads:
  - name: stored_user_turn_level_refused
    content: '{"id":"stored-user","harness":"codex","startTime":"2026-01-01T00:00:00Z","endTime":"2026-01-01T00:01:00Z","durationMins":1,"tokensIn":60,"tokensOut":40,"totalTokens":100,"toolCallCount":0,"turnCount":1,"turns":[{"index":0,"role":"user","timestamp":"2026-01-01T00:00:01Z","depth":0,"content":"hi","thinkingLevel":"high"}]}'
