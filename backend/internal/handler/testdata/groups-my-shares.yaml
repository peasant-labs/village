# What one person's own "Your contributions" card shows for a collective,
# driven through the real ListMyGroupShares HTTP handler against a real
# PostgreSQL.
#
# The frontend folds a submitted child session under its parent by matching
# parent_transcript_id against a row's id. The server resolves that id from
# parent_session_id within the row's owner (local_id alone is only unique per
# owner), and sends null when the viewer may not read the parent, so no owner
# account id has to reach the wire. Every row carries its owner as the viewer
# may see them, local_id, parent_session_id and parent_transcript_id.
#
# expect_parent_transcript_of names, per child, the transcript whose id
# parent_transcript_id must carry, or "none" for null.

- name: parent_and_child_shared
  why: >
    The caller offered both a parent transcript and a child session it
    spawned to the same collective. The card has to carry each row's
    owner_id, local_id, and parent_session_id so it can fold the child under
    its parent instead of listing two unrelated contributions.
  transcripts:
    - {key: parent, project: p}
    - {key: child, project: p, parent: parent}
  submit: [parent, child]
  expect_rows: [parent, child]
  expect_parent_of: {child: parent}
  expect_parent_transcript_of: {child: parent}

- name: lone_child_parent_absent
  why: >
    The caller offered only a child session; its parent was never submitted
    to this collective. The row still names the parent's local_id so the
    card can tell "no matching row" apart from "no parent at all" using its
    own data rather than guessing.
  transcripts:
    - {key: parent, project: p}
    - {key: child, project: p, parent: parent}
  submit: [child]
  expect_rows: [child]
  expect_parent_of: {child: parent}
  # The caller owns the unsubmitted parent, so they may still read it.
  expect_parent_transcript_of: {child: parent}
