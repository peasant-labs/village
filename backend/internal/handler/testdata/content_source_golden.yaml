# Corpus for the served-byte golden of the positioned transcript reads. Each
# document is stored as plaintext behind the fake encrypted store and read
# through the production handlers: header, directory, every segment, and
# windows, for every segmented-read generation, for main and every history
# section, as an anonymous viewer (repository withheld) and as a viewer who may
# see the owner's profile. The recorded answers live in
# content_source_golden.json; any change to a served byte, status or ETag fails.
#
# `document` is the stored envelope verbatim. A document marked `stored_legacy`
# carries shapes the strict read validator now refuses (an absent recorded
# index, an absent turn array); it is indexed by the production content source
# directly and installed in the content cache, so the same handlers serve it. `generate`, when set, appends
# that many generated turns to the main partition (replacing the literal
# __GENERATED__ marker) so a partition crosses the segment budget without a
# multi-megabyte fixture. `flagged` lists the stored positions an open integrity
# flag names, which the header remaps through the cook's verdict.
