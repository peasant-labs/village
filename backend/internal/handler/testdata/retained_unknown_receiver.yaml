cases:
  - name: html_payload_below_actual_transport_limit
    text: '<>&'
    repeat: 500000
    expected_writes: 2
    status: 201
  - name: unicode_payload_below_actual_transport_limit
    text: "\u2028\u2029"
    repeat: 750000
    expected_writes: 1
    status: 201
  - name: actual_envelope_limit_minus_one
    final_bytes: 8388607
    expected_writes: 1
    status: 201
  - name: actual_envelope_limit_exact
    final_bytes: 8388608
    expected_writes: 1
    status: 201
  - name: actual_envelope_limit_plus_one
    final_bytes: 8388609
    expected_writes: 0
    status: 409
  - name: harmless_complete_embedded_json
    payload: '{"future": "{\"n\": 9007199254740993, \"message\": \"safe\"}"}'
    expected_writes: 2
    status: 201
  - name: ordinary_non_json_brace_text
    payload: '{"note":"{ ordinary prose, not JSON"}'
    expected_writes: 2
    status: 201
  - name: ordinary_trailing_json_like_text
    payload: '{"note":"[1] followed by ordinary prose"}'
    expected_writes: 2
    status: 201
