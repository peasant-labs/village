# The share-attempt lattice, driven through the real HTTP handlers against a
# real PostgreSQL.
#
# Every submission of a transcript to a collective is its own attempt. A
# rejection closes an attempt; submitting again opens the next one. The
# current-state row in transcript_shares is DERIVED from the latest attempt by a
# database trigger, so each case reads it back after every transition.
#
# derived: the state of the current-state row after the last step. It matches
# the latest attempt for pending, approved and rejected. It is `absent` for
# retracted and revoked, because the shipped current-state row carries only
# those three states and a withdrawn or removed contribution is not a share any
# more - the attempts table retains why.
#
# The four counts ARE the contract here, not a deletion guard: approved and
# pending count DISTINCT TRANSCRIPTS, because a transcript is either in a
# collective or not, while rejected counts ATTEMPTS, because three rejections of
# one transcript are three rejections. approved_attempts is carried alongside
# approved_transcripts so the one case where those two diverge is visible rather
# than inferred, and that case is named below.
#
# visibility: the transcript's visibility after the last step. Every case
# starts shared unless it names a start_visibility. An owner's unshare narrows a
# shared transcript to private once no collective holds a live submission of it
# (live: the latest attempt is pending or approved), and a share flips a private
# transcript to shared. A collective's own decision, removal, or a member
# leaving is not an owner's unshare, and moves no visibility.
#
# visibility_events: the visibility of each governance event the case's own
# steps wrote, in order. Every one must be a visibility change attributed to the
# owner.
#
# steps: submit (the owner offers the transcript), decide (the collective
# accepts or rejects the open attempt), unshare (the owner withdraws),
# remove (the collective removes an accepted contribution), leave_collective
# (the owner leaves and retracts), rewrite_terminal_attempt (an in-place edit of
# decided history, which must be refused), republish_left_private (the
# narrowing a republish commits before staging new content, with nothing
# restoring it afterwards), unshare_behind_the_publish_lock (the owner's unshare
# while another writer holds the transcript's publish lock). A step may name
# `inject: ledger_refusal`, which makes the attempt ledger refuse every write for
# the transcript during that step only, and `expect: failed` for a 500. A step
# acts on the first collective unless it names
# `collective: second`; a case that does states second_attempts, the second
# collective's own attempt sequence, and the counts stay those of the first.

- name: first_submission_to_open_collective
  why: an open collective accepts on submission, so the first attempt is already decided
  acceptance: open
  steps:
    - {do: submit, expect: ok}
  attempts: [approved]
  derived: approved
  visibility: shared
  visibility_events: []
  approved_transcripts: 1
  pending_transcripts: 0
  approved_attempts: 1
  rejected_attempts: 0

- name: first_submission_to_curated_collective
  why: a curated collective reviews first, so the first attempt is open
  acceptance: curated
  steps:
    - {do: submit, expect: ok}
  attempts: [pending]
  derived: pending
  visibility: shared
  visibility_events: []
  approved_transcripts: 0
  pending_transcripts: 1
  approved_attempts: 0
  rejected_attempts: 0

- name: rejected_then_resubmitted_then_rejected_again
  why: each rejection is its own instance, so two rejections of one transcript count twice
  acceptance: curated
  steps:
    - {do: submit, expect: ok}
    - {do: decide, status: rejected, expect: ok}
    - {do: submit, expect: ok}
    - {do: decide, status: rejected, expect: ok}
  attempts: [rejected, rejected]
  derived: rejected
  visibility: shared
  visibility_events: []
  approved_transcripts: 0
  pending_transcripts: 0
  approved_attempts: 0
  rejected_attempts: 2

- name: rejected_then_resubmitted_then_approved
  why: a rejection does not bar the transcript; the next submission can be accepted
  acceptance: curated
  steps:
    - {do: submit, expect: ok}
    - {do: decide, status: rejected, expect: ok}
    - {do: submit, expect: ok}
    - {do: decide, status: approved, expect: ok}
  attempts: [rejected, approved]
  derived: approved
  visibility: shared
  visibility_events: []
  approved_transcripts: 1
  pending_transcripts: 0
  approved_attempts: 1
  rejected_attempts: 1

- name: duplicate_submission_while_pending_refused
  why: a second submission while one is awaiting review is a duplicate, not a new instance
  acceptance: curated
  steps:
    - {do: submit, expect: ok}
    - {do: submit, expect: refused}
  attempts: [pending]
  derived: pending
  visibility: shared
  visibility_events: []
  approved_transcripts: 0
  pending_transcripts: 1
  approved_attempts: 0
  rejected_attempts: 0

- name: submission_while_approved_refused
  why: an accepted contribution is already there; offering it again would be a duplicate
  acceptance: open
  steps:
    - {do: submit, expect: ok}
    - {do: submit, expect: refused}
  attempts: [approved]
  derived: approved
  visibility: shared
  visibility_events: []
  approved_transcripts: 1
  pending_transcripts: 0
  approved_attempts: 1
  rejected_attempts: 0

- name: owner_unshare_of_approved_contribution
  why: withdrawing an accepted contribution appends the withdrawal rather than erasing the acceptance, and counts as no kind of rejection
  acceptance: open
  steps:
    - {do: submit, expect: ok}
    - {do: unshare, expect: ok}
  attempts: [approved, retracted]
  derived: absent
  visibility: private
  visibility_events: [private]
  approved_transcripts: 0
  pending_transcripts: 0
  approved_attempts: 1
  rejected_attempts: 0

- name: owner_unshare_of_pending_submission
  why: a submission still awaiting review was never decided, so withdrawing closes that same attempt
  acceptance: curated
  steps:
    - {do: submit, expect: ok}
    - {do: unshare, expect: ok}
  attempts: [retracted]
  derived: absent
  visibility: private
  visibility_events: [private]
  approved_transcripts: 0
  pending_transcripts: 0
  approved_attempts: 0
  rejected_attempts: 0

- name: unshare_while_pending_then_reshare
  why: withdrawing a submission must free the transcript to be offered again, or re-submission is blocked forever with no cause the user can see
  acceptance: curated
  steps:
    - {do: submit, expect: ok}
    - {do: unshare, expect: ok}
    - {do: submit, expect: ok}
  attempts: [retracted, pending]
  derived: pending
  visibility: shared
  visibility_events: [private, shared]
  approved_transcripts: 0
  pending_transcripts: 1
  approved_attempts: 0
  rejected_attempts: 0

- name: collective_removal_of_approved_contribution
  why: removal by the collective is kept distinct from withdrawal by the owner, and is no kind of rejection either
  acceptance: open
  steps:
    - {do: submit, expect: ok}
    - {do: remove, expect: ok}
  attempts: [approved, revoked]
  derived: absent
  visibility: shared
  visibility_events: []
  approved_transcripts: 0
  pending_transcripts: 0
  approved_attempts: 1
  rejected_attempts: 0

- name: reshare_after_revocation
  why: a removed contribution can be offered again as a new attempt rather than a resurrection of the old one
  acceptance: open
  steps:
    - {do: submit, expect: ok}
    - {do: remove, expect: ok}
    - {do: submit, expect: ok}
  attempts: [approved, revoked, approved]
  derived: approved
  visibility: shared
  visibility_events: []
  approved_transcripts: 1
  pending_transcripts: 0
  approved_attempts: 2
  rejected_attempts: 0

- name: leaving_the_collective_retracts_the_live_attempt
  why: a member who leaves and retracts leaves nothing of theirs live in that collective
  acceptance: open
  steps:
    - {do: submit, expect: ok}
    - {do: leave_collective, expect: ok}
  attempts: [approved, retracted]
  derived: absent
  visibility: shared
  visibility_events: []
  approved_transcripts: 0
  pending_transcripts: 0
  approved_attempts: 1
  rejected_attempts: 0

- name: terminal_attempt_update_refused
  why: decided history is the record of what was decided, so a changed decision is a new attempt rather than an edited one
  acceptance: open
  steps:
    - {do: submit, expect: ok}
    - {do: rewrite_terminal_attempt, expect: refused}
  attempts: [approved]
  derived: approved
  visibility: shared
  visibility_events: []
  approved_transcripts: 1
  pending_transcripts: 0
  approved_attempts: 1
  rejected_attempts: 0

- name: reshare_after_retraction_counts_one_transcript
  why: withdrawing and offering again is two attempts and the first acceptance is not overwritten; this is the one case where the two ways of counting diverge, because two accepted attempts of the SAME transcript are still one contribution
  acceptance: open
  steps:
    - {do: submit, expect: ok}
    - {do: unshare, expect: ok}
    - {do: submit, expect: ok}
  attempts: [approved, retracted, approved]
  derived: approved
  visibility: shared
  visibility_events: [private, shared]
  approved_transcripts: 1
  pending_transcripts: 0
  approved_attempts: 2
  rejected_attempts: 0

- name: competing_event_ordinal_answers_409_not_an_unexplained_failure
  why: >
    another writer records an event for the same pair that this submission cannot yet see, so the ordinal it computed
    is taken by the time it writes; that is a conflict the person clears by asking again, not a failure, and it must
    name the transcript and say so rather than reaching them as an unexplained error. The competing event is ACCEPTED,
    so the open-attempt index cannot fire and only the event-ordering constraint can produce this answer
  acceptance: open
  steps:
    - {do: competing_event_ordinal, expect: refused}
  attempts: [approved]
  derived: approved
  visibility: shared
  visibility_events: []
  approved_transcripts: 1
  pending_transcripts: 0
  approved_attempts: 1
  rejected_attempts: 0

- name: unshare_the_last_share_narrows_to_private
  why: >
    withdrawing the only live submission leaves 'shared' describing an audience that no longer exists, so the
    transcript returns to private rather than being handed to whichever collective it is offered to next
  acceptance: open
  start_visibility: private
  steps:
    - {do: submit, expect: ok}
    - {do: unshare, expect: ok}
  attempts: [approved, retracted]
  derived: absent
  visibility: private
  visibility_events: [shared, private]
  approved_transcripts: 0
  pending_transcripts: 0
  approved_attempts: 1
  rejected_attempts: 0

- name: unshare_one_of_two_keeps_it_shared
  why: >
    a transcript still accepted by another collective keeps that collective's audience, so withdrawing one of two
    contributions must not narrow it
  acceptance: open
  start_visibility: private
  steps:
    - {do: submit, expect: ok}
    - {do: submit, collective: second, expect: ok}
    - {do: unshare, expect: ok}
  attempts: [approved, retracted]
  second_attempts: [approved]
  derived: absent
  visibility: shared
  visibility_events: [shared]
  approved_transcripts: 0
  pending_transcripts: 0
  approved_attempts: 1
  rejected_attempts: 0

- name: unshare_one_of_two_while_the_other_awaits_review_keeps_it_shared
  why: >
    a submission awaiting review is live too, because it grants access the moment it is accepted; narrowing here
    would leave the other collective accepting a transcript none of its members can open
  acceptance: curated
  start_visibility: private
  steps:
    - {do: submit, expect: ok}
    - {do: submit, collective: second, expect: ok}
    - {do: unshare, expect: ok}
  attempts: [retracted]
  second_attempts: [pending]
  derived: absent
  visibility: shared
  visibility_events: [shared]
  approved_transcripts: 0
  pending_transcripts: 0
  approved_attempts: 0
  rejected_attempts: 0

- name: reshare_recovers_the_audience_a_republish_left_private
  why: >
    a republish whose outcome could not be confirmed leaves the transcript private with its submissions still live,
    so its collectives can no longer open it; sharing it to those same collectives again is how the owner gives them
    their access back, which must answer 200 and flip it to shared rather than refuse a duplicate and change nothing.
    No new attempt is opened, because the accepted one is still live
  acceptance: open
  start_visibility: private
  steps:
    - {do: submit, expect: ok}
    - {do: republish_left_private}
    - {do: submit, expect: ok}
  attempts: [approved]
  derived: approved
  visibility: shared
  visibility_events: [shared, private, shared]
  approved_transcripts: 1
  pending_transcripts: 0
  approved_attempts: 1
  rejected_attempts: 0

- name: unshare_twice_is_idempotent
  why: >
    a double click, or a retry after a lost answer, withdraws a pair that has nothing live any more; that must be a
    200 that changes nothing, not a second withdrawal the ledger refuses with a duplicate ordinal
  acceptance: open
  steps:
    - {do: submit, expect: ok}
    - {do: unshare, expect: ok}
    - {do: unshare, expect: ok}
  attempts: [approved, retracted]
  derived: absent
  visibility: private
  visibility_events: [private]
  approved_transcripts: 0
  pending_transcripts: 0
  approved_attempts: 1
  rejected_attempts: 0

- name: unshare_the_last_share_of_a_public_transcript_keeps_it_public
  why: >
    only shared describes an audience of collectives; a public transcript's audience does not depend on them, so
    withdrawing its last submission must not make it private
  acceptance: open
  start_visibility: public
  steps:
    - {do: submit, expect: ok}
    - {do: unshare, expect: ok}
  attempts: [approved, retracted]
  derived: absent
  visibility: public
  visibility_events: []
  approved_transcripts: 0
  pending_transcripts: 0
  approved_attempts: 1
  rejected_attempts: 0

- name: a_refused_unshare_answers_500_and_changes_nothing
  why: >
    a withdrawal the database refuses used to be discarded and answered 200, so the owner believed a collective had
    lost access it still had; it must be reported, and the submission and the visibility must stay as they were
  acceptance: open
  start_visibility: private
  steps:
    - {do: submit, expect: ok}
    - {do: unshare, inject: ledger_refusal, expect: failed}
  attempts: [approved]
  derived: approved
  visibility: shared
  visibility_events: [shared]
  approved_transcripts: 1
  pending_transcripts: 0
  approved_attempts: 1
  rejected_attempts: 0

- name: unshare_waits_for_the_publish_lock
  why: >
    the withdrawal and the narrowing it implies must not interleave with a share or a republish of the same
    transcript, so the unshare takes the same publish lock they hold and waits for it
  acceptance: open
  steps:
    - {do: submit, expect: ok}
    - {do: unshare_behind_the_publish_lock, expect: ok}
  attempts: [approved, retracted]
  derived: absent
  visibility: private
  visibility_events: [private]
  approved_transcripts: 0
  pending_transcripts: 0
  approved_attempts: 1
  rejected_attempts: 0

- name: duplicate_share_of_a_public_transcript_refused
  why: >
    the recovery that answers 200 is for a private transcript only; a public transcript whose submission is live
    already loses nothing, so offering it again is the duplicate it always was
  acceptance: open
  start_visibility: public
  steps:
    - {do: submit, expect: ok}
    - {do: submit, expect: refused}
  attempts: [approved]
  derived: approved
  visibility: public
  visibility_events: []
  approved_transcripts: 1
  pending_transcripts: 0
  approved_attempts: 1
  rejected_attempts: 0
