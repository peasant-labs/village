# Anonymous discovery reads against the shared inventory. Each case asserts the
# EXACT ordered ids for one page plus the wire metadata the response must
# preserve: total, the echoed page, and the normalized limit. The private row
# (u6) is never expected and total is always 5, proving visibility filtering.
# Adjacent pages of the same sort partition the full ordering with no duplicate,
# omission, or leak. The limit cases pin wire normalization: the Village UI limit
# 24 is preserved verbatim, while an out-of-bounds limit (below 1 or above 100)
# normalizes to 20. The echoed page always equals the requested page (including
# the positive out-of-range page).
#
# Full deterministic orderings (public rows only):
#   recent   : u5, u4, u3, u2, u1
#   turns    : u4, u3, u2, u1, u5
#   tokens   : u5, u2, u3, u1, u4
#   duration : u5, u4, u2, u1, u3
- name: recent_page1
  sort: ""
  page: 1
  limit: 2
  expectedTotal: 5
  expectedPage: 1
  expectedLimit: 2
  expectedIds:
    - "55555555-5555-5555-5555-555555555555"
    - "44444444-4444-4444-4444-444444444444"
- name: recent_page2
  sort: ""
  page: 2
