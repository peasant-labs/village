# Anonymous discovery reads against the shared inventory. Each case asserts the
# EXACT ordered ids for one page and the total. The private row (u6) is never
# expected and total is always 5, proving visibility filtering. Adjacent pages of
# the same sort partition the full ordering with no duplicate, omission, or leak.
#
# Full deterministic orderings (public rows only):
#   recent   : u5, u4, u3, u2, u1
#   turns    : u4, u3, u2, u1, u5
#   tokens   : u5, u2, u3, u1, u4
#   duration : u5, u4, u2, u1, u3
- name: recent_page1
  sort: ""
  page: 1
  limit: 2
  expectedTotal: 5
  expectedIds:
    - "55555555-5555-5555-5555-555555555555"
    - "44444444-4444-4444-4444-444444444444"
- name: recent_page2
  sort: ""
  page: 2
  limit: 2
  expectedTotal: 5
  expectedIds:
    - "33333333-3333-3333-3333-333333333333"
    - "22222222-2222-2222-2222-222222222222"
- name: recent_page3
  sort: ""
  page: 3
  limit: 2
  expectedTotal: 5
  expectedIds:
    - "11111111-1111-1111-1111-111111111111"
- name: recent_page4_out_of_range_positive
  sort: ""
  page: 4
  limit: 2
  expectedTotal: 5
  expectedIds: []
