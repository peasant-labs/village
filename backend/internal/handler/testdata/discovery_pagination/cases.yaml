# Anonymous discovery reads against the shared inventory. Each case asserts the
# EXACT ordered ids for one page plus the wire metadata the response must
# preserve: total, the echoed page, and the echoed per_page. The private row
# (r30) is never expected and total is always 29, proving visibility filtering.
#
# The page size is the closed schema.AllPageSizes set: 25, 50, and 100. Pages are
# not clamped by the server — an out-of-range page is echoed with no rows, and
# the client requests the last page in a second step. Adjacent pages of the same
# sort partition the full ordering with no duplicate, omission, or leak, and the
# first page's `next_items` are the second page's rows.
#
# Full deterministic orderings (public rows only) are stated by the cases.
