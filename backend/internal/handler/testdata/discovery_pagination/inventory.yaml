# Shared discovery dataset for the deterministic-pagination integration test.
# Thirty rows: twenty-nine public and one private. Rows are crafted so each sort
# mode exercises three tie-break shapes:
#   * a pure primary-key tie   (equal primary sort AND equal published_at),
#   * a published_at tie-break (equal primary sort, different published_at),
#   * NULLS LAST                (a null optional metric sorts last).
# published_at values collide deliberately (T+0, T+1000, T+2000) so the id
# tie-breaker is the only thing that makes membership deterministic. Two pages of
# 25 are real: page one holds 25 rows and page two holds the remaining 4, so the
# adjacent-page partition and `next_items` are exercised rather than assumed.
# The private row (r30) sorts first if it ever leaks, and must never appear in an
# anonymous listing, proving visibility filtering still applies through the
# snapshot/order path.
