- name: unchanged_corpus_is_valid

- name: missing_accepted_menu_is_refused
  remove_needle: "user, agent, unknown"
  expected_error_contains: "user, agent, unknown"

- name: missing_storage_assurance_is_refused
  remove_needle: "nothing was stored"
  expected_error_contains: "nothing was stored"

- name: missing_retry_instruction_is_refused
  remove_needle: "publish again"
  expected_error_contains: "publish again"

- name: missing_all_needles_is_refused
  clear_needles: true
  expected_error_contains: "user, agent, unknown"

- name: changed_declaration_requires_matching_echo
  declared_origin: automaton
  expected_error_contains: automaton

- name: extra_unregistered_needle_is_allowed
  append_needle: "contact support with the refusal details"
