# How each pull envelope shows the owner of a pullable transcript and the
# author of its annotation. Visibility is decided by the owner read (one SQL
# statement, covered against PostgreSQL by public-owner-visibility.yaml); here
# the owner read answers owner_visible and author_visible, and each envelope
# must render that answer without leaking anything it withholds.
#
# header:         the Peasant-Pull-Contract values sent; [] sends none.
# owner_visible:  whether the caller may see the transcript owner's profile.
# author:         owner, when the owner wrote the annotation; or other, a
#                 second person, so the author's name and the owner's
#                 repository withholding are decided independently.
# author_visible: whether the caller may see that other author (author:
#                 other only).
# envelope:       the envelope served.
#
# A hidden person must never appear by id, username, display name or avatar
# in any pull response of either envelope. Beside a hidden owner, the
# transcript's project name, the annotation's project hash and the content's
# repository values are withheld too, whoever wrote the annotation. In 0.2.0 a
# hidden person is an empty id beside "anon"; in 0.3.0 it is
# {"kind":"anonymous"}. A hidden human author's annotatorName is "anon".

- {name: legacy_without_header_hides_owner, header: [], owner_visible: false, author: owner, envelope: "0.2.0"}
- {name: legacy_requested_hides_owner, header: ["0.2.0"], owner_visible: false, author: owner, envelope: "0.2.0"}
- {name: legacy_malformed_header_hides_owner, header: ["0.3"], owner_visible: false, author: owner, envelope: "0.2.0"}
- {name: public_owner_hides_owner, header: ["0.3.0"], owner_visible: false, author: owner, envelope: "0.3.0"}
- {name: public_owner_patch_hides_owner, header: ["0.3.4"], owner_visible: false, author: owner, envelope: "0.3.0"}
- {name: legacy_shows_visible_owner, header: [], owner_visible: true, author: owner, envelope: "0.2.0"}
- {name: public_owner_shows_visible_owner, header: ["0.3.0"], owner_visible: true, author: owner, envelope: "0.3.0"}
- {name: legacy_visible_author_on_hidden_owner, header: [], owner_visible: false, author: other, author_visible: true, envelope: "0.2.0"}
- {name: public_owner_visible_author_on_hidden_owner, header: ["0.3.0"], owner_visible: false, author: other, author_visible: true, envelope: "0.3.0"}
- {name: legacy_hidden_author_on_visible_owner, header: [], owner_visible: true, author: other, author_visible: false, envelope: "0.2.0"}
- {name: public_owner_hidden_author_on_visible_owner, header: ["0.3.0"], owner_visible: true, author: other, author_visible: false, envelope: "0.3.0"}
