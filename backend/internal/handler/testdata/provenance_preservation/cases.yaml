          {"index":0,"role":"user","entryType":"text","sourceEntryRef":"e_u1","content":"fix parser","timestamp":"2023-11-14T22:13:21Z","depth":0,"provenance":{"origin":"submitted_input","actor":"unknown","delivery":"session_admission","ownership":"local","evidence":"native_typed","inputModality":"text","submissionRef":"s_u1"}},
