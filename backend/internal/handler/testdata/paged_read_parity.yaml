# The paged-read parity family. `names` is the required-name manifest of the
# family's executed names; `detections` maps each perturbation the comparer's
# self-test injects to the finding kind it must be detected as; `corpus` is the
# required-name manifest of the synthetic parity corpus, one name per
# (row state, audience kind) pair. The corpus names are generated from the two
# closed sets in transcript_read_shapes.go; a member added to either set adds a
# generated name that is missing here, and the coverage case fails until the
# member's cases are listed (and so run).
names:
  - parity-every-shape-matches-content
  - parity-corpus-covers-closed-shape-set
  - parity-detects-perturbed-rows
  - parity-detects-perturbed-ref-span
  - parity-detects-off-by-one-page
  - parity-detects-refused-shape
  - parity-detects-wrong-number
  - parity-privacy-no-content-logged
detections:
  - name: parity-detects-perturbed-rows
    perturbation: perturbed-rows
    kind: rows
  - name: parity-detects-perturbed-ref-span
    perturbation: perturbed-ref-span
    kind: ref_span
  - name: parity-detects-off-by-one-page
    perturbation: off-by-one-page
    kind: page
  - name: parity-detects-refused-shape
    perturbation: refused-shape
    kind: refusal
  - name: parity-detects-wrong-number
    perturbation: wrong-number
    kind: number
corpus:
  - parity-shape-n-public
  - parity-shape-n-owner
  - parity-shape-n-collective-member
  - parity-shape-n-collective-owner-preview
  - parity-shape-n2-l4-public
  - parity-shape-n2-l4-owner
  - parity-shape-n2-l4-collective-member
  - parity-shape-n2-l4-collective-owner-preview
  - parity-shape-l1-public
  - parity-shape-l1-owner
  - parity-shape-l1-collective-member
  - parity-shape-l1-collective-owner-preview
  - parity-shape-l2-public
  - parity-shape-l2-owner
  - parity-shape-l2-collective-member
  - parity-shape-l2-collective-owner-preview
  - parity-shape-l3-public
  - parity-shape-l3-owner
  - parity-shape-l3-collective-member
  - parity-shape-l3-collective-owner-preview
  - parity-shape-l1m-public
  - parity-shape-l1m-owner
  - parity-shape-l1m-collective-member
  - parity-shape-l1m-collective-owner-preview
  - parity-shape-l1d-public
  - parity-shape-l1d-owner
  - parity-shape-l1d-collective-member
  - parity-shape-l1d-collective-owner-preview
