# Invalid publish request payloads for error case testing
# These should fail validation

- name: "missing_session_id"
  description: "Missing required sessionId"
  expectedError: "missing properties: 'sessionId'"
  identity:
    schemaVersion: 2
  model:
    provider: "openai"
    model: "gpt-4"
  timestamp:
    start: 1700000000000
    end: 1700000060000
  source:
    filePath: "/path/to/transcript.jsonl"
    format: "jsonl"
  stats:
    turnCount: 10

- name: "missing_provider"
  description: "Missing required provider"
