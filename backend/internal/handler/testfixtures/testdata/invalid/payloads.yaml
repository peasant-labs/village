    start: -1000
    end: -500
  source:
    filePath: "/path/to/transcript.jsonl"
    format: "jsonl"
  stats:
    turnCount: 10

- name: "invalid_json"
  description: "Invalid JSON structure"
  expectedError: "invalid character"
