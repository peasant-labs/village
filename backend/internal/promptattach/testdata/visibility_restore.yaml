# One row per visibility a binding can record. Attaching binds only and never
# changes who can read a transcript, so a binding records the visibility the
# transcript holds when it is bound and nothing restores it later.
- name: bind_only_private_is_preserved_exactly
  kind: bind_only
  visibility: private
- name: bind_only_shared_is_preserved_exactly
  kind: bind_only
  visibility: shared
- name: bind_only_public_is_preserved_exactly
  kind: bind_only
  visibility: public
