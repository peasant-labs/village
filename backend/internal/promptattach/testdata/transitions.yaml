# Every ordered pair of attachment states, exactly once. `allowed` is the
# transition the state machine must permit (true) or refuse (false). The test
# proves the fixture covers the full cross-product, so adding a state without
# updating this file fails rather than silently narrowing the coverage.
- name: requested_to_requested
  from: requested
  to: requested
  allowed: false
- name: requested_to_waiting
  from: requested
  to: waiting
  allowed: true
- name: requested_to_preview
  from: requested
  to: preview
  allowed: true
