    want_display_name: "Team Override"
    want_source: "override"
    want_remote_label: "github.com:peasant-labs/village"

  # Beyond the lattice: an unrecognized remote must not count as "known" for
  # either the remote tier or the RemoteLabel subtitle, so evidence falls
  # through to the next tier exactly as if git_remote had been empty.
  - name: remote-unrecognized-falls-through-to-privacy
    project_hash: "0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef"
    override_name: ""
    consented_name: ""
    git_remote: "not-a-real-remote"
    privacy_label: "project-abcdef123456"
    want_display_name: "project-abcdef123456"
    want_source: "privacy"
    want_remote_label: ""

  # Documents the Evidence a correct SQL pick (published_at DESC, id ASC
  # tie-break) produces when two candidate rows tie on published_at. The
  # tie-break itself is enforced in SQL owned by a sibling slice
  # (ListOwnerProjectIdentities); this fixture locks Resolve's behavior given
  # the deterministically-picked evidence such a tie-break would hand it.
  - name: published-at-tie-id-asc-tiebreak-consented-pick
    project_hash: "0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef"
    override_name: ""
    consented_name: "tie-break-winner-by-id-asc"
    git_remote: ""
    privacy_label: ""
    want_display_name: "tie-break-winner-by-id-asc"
    want_source: "consented"
    want_remote_label: ""

  # One project_hash carries one consented-name transcript and one
  # privacy-label transcript from the same owner. Both rows are the same
  # project and must resolve to exactly one name, not two.
  - name: mixed-name-same-hash-one-project-one-name
    project_hash: "0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef"
    override_name: ""
    consented_name: "village"
    git_remote: ""
    privacy_label: "project-3fa9c2e1b0d4"
    want_display_name: "village"
    want_source: "consented"
    want_remote_label: ""

  # A Resolver constructed with its zero value (nil Label) must behave
  # exactly as one whose labeler always reports the remote unusable, never
  # panic. GitRemote is present here so this case would exercise the
  # labeler if one were wired; since none is, evidence falls through to the
  # last-resort synthesis just as it would if git_remote were empty.
  - name: zero-value-resolver-nil-label-is-safe
    project_hash: "0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef"
    override_name: ""
    consented_name: ""
    git_remote: "git@github.com:peasant-labs/village.git"
    privacy_label: ""
    no_labeler: true
    want_display_name: "project-0123456789ab"
    want_source: "privacy"
    want_remote_label: ""
