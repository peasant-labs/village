# Fixture corpus for projectname.Resolve.
#
# Every row asserts want_display_name AND want_source. want_remote_label is
# always asserted too: Resolved.RemoteLabel is populated independently of
# which tier supplied DisplayName, so several override/consented rows below
# still expect a non-empty remote label alongside a higher-precedence name.
#
# git_remote values (raw, unformatted):
#   recognized:   git@github.com:peasant-labs/village.git
#     -> formats to github.com:peasant-labs/village via the test's mock
#        RemoteLabeler
#   unrecognized: not-a-real-remote
#     -> the mock RemoteLabeler reports ok=false for this value
#
# project_hash is present on every row (it is a required, NOT NULL identity
# column at the publish boundary elsewhere in the system), except that its
# leading 12 hex characters are the payload the last-resort row asserts.

cases:
  # The full lattice: every subset of {override, consented, remote, privacy}
  # present/absent (16 rows), keyed by which of the four tiers are non-empty.

  - name: all-evidence-absent-synthesizes-privacy-label-from-hash
    project_hash: "0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef"
    override_name: ""
    consented_name: ""
    git_remote: ""
    privacy_label: ""
    want_display_name: "project-0123456789ab"
    want_source: "privacy"
    want_remote_label: ""

  - name: privacy-label-only-tier
    project_hash: "0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef"
    override_name: ""
    consented_name: ""
    git_remote: ""
    privacy_label: "project-abcdef123456"
    want_display_name: "project-abcdef123456"
    want_source: "privacy"
    want_remote_label: ""

  - name: remote-only-tier
    project_hash: "0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef"
    override_name: ""
    consented_name: ""
    git_remote: "git@github.com:peasant-labs/village.git"
    privacy_label: ""
    want_display_name: "github.com:peasant-labs/village"
    want_source: "remote"
    want_remote_label: "github.com:peasant-labs/village"

  - name: remote-and-privacy-present-remote-wins
    project_hash: "0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef"
    override_name: ""
    consented_name: ""
    git_remote: "git@github.com:peasant-labs/village.git"
    privacy_label: "project-abcdef123456"
    want_display_name: "github.com:peasant-labs/village"
    want_source: "remote"
    want_remote_label: "github.com:peasant-labs/village"

  - name: consented-only-tier
    project_hash: "0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef"
    override_name: ""
    consented_name: "consented-project"
    git_remote: ""
    privacy_label: ""
    want_display_name: "consented-project"
    want_source: "consented"
    want_remote_label: ""

  - name: consented-and-privacy-present-consented-wins
    project_hash: "0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef"
    override_name: ""
    consented_name: "consented-project"
    git_remote: ""
    privacy_label: "project-abcdef123456"
    want_display_name: "consented-project"
    want_source: "consented"
    want_remote_label: ""

  - name: consented-and-remote-present-consented-wins
    project_hash: "0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef"
    override_name: ""
    consented_name: "consented-project"
    git_remote: "git@github.com:peasant-labs/village.git"
    privacy_label: ""
    want_display_name: "consented-project"
    want_source: "consented"
    want_remote_label: "github.com:peasant-labs/village"

  - name: consented-remote-privacy-present-consented-wins
    project_hash: "0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef"
    override_name: ""
