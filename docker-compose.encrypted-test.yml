services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: test
      POSTGRES_PASSWORD: test
      POSTGRES_DB: postgres
    ports:
      - "127.0.0.1:${VILLAGE_TEST_POSTGRES_PORT:-55460}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U test -d postgres"]
      interval: 1s
      timeout: 3s
      retries: 30

  minio:
    # The same server build the integration gates run, by digest so a tag
    # moving upstream cannot change what a local run tests against.
    image: quay.io/minio/minio@sha256:14cea493d9a34af32f524e538b8346cf79f3321eff8e708c1e2960462bd8936e
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: village-test
      MINIO_ROOT_PASSWORD: village-test-only-password
    ports:
      - "127.0.0.1:${VILLAGE_TEST_MINIO_PORT:-59060}:9000"
      - "127.0.0.1:${VILLAGE_TEST_MINIO_CONSOLE_PORT:-59061}:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 1s
      timeout: 3s
      retries: 30

  minio-init:
    image: quay.io/minio/mc:RELEASE.2025-07-21T05-28-08Z
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        mc alias set local http://minio:9000 village-test village-test-only-password
        mc mb --ignore-existing local/village-encrypted-test
        mc stat local/village-encrypted-test

volumes:
  postgres-data:
  minio-data:
