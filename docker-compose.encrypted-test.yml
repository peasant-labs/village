services:
  postgres:
    # Project mirror (linux/amd64 only).
    image: quay.io/peasant-labs/postgres:16-alpine@sha256:763d98d8fe6c03b54aeddbc6767daf88f572e307a86514aaf7d31219a30f5f0b
    platform: linux/amd64
    environment:
      POSTGRES_USER: test
      POSTGRES_PASSWORD: test
      POSTGRES_DB: postgres
    ports:
      - "127.0.0.1:${VILLAGE_TEST_POSTGRES_PORT:-55460}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U test -d postgres"]
      interval: 1s
      timeout: 3s
      retries: 30

  rustfs:
    # RustFS replaces MinIO, whose official images were withdrawn from Docker
    # Hub and Quay in September 2026. The image is pinned by digest so no tag
    # can move or vanish under a local run. The same digest appears in
    # .github/workflows/backend-tests.yml; the three move together.
    image: ghcr.io/rustfs/rustfs@sha256:8cc9801755448b71a786705ce76692c77e14936cccd87cf2fc31842e58f4d1ff
    environment:
      RUSTFS_ACCESS_KEY: village-test
      RUSTFS_SECRET_KEY: village-test-only-password
    ports:
      - "127.0.0.1:${VILLAGE_TEST_RUSTFS_PORT:-59060}:9000"
      - "127.0.0.1:${VILLAGE_TEST_RUSTFS_CONSOLE_PORT:-59061}:9001"
    volumes:
      - rustfs-data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/health/ready"]
      interval: 1s
      timeout: 3s
      retries: 30

  rustfs-init:
    # The official AWS CLI creates the bucket; the MinIO mc client is no longer published.
    image: public.ecr.aws/aws-cli/aws-cli@sha256:fdd8d1fcbea9c371678dee5a40df8b178c7a781b4586605756ee28114c97ead6
    depends_on:
      rustfs:
        condition: service_healthy
    environment:
      AWS_ACCESS_KEY_ID: village-test
      AWS_SECRET_ACCESS_KEY: village-test-only-password
      AWS_DEFAULT_REGION: us-east-1
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        aws --endpoint-url http://rustfs:9000 s3api create-bucket --bucket village-encrypted-test || true
        aws --endpoint-url http://rustfs:9000 s3api head-bucket --bucket village-encrypted-test

volumes:
  postgres-data:
  rustfs-data:
