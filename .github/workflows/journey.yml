name: journey

# Runs the Playwright journey harness on every pull request, keeps the JSON
# report and artifacts, and posts inline evidence (screenshots, plus failing
# tests' videos) to the PR as a GitHub App bot.
#
# Required organization configuration (once):
#   - GitHub App with Issues: Read and write and Pull requests: Read, installed
#     on the organization with access to this repository
#   - org variable  JOURNEY_APP_CLIENT_ID
#   - org secret    JOURNEY_APP_PRIVATE_KEY
# Using an App (not the default GITHUB_TOKEN) gives a stable bot identity
# instead of github-actions[bot]. Note: pull_request workflows from forks do not
# receive repository secrets, so fork PRs cannot mint this token; use
# pull_request_target or workflow_run if fork coverage is needed.

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: journey-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  journey:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        # Version comes from the "packageManager" field in package.json.

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 26
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Playwright's own Chromium (and its bundled ffmpeg). CHROME_PATH is left
      # unset so the journey config falls back to this browser.
      - run: pnpm --filter frontend exec playwright install --with-deps chromium

      - name: Run journeys
        id: journey
        continue-on-error: true
        run: pnpm --filter frontend run journey:ci

      - name: Upload journey artifacts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: journey-artifacts
          path: frontend/scripts/journey/.artifacts/
          include-hidden-files: true
          retention-days: 14

      - name: Mint bot token
        id: bot
        if: always()
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3
        with:
          client-id: ${{ vars.JOURNEY_APP_CLIENT_ID }}
          private-key: ${{ secrets.JOURNEY_APP_PRIVATE_KEY }}
          # A PR comment needs both Issues: write and Pull requests: write for an
          # App token (X-Accepted-Github-Permissions: issues=write; pull_requests=write).
          permission-issues: write
          permission-pull-requests: write

      - name: Post evidence
        if: always()
        continue-on-error: true
        env:
          # A machine-account PAT (JOURNEY_MEDIA_TOKEN) can upload inline
          # attachments; the App token is the fallback and cannot.
          GH_TOKEN: ${{ secrets.JOURNEY_MEDIA_TOKEN || steps.bot.outputs.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_SERVER_URL: ${{ github.server_url }}
          GITHUB_RUN_ID: ${{ github.run_id }}
        run: node frontend/scripts/journey/ci-post-evidence.mjs

      - name: Fail if journeys failed
        if: steps.journey.outcome == 'failure'
        run: exit 1
