# Fixtures for buildTranscriptListParams. Response trust-boundary permutations
# live in transcript-query-validation.yaml because they exercise the production
# TanStack hook and cache rather than a duplicate presentation helper.

paramBuilds:
  - name: defaults-page-one
    filters:
      query: ""
      provider: all
      topics: []
      order: recent
      page: 1
    expectedParams:
      sort: recent
      page: "1"
      limit: "24"

  - name: deeper-page-keeps-size
    filters:
      query: ""
      provider: all
      topics: []
      order: recent
      page: 3
    expectedParams:
      sort: recent
      page: "3"
      limit: "24"

  - name: query-is-trimmed
    filters:
      query: "  auth middleware  "
      provider: all
      topics: []
      order: recent
      page: 1
    expectedParams:
      sort: recent
      page: "1"
      limit: "24"
      q: auth middleware

  - name: whitespace-query-and-all-provider-omitted
    filters:
      query: "   "
      provider: all
      topics: []
      order: recent
      page: 2
    expectedParams:
      sort: recent
      page: "2"
      limit: "24"

  - name: provider-tags-and-order
    filters:
      query: ""
      provider: claude-code
      topics:
        - debugging
        - greenfield
      order: turns
      page: 2
    expectedParams:
      sort: turns
      page: "2"
      limit: "24"
      provider: claude-code
      tags: debugging,greenfield

# Why a list request failed, as the page says it (`transcriptListFailureCause`):
# the server's own reason, or a plain sentence, and never an internal path.
# `error` is what the request threw: `mismatch` for a response the page
# refused, a `message` for any other error, or `none` for a thrown non-error.
failureCauses:
  - name: a-refused-page-says-the-server-answered-another
    error: { kind: mismatch }
    expect: the server answered with a different page than the one asked for
  - name: the-servers-reason-is-said-without-its-full-stop
    error: { kind: message, message: "the session list is unavailable." }
    expect: the session list is unavailable
  - name: a-reason-naming-an-api-path-is-not-shown
    error: { kind: message, message: "GET /api/v1/transcripts?page=2 failed" }
    expect: the request failed
  - name: a-reason-naming-a-url-is-not-shown
    error: { kind: message, message: "fetch https://village.example/api failed" }
    expect: the request failed
  - name: an-empty-reason-says-the-request-failed
    error: { kind: message, message: "   " }
    expect: the request failed
  - name: a-thrown-non-error-says-the-request-failed
    error: { kind: none }
    expect: the request failed
