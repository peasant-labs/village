# Fixtures for the session-list page request helpers (buildTranscriptListParams
# and validateSettledTranscriptPage). Combinatorial cases live here, never inline
# in the test file. The loader enforces exact inventory, unique names, exact
# per-row keys, and that each settled-validation row's expectedOk agrees with the
# page/limit equality it encodes (non-vacuity guard).

paramBuilds:
  - name: defaults-page-one
    filters:
      query: ""
      provider: all
      topics: []
      order: recent
      page: 1
    expectedParams:
      sort: recent
      page: "1"
      limit: "24"

  - name: deeper-page-keeps-size
    filters:
      query: ""
      provider: all
      topics: []
      order: recent
      page: 3
    expectedParams:
      sort: recent
      page: "3"
      limit: "24"

  - name: query-is-trimmed
    filters:
      query: "  auth middleware  "
      provider: all
      topics: []
      order: recent
      page: 1
    expectedParams:
      sort: recent
      page: "1"
      limit: "24"
      q: auth middleware

  - name: whitespace-query-and-all-provider-omitted
    filters:
      query: "   "
      provider: all
      topics: []
      order: recent
      page: 2
    expectedParams:
      sort: recent
      page: "2"
      limit: "24"

  - name: provider-tags-and-order
    filters:
      query: ""
      provider: claude-code
      topics:
        - debugging
        - greenfield
      order: turns
      page: 2
    expectedParams:
      sort: turns
      page: "2"
      limit: "24"
      provider: claude-code
      tags: debugging,greenfield

settledValidation:
  - name: page-one-matches
    requestedPage: 1
    requestedLimit: 24
    responsePage: 1
    responseLimit: 24
    expectedOk: true

  - name: deeper-page-matches
    requestedPage: 3
    requestedLimit: 24
    responsePage: 3
    responseLimit: 24
    expectedOk: true

  - name: stale-lower-page-rejected
    requestedPage: 2
    requestedLimit: 24
    responsePage: 1
    responseLimit: 24
    expectedOk: false

  - name: ahead-page-rejected
    requestedPage: 2
    requestedLimit: 24
    responsePage: 3
    responseLimit: 24
    expectedOk: false

  - name: limit-drift-rejected
    requestedPage: 2
    requestedLimit: 24
    responsePage: 2
    responseLimit: 20
    expectedOk: false

  - name: page-and-limit-drift-rejected
    requestedPage: 4
    requestedLimit: 24
    responsePage: 1
    responseLimit: 20
    expectedOk: false
