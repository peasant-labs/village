# Fixtures for buildTranscriptListParams. Response trust-boundary permutations
# live in transcript-query-validation.yaml because they exercise the production
# TanStack hook and cache rather than a duplicate presentation helper.

paramBuilds:
  - name: defaults-page-one
    filters:
      query: ""
      provider: all
      topics: []
      order: recent
      page: 1
    expectedParams:
      sort: recent
      page: "1"
      limit: "24"

  - name: deeper-page-keeps-size
    filters:
      query: ""
      provider: all
      topics: []
      order: recent
      page: 3
    expectedParams:
      sort: recent
      page: "3"
      limit: "24"

  - name: query-is-trimmed
    filters:
      query: "  auth middleware  "
      provider: all
      topics: []
      order: recent
      page: 1
    expectedParams:
      sort: recent
      page: "1"
      limit: "24"
      q: auth middleware

  - name: whitespace-query-and-all-provider-omitted
    filters:
      query: "   "
      provider: all
      topics: []
      order: recent
      page: 2
    expectedParams:
      sort: recent
      page: "2"
      limit: "24"

  - name: provider-tags-and-order
    filters:
      query: ""
      provider: claude-code
      topics:
        - debugging
        - greenfield
      order: turns
      page: 2
    expectedParams:
      sort: turns
      page: "2"
      limit: "24"
      provider: claude-code
      tags: debugging,greenfield

# What a failed list panel adds under "could not be loaded"
# (`transcriptListFailureNote`): a line the person can act on, or null when
# it would only restate the heading. `error` is what the request threw:
# `mismatch` for a response the page refused, `status` for a server answer,
# `network` for a request that never reached the server, `message` for any
# other error, or `none` for a thrown non-error.
failureNotes:
  - name: too-many-requests-says-to-wait
    error: { kind: status, status: 429, message: "rate limit exceeded" }
    expect: too many requests just now, so wait a moment
  - name: no-connection-says-to-check-it
    error: { kind: network, message: "Failed to fetch" }
    expect: check your connection
  - name: the-servers-own-reason-restates-the-heading
    error: { kind: status, status: 500, message: "the session list is unavailable" }
    expect: null
  - name: a-refused-page-adds-nothing
    error: { kind: mismatch }
    expect: null
  - name: a-reason-naming-an-api-path-adds-nothing
    error: { kind: message, message: "GET /api/v1/transcripts?page=2 failed" }
    expect: null
  - name: a-thrown-non-error-adds-nothing
    error: { kind: none }
    expect: null
