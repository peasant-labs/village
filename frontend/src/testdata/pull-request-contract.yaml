# One conforming example per wire type of the pull request prompt attachment
# surface, as the contract package generates them. The test parses each
# example with the package's own parser and requires the parsed value to
# equal the example, so an example carrying a key the contract does not
# declare, or missing one it requires, fails here rather than in a page.
# The page that renders this surface arrives later; until then this is the
# proof that the generated types are usable as shipped.

examples:
  - name: pull request attachment response
    parser: zVillagePullRequestAttachmentResponse
    value:
      attachment:
        id: "7f3c1a2b-4d5e-4f60-8a9b-0c1d2e3f4a5b"
        owner: acme
        name: widgets
        number: 7
        head_sha: "0123456789abcdef0123456789abcdef01234567"
        is_private_repository: true
        state: waiting
        author_user_id: "1b2c3d4e-5f60-4718-9a0b-1c2d3e4f5a6b"
        requested_by_github_id: null
        comment_id: null
        check_run_id: 4242
        created_at: "2026-09-13T08:00:00Z"
        updated_at: "2026-09-13T08:05:00Z"
        confirmed_at: null
        detached_at: null
      digest: null
      transcripts:
        - transcript_id: "3f0d8b1e-2c4a-4f6e-9a1b-7c2d3e4f5a6b"
          position: 0
          previous_visibility: private
          title: fix the flaky retry
          session_start: "2026-09-12T22:10:00Z"
      viewer_is_author: true
  - name: prompt requests response
    parser: zVillagePromptRequestsResponse
    value:
      requests:
        - owner: acme
          name: widgets
          number: 7
          state: waiting
          remote: "github.com/acme/widgets"
          requested_at: "2026-09-13T08:00:00Z"
  - name: user settings
    parser: zVillageUserSettings
    value:
      preview_before_attach: false
  - name: update user settings request
    parser: zVillageUpdateUserSettingsRequest
    value:
      preview_before_attach: true
  - name: webhook acknowledgement
    parser: zVillageStatusResponse
    value:
      status: accepted
