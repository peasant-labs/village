cases:
  - name: capability-advertised-mounts-positioned
    body: '{"segmentedReadVersion":"0.2.0","minSegmentedReadVersion":"0.1.0"}'
    positioned: true
  - name: capability-v1-only-uses-content
    body: '{"segmentedReadVersion":"0.1.0","minSegmentedReadVersion":"0.1.0"}'
  # The window's members are opaque tokens compared by exact membership
  # (Schema's contract), so a window that names neither 0.2.0 member is not
  # read as covering it, whatever order its versions would suggest.
  - name: capability-later-without-0.2.0-uses-content
    body: '{"segmentedReadVersion":"0.3.0","minSegmentedReadVersion":"0.1.0"}'
  # A later server that still serves the 0.2.0 reads names 0.2.0 as its oldest.
  - name: capability-later-serving-0.2.0-mounts-positioned
    body: '{"segmentedReadVersion":"0.3.0","minSegmentedReadVersion":"0.2.0"}'
    positioned: true
  - name: capability-lookalike-token-refused-leading
    body: '{"segmentedReadVersion":"10.2.0","minSegmentedReadVersion":"0.1.0"}'
  - name: capability-lookalike-token-refused-trailing
    body: '{"segmentedReadVersion":"0.2.00","minSegmentedReadVersion":"0.1.0"}'
  - name: capability-lookalike-token-refused-middle
    body: '{"segmentedReadVersion":"0.20.0","minSegmentedReadVersion":"0.1.0"}'
  - name: capability-min-only-uses-content
    body: '{"minSegmentedReadVersion":"0.2.0"}'
  # Membership, not position: a window that names 0.2.0 in either member serves it.
  - name: capability-min-token-serves-0.2.0
    body: '{"segmentedReadVersion":"0.1.0","minSegmentedReadVersion":"0.2.0"}'
    positioned: true
  - name: capability-lookalike-min-token-refused
    body: '{"segmentedReadVersion":"0.3.0","minSegmentedReadVersion":"0.2.00"}'
  - name: capability-empty-body-uses-content
    body: ''
  - name: capability-refused-pair-uses-content
    body: '{"segmentedReadVersion":"0.2.0","minSegmentedReadVersion":42}'
  - name: capability-ignores-health-trait
    body: '{"serves":["segmented-reads-v2"]}'
  - name: capability-read-failure-uses-content
    rejected: true
  # The version read never answers; the deadline passes and the page reads the
  # whole document. The test fires the deadline itself, so nothing sleeps.
  - name: capability-timeout-uses-content
    hangs: true
