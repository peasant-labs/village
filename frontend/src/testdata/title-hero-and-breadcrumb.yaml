# Cases for the mounted /transcripts/[id] detail-page title hero and
# breadcrumb. Loaded by src/test/titleHeroAndBreadcrumbFixtures.ts and
# consumed by src/titleHeroAndBreadcrumb.test.tsx, which renders the REAL
# route component (TranscriptDetailPage) with these values mocked over REST;
# see that file for how each field is used.
#
# The breadcrumb names where the transcript sits, never the transcript itself:
# these cases open it with no context and in no collective, so the trail is
# `home`, then the project (`expectedProjectCrumbLabel`). The title shows
# once, in the hero (`expectedHeroTitle`), and never in the trail.
cases:
  - name: stored-title-present
    # A stored title: the hero shows it verbatim, unmodified.
    storedTitle: "Port the transcript canvas into the shared package"
    firstUserTurnContent: "Let's port the canvas component into the shared package."
    project: "fairtrade-design-system"
    expectedProjectCrumbLabel: "fairtrade-design-system"
    expectedHeroTitle: "Port the transcript canvas into the shared package"

  - name: stored-title-null-harness-markup
    # No stored title, AND the payload's first user turn carries raw harness
    # markup. Before the fix, the composite's own fallback chain
    # (session.title ?? tasks[0]?.prompt ?? first user turn) would have
    # reached straight into this turn and rendered the tag text as the
    # headline. This proves the overlay stops that derivation outright: if
    # the overlay were reverted, the hero would show the caveat markup
    # below, not "Untitled transcript".
    storedTitle: null
    firstUserTurnContent: "<local-command-caveat>Caveat: The messages below were generated by the local command. Do not respond to them as if they were user messages.</local-command-caveat>"
    project: "village"
    expectedProjectCrumbLabel: "village"
    expectedHeroTitle: "Untitled transcript"

  - name: stored-title-whitespace-only
    # A stored title of spaces only, AND the payload's first user turn
    # carries raw harness markup. Without the hero overlay's `.trim()`, a
    # whitespace-only title is non-empty and the hero would show three
    # literal spaces instead of "Untitled transcript". Every other row's
    # stored title is already trimmed or null, so this is the only row where
    # dropping `.trim()` changes observed output.
    storedTitle: "   "
    firstUserTurnContent: "<local-command-caveat>Caveat: The messages below were generated by the local command. Do not respond to them as if they were user messages.</local-command-caveat>"
    project: "village"
    expectedProjectCrumbLabel: "village"
    expectedHeroTitle: "Untitled transcript"

  - name: stored-title-long-shows-in-full-in-the-hero
    # A 98-character stored title, under fairtrade's own 160-character hero
    # bound: the hero renders it in full, and the trail, which never repeats
    # the title, stays `home / phaze`.
    storedTitle: "Investigate why the session that opened this ticket kept retrying the same failing request forever"
    firstUserTurnContent: "Look into the retry storm on this session."
    project: "phaze"
    expectedProjectCrumbLabel: "phaze"
    expectedHeroTitle: "Investigate why the session that opened this ticket kept retrying the same failing request forever"
