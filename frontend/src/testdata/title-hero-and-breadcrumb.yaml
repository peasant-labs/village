# Cases for the mounted /transcripts/[id] detail-page title-hero + breadcrumb
# fix (village#32 frontend part, #33). Loaded by
# src/test/titleHeroAndBreadcrumbFixtures.ts and consumed by
# src/titleHeroAndBreadcrumb.test.tsx, which renders the REAL route
# component (TranscriptDetailPage) with these values mocked over REST — see
# that file for how each field is used.
#
# `expectedCrumbLastLabel` is the LITERAL text of the breadcrumb's last
# crumb. When `expectedCrumbUsesShortId` is true, the case has no stored
# title, so the last crumb must fall back to the short VILLAGE transcript id
# (the id in the page's own /transcripts/<id> URL, sliced to 8 characters) —
# the test computes that expectation itself from the fixed transcript id it
# mocks for the case, not from `expectedCrumbLastLabel` (left null and
# unused in that row).
cases:
  - name: stored-title-present
    # A stored title shorter than the breadcrumb's 60-character bound: the
    # hero and the crumb should both show it verbatim, unmodified.
    storedTitle: "Port the transcript canvas into the shared package"
    firstUserTurnContent: "Let's port the canvas component into the shared package."
    project: "transcript-browser"
    expectedProjectCrumbLabel: "transcript-browser"
    expectedHeroTitle: "Port the transcript canvas into the shared package"
    expectedCrumbUsesShortId: false
    expectedCrumbLastLabel: "Port the transcript canvas into the shared package"

  - name: stored-title-null-harness-markup
    # No stored title, AND the payload's first user turn carries raw harness
    # markup. Before the fix, the composite's own fallback chain
    # (session.title ?? tasks[0]?.prompt ?? first user turn) would have
    # reached straight into this turn and rendered the tag text as the
    # headline. This proves the overlay stops that derivation outright: if
    # the overlay were reverted, the hero would show the caveat markup
    # below, not "Untitled transcript".
    storedTitle: null
    firstUserTurnContent: "<local-command-caveat>Caveat: The messages below were generated by the local command. Do not respond to them as if they were user messages.</local-command-caveat>"
    project: "village"
    expectedProjectCrumbLabel: "village"
    expectedHeroTitle: "Untitled transcript"
    expectedCrumbUsesShortId: true
    expectedCrumbLastLabel: null

  - name: stored-title-long-truncates-crumb-not-hero
    # A 98-character stored title: longer than the breadcrumb's 60-character
    # bound but shorter than fairtrade's own 160-character hero bound, so
    # the hero renders it in full while the crumb truncates it. This
    # isolates the breadcrumb's OWN truncation from fairtrade's hero
    # truncation, which a case that only exceeded 160 could not do. The
    # project value is also a host-slug path so `displayProject`'s
    # transform is exercised, not just passed through.
    storedTitle: "Investigate why the session that opened this ticket kept retrying the same failing request forever"
    firstUserTurnContent: "Look into the retry storm on this session."
    project: "~Users-acme-dev-Documents-Projects-phaze"
    expectedProjectCrumbLabel: "phaze"
    expectedHeroTitle: "Investigate why the session that opened this ticket kept retrying the same failing request forever"
    expectedCrumbUsesShortId: false
    expectedCrumbLastLabel: "Investigate why the session that opened this ticket kept re…"
