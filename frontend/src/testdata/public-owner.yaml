# How the app reads a person the server resolved for one viewer
# (`VillagePublicOwner`). Loaded by src/lib/publicOwner.test.ts.
#
# The server decides, per viewer, whether a person is shown as their profile or
# as anonymous. The app renders what it receives and never re-derives that rule,
# so every case states only what was RECEIVED (`owner`) and who is LOOKING
# (`viewerId`, null when signed out).
#
# `owner` is the wire value as JSON reads it, without the contract parser:
#   - a profile;
#   - the anonymous owner, which carries no id;
#   - a kind this app does not know, which reads as anonymous and keeps nothing;
#   - a profile missing its id or username, which cannot name anyone;
#   - an absent owner.
#
# `expect`:
#   label      what an attribution shows: the username, or "anon"
#   anonymous  whether the attribution names nobody
#   handle     the handle a table cell shows: "@username", or a bare "anon"
#   ownedBy    whether the signed-in viewer is this owner (the own-transcript check)
#   key        the key counts and filters group owners by: the profile id, or
#              the one bucket every anonymous owner shares
#   projectHref the transcript page's project link for project hash `projectHash`,
#              or null: no link is ever built from an owner that is not a profile
#
# `ownedBy` is decided by the id alone. The "viewer-with-the-same-username"
# case keeps that honest: a matching username without a matching id is not
# the viewer.

projectHash: "9999999999999999999999999999999999999999999999999999999999999999"

cases:
  - name: profile-seen-by-someone-else
    owner: {kind: profile, id: 11111111-1111-4111-8111-111111111111, username: alice-dev, display_name: Alice, avatar_url: "https://avatars.example/alice.png"}
    viewerId: 22222222-2222-4222-8222-222222222222
    expect:
      label: alice-dev
      anonymous: false
      handle: "@alice-dev"
      ownedBy: false
      key: 11111111-1111-4111-8111-111111111111
      projectHref: "/users/alice-dev/projects/9999999999999999999999999999999999999999999999999999999999999999"

  - name: profile-seen-by-its-owner
    owner: {kind: profile, id: 11111111-1111-4111-8111-111111111111, username: alice-dev, display_name: null, avatar_url: null}
    viewerId: 11111111-1111-4111-8111-111111111111
    expect:
      label: alice-dev
      anonymous: false
      handle: "@alice-dev"
      ownedBy: true
      key: 11111111-1111-4111-8111-111111111111
      projectHref: "/users/alice-dev/projects/9999999999999999999999999999999999999999999999999999999999999999"

  - name: profile-seen-signed-out
    owner: {kind: profile, id: 11111111-1111-4111-8111-111111111111, username: alice-dev, display_name: null, avatar_url: null}
    viewerId: null
    expect:
      label: alice-dev
      anonymous: false
      handle: "@alice-dev"
      ownedBy: false
      key: 11111111-1111-4111-8111-111111111111
      projectHref: "/users/alice-dev/projects/9999999999999999999999999999999999999999999999999999999999999999"

  - name: anonymous-seen-signed-in
    owner: {kind: anonymous}
    viewerId: 22222222-2222-4222-8222-222222222222
    expect:
      label: anon
      anonymous: true
      handle: anon
      ownedBy: false
      key: anonymous
      projectHref: null

  - name: anonymous-seen-signed-out
    owner: {kind: anonymous}
    viewerId: null
    expect:
      label: anon
      anonymous: true
      handle: anon
      ownedBy: false
      key: anonymous
      projectHref: null

  - name: unknown-kind-reads-as-anonymous-and-keeps-nothing
    owner: {kind: organization, id: 11111111-1111-4111-8111-111111111111, username: acme, display_name: Acme, avatar_url: null}
    viewerId: 11111111-1111-4111-8111-111111111111
    expect:
      label: anon
      anonymous: true
      handle: anon
      ownedBy: false
      key: anonymous
      projectHref: null

  - name: profile-without-an-id-names-nobody
    owner: {kind: profile, username: alice-dev, display_name: null, avatar_url: null}
    viewerId: 22222222-2222-4222-8222-222222222222
    expect:
      label: anon
      anonymous: true
      handle: anon
      ownedBy: false
      key: anonymous
      projectHref: null

  - name: absent-owner-names-nobody
    owner: null
    viewerId: 22222222-2222-4222-8222-222222222222
    expect:
      label: anon
      anonymous: true
      handle: anon
      ownedBy: false
      key: anonymous
      projectHref: null

  - name: viewer-with-the-same-username-is-not-the-owner
    owner: {kind: profile, id: 11111111-1111-4111-8111-111111111111, username: alice-dev, display_name: null, avatar_url: null}
    viewerId: alice-dev
    expect:
      label: alice-dev
      anonymous: false
      handle: "@alice-dev"
      ownedBy: false
      key: 11111111-1111-4111-8111-111111111111
      projectHref: "/users/alice-dev/projects/9999999999999999999999999999999999999999999999999999999999999999"

# Sessions one session started, folded under it. A session id is unique only
# per owner, and an owner shown as anonymous carries no id, so the fold never
# matches on a session id: it matches only the parent the server resolved
# within the same owner (`parentTranscriptId`, null when the server resolved
# none). The owner plays no part, so an anonymous owner's rows fold exactly
# like a profile's, and two publishers sharing a session id never fold.
#
# Each row: `name` (its row id), `owner` (a key into `owners`), `sessionId`,
# `parentSessionId` (null when nothing started it) and `parentTranscriptId`.
# `expect` partitions the rows into the ones that keep their place and the
# groups folded under a parent.
owners:
  alice: {kind: profile, id: 11111111-1111-4111-8111-111111111111, username: alice-dev, display_name: null, avatar_url: null}
  hidden: {kind: anonymous}

foldCases:
  - name: a-profile-child-folds-under-its-resolved-parent
    rows:
      - {name: parent, owner: alice, sessionId: s-parent, parentSessionId: null, parentTranscriptId: null}
      - {name: child, owner: alice, sessionId: s-child, parentSessionId: s-parent, parentTranscriptId: parent}
    expect:
      rootRows: [parent]
      groups: {parent: [child]}

  - name: an-anonymous-child-folds-under-its-resolved-parent
    rows:
      - {name: parent, owner: hidden, sessionId: s-parent, parentSessionId: null, parentTranscriptId: null}
      - {name: child, owner: hidden, sessionId: s-child, parentSessionId: s-parent, parentTranscriptId: parent}
    expect:
      rootRows: [parent]
      groups: {parent: [child]}

  - name: a-shared-session-id-without-a-resolved-parent-never-folds
    rows:
      - {name: alices, owner: alice, sessionId: s-shared, parentSessionId: null, parentTranscriptId: null}
      - {name: hiddens, owner: hidden, sessionId: s-hidden, parentSessionId: s-shared, parentTranscriptId: null}
    expect:
      rootRows: [alices, hiddens]
      groups: {}

  - name: a-resolved-parent-outside-the-response-keeps-the-row
    rows:
      - {name: child, owner: hidden, sessionId: s-child, parentSessionId: s-parent, parentTranscriptId: elsewhere}
    expect:
      rootRows: [child]
      groups: {}
