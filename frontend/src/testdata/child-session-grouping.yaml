  # ── home and a project page: the chip ──────────────────────────────────────
  # The same rows on the two owner-scoped surfaces. There a row DOES name its
  # parent -- the chip hangs off the parent's own row -- so the started sessions
  # are listed rather than only folded away.
  - name: a-started-session-is-listed-inside-its-parents-chip
    surfaces: [home, project, profile]
    absentParentCause: none
    rows:
      - name: run-the-migration
        ownerID: owner-1
        localID: sess-migration
        parentSessionID: null
      - name: write-the-down-file
        ownerID: owner-1
        localID: sess-down-file
        parentSessionID: sess-migration
