      - name: plain-c2
        ownerID: owner-2
        localID: sess-c2
        parentSessionID: null
    agentSessions: []
    serverTotal: 2
    expectedVisibleCount: 2
    expectedRootRows: [plain-c1, plain-c2]
    expectedHomeRows: []
    expectedGroups: []

  - name: two-parents-each-keep-their-own-group
    surfaces: [explore]
    absentParentCause: none
    rows:
      - name: parent-d
        ownerID: owner-1
        localID: sess-d
        parentSessionID: null
      - name: parent-e
        ownerID: owner-2
        localID: sess-e
        parentSessionID: null
      - name: child-d1
        ownerID: owner-1
        localID: sess-d1
        parentSessionID: sess-d
      - name: child-e1
        ownerID: owner-2
        localID: sess-e1
        parentSessionID: sess-e
      - name: child-e2
        ownerID: owner-2
        localID: sess-e2
        parentSessionID: sess-e
    agentSessions: []
