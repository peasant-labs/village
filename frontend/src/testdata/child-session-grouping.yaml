      - name: offer-a-second-opinion
        ownerID: owner-bo
        localID: sess-opinion
        parentSessionID: null
    agentSessions: []
    serverTotal: 3
    expectedVisibleCount: 2
    expectedRootRows: [offer-the-refactor, offer-a-second-opinion]
    expectedHomeRows: []
    expectedGroups:
      - parent: offer-the-refactor
        label: "1 child session"
        children: [offer-the-follow-up]

  # A person offered one session to this collective and kept the session that
  # started it to themselves. The moderator may not read the starter at all, so
  # the offered submission keeps its own queue row: a submission a moderator
  # cannot see is a submission they cannot decide, and the queue never clears.
  - name: a-submission-whose-starter-was-not-offered-keeps-its-queue-row
    surfaces: [pending-queue]
    absentParentCause: not-visible
    rows:
      - name: offer-the-migration
        ownerID: owner-ada
        localID: sess-migration-offer
        parentSessionID: null
      - name: offer-the-cleanup
        ownerID: owner-bo
        localID: sess-cleanup
        parentSessionID: sess-kept-out-of-this-collective
    agentSessions: []
    serverTotal: 2
    expectedVisibleCount: 2
    expectedRootRows: [offer-the-migration, offer-the-cleanup]
    expectedHomeRows: []
    expectedGroups: []

  # ── a member's own contributions to a collective ──────────────────────────
  # This list answers "what did I give this collective", so a contribution
  # another contribution started reads under the one that started it, with the
  # unshare action still on every row.
  - name: your-contributions-read-a-started-contribution-under-its-starter
    surfaces: [my-contributions]
    absentParentCause: none
    rows:
