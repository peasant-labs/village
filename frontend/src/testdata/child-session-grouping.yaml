  # ── the contribute selection tree ─────────────────────────────────────────
  # Choosing what to contribute is where the fold matters most: a person picks a
  # session, and the sessions it started come with it. The tree used to run its
  # own private fold; it runs the shared one now, so the count on the control is
  # the number of rows the control reveals.
  - name: the-contribute-tree-nests-a-started-session-under-its-starter
    surfaces: [contribute]
    absentParentCause: none
    rows:
