  # longer offered. The row keeps its own place in the tree -- under the
  # project's orphaned-transcripts grouping -- so it stays selectable rather
  # than disappearing from the only page that can contribute it.
  - name: a-contributable-row-naming-an-unlisted-parent-keeps-its-own-place
