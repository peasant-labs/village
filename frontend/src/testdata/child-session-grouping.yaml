        parentSessionID: sess-k
      - name: child-k2
        ownerID: owner-1
        localID: sess-k2
        parentSessionID: sess-k
      - name: child-k3
        ownerID: owner-1
        localID: sess-k3
        parentSessionID: sess-k
      - name: child-k4
        ownerID: owner-1
        localID: sess-k4
        parentSessionID: sess-k
      - name: plain-k5
