    expectedGroups: []

  # Nothing started these sessions, so the list is exactly what it was before.
  - name: session-without-a-parent-renders-unchanged
    surfaces: [explore]
    absentParentCause: none
    rows:
      - name: plain-c1
        ownerID: owner-1
        localID: sess-c1
