        children: [child-f1]

  # A session started a session that started another session. Every started row
  # appears exactly once, under the topmost row of the chain in this response.
  - name: a-session-started-two-levels-down-joins-the-topmost-group
    surfaces: [explore]
    absentParentCause: none
    rows:
