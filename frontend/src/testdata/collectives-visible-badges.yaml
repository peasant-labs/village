# Membership is shown on collective lists and discovery; contribution badges
# are intentionally absent. Each history remains in the corpus so accepted,
# pending, refused and withdrawn attempts cannot reintroduce that badge.
# `role` is GET /collectives/visible's role, or null for a non-member.
# The counters model GET /users/me/collectives/contributions without changing
# membership or the page on which a collective is listed.
# `expect.member_badge` names the role; `expect.contributed_badge` stays false.

rows:
  - name: member_with_contribution
    why: >
      A member with an accepted transcript keeps their role without an extra
      contribution badge.
    role: member
    approved: 2
    pending: 0
    rejected: 1
    withdrawn: 0
    expect:
      member_badge: member
      contributed_badge: false

  - name: member_without_contribution
    why: >
      An owner without contributions still sees their owner role.
    role: owner
    approved: 0
    pending: 0
    rejected: 0
    withdrawn: 0
    expect:
      member_badge: owner
      contributed_badge: false

  - name: visible_non_member_with_pending_contribution
    why: >
      A pending contribution does not imply membership and no longer adds a
      contribution badge. The collective remains reachable through discover.
    role: null
    approved: 0
    pending: 1
    rejected: 0
    withdrawn: 0
    expect:
      member_badge: null
      contributed_badge: false

  - name: visible_non_member_without_contribution
    why: >
      A collective the caller can see through the public or open rule alone.
      It must still be listed, and it must claim nothing about the caller.
    role: null
    approved: 0
    pending: 0
    rejected: 0
    withdrawn: 0
    expect:
      member_badge: null
      contributed_badge: false

  - name: visible_non_member_with_only_refused_and_withdrawn_attempts
    why: >
      The contributions endpoint DOES list a collective whose every attempt
      ended in a refusal or a withdrawal, with approved and pending both zero.
      The row must show no contribution badge for that history, just as it
      shows none for accepted and pending contributions.
    role: null
    approved: 0
    pending: 0
    rejected: 3
    withdrawn: 2
    expect:
      member_badge: null
      contributed_badge: false
