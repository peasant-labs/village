# What each row of the collectives page says about the caller's own standing.
#
# The page lists every collective the caller may SEE, so a row is one of several
# kinds. The two axes are independent: belonging to a collective and having
# offered it something are different facts, and each combination renders
# differently.
#
# `role` is what GET /groups/visible reports for this row: null means the caller
# only sees the collective, through the public or open rule.
#
# The four counters are this caller's own, from
# GET /users/me/collectives/contributions. All four are stated on every case
# rather than defaulted, because two of them (`rejected` and `withdrawn`) record
# PAST EVENTS and must never produce a badge, and a case that silently inherited
# zero for those could not show that.
#
# `expect.member_badge` is the role the row must show, or null for no member
# badge. `expect.contributed_badge` is whether the row must say "contributed".

rows:
  - name: member_with_contribution
    why: >
      A member who has also had a transcript accepted must see BOTH facts. One
      badge overwriting the other would hide half of what the row knows.
    role: member
    approved: 2
    pending: 0
    rejected: 1
    withdrawn: 0
    expect:
      member_badge: member
      contributed_badge: true

  - name: member_without_contribution
    why: >
      The row every collective showed before this change. It must keep its
      member badge and gain nothing else.
    role: owner
    approved: 0
    pending: 0
    rejected: 0
    withdrawn: 0
    expect:
      member_badge: owner
      contributed_badge: false

  - name: visible_non_member_with_pending_contribution
    why: >
      Somebody can offer a transcript to a collective without joining it, and a
      contribution still awaiting review counts. A person waiting on an answer
      needs the row to say the offer exists; showing nothing until it is
      accepted is how they lose track of it. No member badge, because they are
      not a member.
    role: null
    approved: 0
    pending: 1
    rejected: 0
    withdrawn: 0
    expect:
      member_badge: null
      contributed_badge: true

  - name: visible_non_member_without_contribution
    why: >
      A collective the caller can see through the public or open rule alone.
      It must still be listed, and it must claim nothing about the caller.
    role: null
    approved: 0
    pending: 0
    rejected: 0
    withdrawn: 0
    expect:
      member_badge: null
      contributed_badge: false

  - name: visible_non_member_with_only_refused_and_withdrawn_attempts
    why: >
      The contributions endpoint DOES list a collective whose every attempt
      ended in a refusal or a withdrawal, with approved and pending both zero.
      Those are past events, not a standing, so the row must read exactly like
      one the caller never approached. Without this case a badge rule widened to
      count refusals or withdrawals would go unnoticed, because no other case
      serves a row carrying only past events.
    role: null
    approved: 0
    pending: 0
    rejected: 3
    withdrawn: 2
    expect:
      member_badge: null
      contributed_badge: false
