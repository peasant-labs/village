# Cases for the own-profile contributed-collectives section, the owner-only
# share-event history, and the per-transcript collectives list.
#
# Deletion protection is by required NAME (see profileCollectivesFixtures.ts):
# removing a case fails the loader because its name goes missing from the
# manifest, not because a tally shrinks. No case count is asserted anywhere, so
# adding a case is a one-file change.

# Who is looking at the profile, and whether the section exists for them at all.
viewerCases:
  - name: owner-sees-the-section
    viewer: owner
    expectSection: true
    expectContributionsRequest: true

  - name: other-signed-in-viewer-sees-no-section
    viewer: other-signed-in
    expectSection: false
    expectContributionsRequest: false

  - name: anonymous-viewer-sees-no-section
    viewer: anonymous
    expectSection: false
    expectContributionsRequest: false

# What the owner's section renders for a given contributions payload.
contributionCases:
  - name: pending-only-collective-is-listed
    collectives:
      - id: 11111111-1111-4111-8111-111111111111
        name: Quiet Reviewers
        description: null
        approvedCount: 0
        pendingCount: 3
        rejectedAttemptCount: 0
        withdrawnAttemptCount: 0
    expectedCollectiveNames:
      - Quiet Reviewers
    expectedCounters:
      - approved: 0
        pending: 3
        rejectedAttempts: 0
        withdrawnAttempts: 0

  - name: two-approved-one-pending-two-rejected-attempts
    collectives:
      - id: 22222222-2222-4222-8222-222222222222
        name: AI Research Team
        description: a working group
        approvedCount: 2
        pendingCount: 1
        rejectedAttemptCount: 2
        withdrawnAttemptCount: 0
    expectedCollectiveNames:
      - AI Research Team
    expectedCounters:
      - approved: 2
        pending: 1
        rejectedAttempts: 2
        withdrawnAttempts: 0

  # Submitted, then withdrawn with no refusal ever recorded: the current-state
  # row is gone (approved and pending both fall to 0), and the rejected
  # counter stays 0 too since nothing was ever refused — but the withdrawn
  # counter must be nonzero, or the withdrawal leaves no trace anywhere on the
  # section at all.
  - name: withdrawn-once-still-lists-with-a-nonzero-withdrawn-counter
    collectives:
      - id: 33333333-3333-4333-8333-333333333333
        name: Former Home
        description: null
        approvedCount: 0
        pendingCount: 0
        rejectedAttemptCount: 0
        withdrawnAttemptCount: 1
    expectedCollectiveNames:
      - Former Home
    expectedCounters:
      - approved: 0
        pending: 0
        rejectedAttempts: 0
        withdrawnAttempts: 1

  # Refused repeatedly and then withdrawn: the current-state row is gone, so
  # both transcript counters are 0, while the refusals stay counted from the
  # event ledger and the withdrawal itself is now also counted. The section
  # must show 3 rejected AND 1 withdrawn — this is exactly the collective the
  # user's UAT caught contradicting itself ("3 submission attempts" beside
  # "none on record").
  - name: refused-then-withdrawn-keeps-its-refusal-count-with-no-transcripts-left
    collectives:
      - id: 88888888-8888-4888-8888-888888888888
        name: Strict Curators
        description: null
        approvedCount: 0
        pendingCount: 0
        rejectedAttemptCount: 3
        withdrawnAttemptCount: 1
    expectedCollectiveNames:
      - Strict Curators
    expectedCounters:
      - approved: 0
        pending: 0
        rejectedAttempts: 3
        withdrawnAttempts: 1

  - name: several-collectives-render-in-the-order-served
    collectives:
      - id: 44444444-4444-4444-8444-444444444444
        name: Verified Contributors
        description: null
        approvedCount: 5
        pendingCount: 0
        rejectedAttemptCount: 1
        withdrawnAttemptCount: 0
      - id: 55555555-5555-4555-8555-555555555555
        name: Quiet Reviewers
        description: null
        approvedCount: 0
        pendingCount: 2
        rejectedAttemptCount: 0
        withdrawnAttemptCount: 0
    expectedCollectiveNames:
      - Verified Contributors
      - Quiet Reviewers
    expectedCounters:
      - approved: 5
        pending: 0
        rejectedAttempts: 1
        withdrawnAttempts: 0
      - approved: 0
        pending: 2
        rejectedAttempts: 0
        withdrawnAttempts: 0

# The owner-only audit log for one (transcript, collective) pair. `events` is
# the wire payload in the order the server sends it (event_num ascending);
# `expectedLabels` is what each row must read, in the same order.
#
# Every case is a history the WRITE PATHS CAN ACTUALLY PRODUCE, because a case
# describing an impossible state proves nothing about a real regression:
#   - one row per submission. A row is opened `pending` and UPDATED in place to
#     approved / rejected, or to retracted / revoked when it is withdrawn while
#     still awaiting review. Withdrawing an ACCEPTED contribution appends a
#     further row instead, so the acceptance stays on record.
#   - at most ONE row is `pending` (uq_share_attempt_open), and it can only be
#     the last: a row stops being pending the moment anything happens to it.
#   - `recordedAt` increases with `eventNum`, and a new attempt is never opened
#     before the previous one closed, so `recordedAt[n] >= decidedAt[n-1]`.
#     An appended withdrawal row is recorded and decided in the same moment.
#
# `expectedDisplayedAt` is the timestamp the row must SHOW: the decision time
# once decided, the submission time while still open. Because of the ordering
# rules above it never runs backwards, and the loader refuses a case where it
# would — an audit log whose times go backwards is not an audit log.
eventHistoryCases:
  - name: all-five-states-in-ascending-order
    events:
      - eventNum: 1
        status: rejected
        decidedByActor: moderator
        recordedAt: "2026-08-01T09:00:00Z"
        decidedAt: "2026-08-02T10:00:00Z"
        expectedDisplayedAt: "2026-08-02 10:00"
      - eventNum: 2
        status: approved
        decidedByActor: moderator
        recordedAt: "2026-08-03T08:15:00Z"
        decidedAt: "2026-08-04T14:30:00Z"
        expectedDisplayedAt: "2026-08-04 14:30"
      - eventNum: 3
        status: revoked
        decidedByActor: collective
        recordedAt: "2026-08-05T11:00:00Z"
        decidedAt: "2026-08-05T11:00:00Z"
        expectedDisplayedAt: "2026-08-05 11:00"
      - eventNum: 4
        status: retracted
        decidedByActor: owner
        recordedAt: "2026-08-06T07:05:00Z"
        decidedAt: "2026-08-06T08:20:00Z"
        expectedDisplayedAt: "2026-08-06 08:20"
      - eventNum: 5
        status: pending
        decidedByActor: ""
        recordedAt: "2026-08-07T09:40:00Z"
        decidedAt: null
        expectedDisplayedAt: "2026-08-07 09:40"
    expectedLabels:
      - rejected by moderator
      - approved by moderator
      - revoked by collective
      - retracted by owner
      - submitted

  - name: repeated-rejection-then-still-pending
    events:
      - eventNum: 1
        status: rejected
        decidedByActor: moderator
        recordedAt: "2026-08-01T09:00:00Z"
        decidedAt: "2026-08-02T10:00:00Z"
        expectedDisplayedAt: "2026-08-02 10:00"
      - eventNum: 2
        status: rejected
        decidedByActor: moderator
        recordedAt: "2026-08-03T09:00:00Z"
        decidedAt: "2026-08-04T14:30:00Z"
        expectedDisplayedAt: "2026-08-04 14:30"
      - eventNum: 3
        status: pending
        decidedByActor: ""
        recordedAt: "2026-08-05T09:00:00Z"
        decidedAt: null
        expectedDisplayedAt: "2026-08-05 09:00"
    expectedLabels:
      - rejected by moderator
      - rejected by moderator
      - submitted

  - name: withdrawn-by-owner-is-never-phrased-as-a-resubmission
    events:
      - eventNum: 1
        status: retracted
        decidedByActor: owner
        recordedAt: "2026-08-01T09:00:00Z"
        decidedAt: "2026-08-01T16:00:00Z"
        expectedDisplayedAt: "2026-08-01 16:00"
      - eventNum: 2
        status: pending
        decidedByActor: ""
        recordedAt: "2026-08-02T09:00:00Z"
        decidedAt: null
        expectedDisplayedAt: "2026-08-02 09:00"
    expectedLabels:
      - retracted by owner
      - submitted

  - name: removed-by-the-collective-is-distinct-from-a-refusal
    events:
      - eventNum: 1
        status: approved
        decidedByActor: moderator
        recordedAt: "2026-08-01T09:00:00Z"
        decidedAt: "2026-08-02T10:00:00Z"
        expectedDisplayedAt: "2026-08-02 10:00"
      - eventNum: 2
        status: revoked
        decidedByActor: collective
        recordedAt: "2026-08-03T12:00:00Z"
        decidedAt: "2026-08-03T12:00:00Z"
        expectedDisplayedAt: "2026-08-03 12:00"
      - eventNum: 3
        status: rejected
        decidedByActor: moderator
        recordedAt: "2026-08-04T09:00:00Z"
        decidedAt: "2026-08-05T11:30:00Z"
        expectedDisplayedAt: "2026-08-05 11:30"
    expectedLabels:
      - approved by moderator
      - revoked by collective
      - rejected by moderator

  # A history long enough, and spread over enough months, that a row reading the
  # wrong time field or a log rendered newest-first shows up as a time running
  # backwards rather than as a plausible-looking date.
  - name: timestamps-never-run-backwards-across-a-long-history
    events:
      - eventNum: 1
        status: rejected
        decidedByActor: moderator
        recordedAt: "2026-08-01T09:00:00Z"
        decidedAt: "2026-08-02T10:00:00Z"
        expectedDisplayedAt: "2026-08-02 10:00"
      - eventNum: 2
        status: approved
        decidedByActor: moderator
        recordedAt: "2026-08-03T08:15:00Z"
        decidedAt: "2026-08-03T18:45:00Z"
        expectedDisplayedAt: "2026-08-03 18:45"
      - eventNum: 3
        status: retracted
        decidedByActor: owner
        recordedAt: "2026-08-09T07:30:00Z"
        decidedAt: "2026-08-09T07:30:00Z"
        expectedDisplayedAt: "2026-08-09 07:30"
      - eventNum: 4
        status: rejected
        decidedByActor: moderator
        recordedAt: "2026-08-14T10:00:00Z"
        decidedAt: "2026-08-20T16:05:00Z"
        expectedDisplayedAt: "2026-08-20 16:05"
      - eventNum: 5
        status: approved
        decidedByActor: moderator
        recordedAt: "2026-09-02T11:20:00Z"
        decidedAt: "2026-09-04T09:00:00Z"
        expectedDisplayedAt: "2026-09-04 09:00"
      - eventNum: 6
        status: revoked
        decidedByActor: collective
        recordedAt: "2026-09-30T13:10:00Z"
        decidedAt: "2026-09-30T13:10:00Z"
        expectedDisplayedAt: "2026-09-30 13:10"
      - eventNum: 7
        status: pending
        decidedByActor: ""
        recordedAt: "2026-10-05T08:00:00Z"
        decidedAt: null
        expectedDisplayedAt: "2026-10-05 08:00"
    expectedLabels:
      - rejected by moderator
      - approved by moderator
      - retracted by owner
      - rejected by moderator
      - approved by moderator
      - revoked by collective
      - submitted

# The owner-only PAIRS list for one collective
# (`GET /users/me/collectives/{groupId}/submissions`, a bare JSON array),
# which the submissions panel now reads instead of the legacy current-state
# list. Every (transcript, collective) pair the owner has EVER had appears
# here, including one whose every event ended in a withdrawal — that pair has
# no row in the current-state list at all, which is the exact contradiction
# UAT caught (a nonzero withdrawn counter beside "no submissions of yours are
# on record").
#
# When the owner has NO pairs for a collective, the server answers 404 —
# never a 200 with an empty array, the same disposition as "no such
# collective" — so a case models that with `pairs: null`, never `pairs: []`;
# the loader rejects an empty ARRAY as a shape the real server cannot send.
#
# `expectedChips` restates, in served order, the chip text each pair's status
# must render as. retracted and revoked both chip as "withdrawn"; the loader
# checks this against the production chip labeller so a case cannot encode
# wording the app does not produce.
submissionPairCases:
  - name: a-fully-withdrawn-pair-renders-as-a-row-not-empty-copy
    pairs:
      - transcriptId: b4b6e2ad-0000-4000-8000-000000000001
        title: Chasing a refusal loop in Strict Curators
        status: retracted
        eventNum: 4
        recordedAt: "2026-08-06T08:20:00Z"
    expectedChips:
      - withdrawn

  - name: a-genuinely-empty-pairs-list-shows-the-none-on-record-copy
    pairs: null
    expectedChips: []

  - name: a-mixed-collective-renders-every-pair-with-its-own-chip
    pairs:
      - transcriptId: c1a2b3c4-0000-4000-8000-000000000002
        title: null
        status: pending
        eventNum: 1
        recordedAt: "2026-08-10T09:00:00Z"
      - transcriptId: d5e6f7a8-0000-4000-8000-000000000003
        title: Measuring push latency across regions
        status: approved
        eventNum: 1
        recordedAt: "2026-08-01T09:00:00Z"
      - transcriptId: e9f0a1b2-0000-4000-8000-000000000004
        title: A first pass at the pull contract
        status: rejected
        eventNum: 1
        recordedAt: "2026-07-15T09:00:00Z"
      - transcriptId: f3a4b5c6-0000-4000-8000-000000000005
        title: null
        status: retracted
        eventNum: 1
        recordedAt: "2026-07-20T09:00:00Z"
      - transcriptId: a7b8c9d0-0000-4000-8000-000000000006
        title: Notes on the redaction category split
        status: revoked
        eventNum: 2
        recordedAt: "2026-07-25T09:00:00Z"
    expectedChips:
      - pending
      - approved
      - rejected
      - withdrawn
      - withdrawn

# The auth-optional per-transcript list. The server answers an empty list, never
# a refusal, when the viewer may not see a membership or the owner has not
# opted in to being listed as a contributor.
transcriptCollectivesCases:
  - name: approved-memberships-render-as-named-chips
    httpStatus: 200
    collectives:
      - id: 66666666-6666-4666-8666-666666666666
        name: AI Research Team
      - id: 77777777-7777-4777-8777-777777777777
        name: Verified Contributors
    expectedCollectiveNames:
      - AI Research Team
      - Verified Contributors

  - name: owner-not-opted-in-returns-an-empty-list-not-a-refusal
    httpStatus: 200
    collectives: []
    expectedCollectiveNames: []

  - name: transcript-in-no-collective-renders-nothing
    httpStatus: 200
    collectives: []
    expectedCollectiveNames: []
