# The new-collective dialog, opened from /collectives.
#
# `steps` is what a person does: the name and purpose on the first step, the
# publish and read cards (by label) and an org on the second, and the
# usernames to invite on the third. The collective is created when they press
# "create collective"; each person is then invited with POST
# /collectives/{id}/invitations, and the last step reports every outcome. The
# server answers 202 for every name it takes, whether or not an account holds
# it, so a sent invitation never says the person was found.
#
# The viewer is alice-dev; the server gives the created collective the id
# c0000000-0000-4000-8000-0000000000aa.

orgs:
  - { login: acme, visible: true }
  - { login: hidden-org, visible: false }

createCases:
  - name: a-curated-collective-with-two-people-invited
    why: >-
      the create body carries the trimmed name, the purpose and both policies;
      a leading @ is dropped from a username; both people are invited after the
      collective exists and the summary counts the invitations, not members.
    steps:
      name: "  Eval Crowd  "
      purpose: Agent evaluation runs for the spring term.
      publish: sessions you approve
      read: members and contributors
      invite: [Tomas-R, "@jun-li"]
    refusals: []
    expect:
      create: { name: Eval Crowd, description: Agent evaluation runs for the spring term., acceptance_mode: curated, data_access: contributors }
      inviteRequests: [Tomas-R, jun-li]
      ready: Eval Crowd is ready
      summary: 2 invitations sent. members publish to it from peasant, and you approve each session.
      notSent: []

  - name: a-refused-invitation-is-reported-and-never-counted
    why: >-
      an invitation the server refuses (here the inviter's limit) is listed
      with its reason and is not in the count; the one it took still is.
    steps:
      name: Night Shift
      purpose: ""
      publish: anyone who joins
      read: members
      invite: [carol-ml, dana-q]
    refusals:
      - { method: POST, path: /collectives/c0000000-0000-4000-8000-0000000000aa/invitations, username: dana-q, status: 429, error: invitation limit reached }
    expect:
      create: { name: Night Shift, description: "", acceptance_mode: open, data_access: members_only }
      inviteRequests: [carol-ml, dana-q]
      ready: Night Shift is ready
      summary: 1 invitation sent. anyone can join it and publish from peasant.
      notSent: ["you've reached the invitation limit. revoke an open invitation or try again tomorrow."]

  - name: an-org-collective-sends-the-chosen-org-and-nobody-to-add
    why: >-
      "your github org" offers only the person's visible orgs and sends the
      chosen one; with nobody to add, the summary says only how the
      collective works.
    steps:
      name: Acme Reviews
      purpose: ""
      publish: your github org
      org: acme
      read: members
      invite: []
    refusals: []
    expect:
      create: { name: Acme Reviews, description: "", acceptance_mode: verified_only, data_access: members_only, linked_github_org: acme }
      inviteRequests: []
      ready: Acme Reviews is ready
      summary: members of the acme github org can join it and publish from peasant.
      notSent: []

# A create the server refuses: each refusal is shown on the step that owns it.
refusalCases:
  - name: an-org-refusal-returns-to-the-access-step
    why: the org is chosen on the access step, so the server's reason is shown there.
    steps: { name: Acme Reviews, purpose: "", publish: your github org, org: acme, read: members, invite: [] }
    refusal: { status: 400, error: You must be a member of the GitHub organization to link this collective to it }
    expect: { step: access, message: You must be a member of the GitHub organization to link this collective to it }

  - name: a-name-refusal-returns-to-the-name-field
    why: >-
      the server refuses names it will not take (names are not unique, so it
      never answers "taken"); its reason marks the name field.
    steps: { name: Night Shift, purpose: "", publish: anyone who joins, read: members, invite: [] }
    refusal: { status: 400, error: Name is required }
    expect: { step: name and purpose, message: Name is required }

  - name: any-other-refusal-stays-on-the-invite-step
    why: >-
      a failure that is about no field keeps the person where they pressed
      create, with the server's message, and invites nobody.
    steps: { name: Night Shift, purpose: "", publish: anyone who joins, read: members, invite: [carol-ml] }
    refusal: { status: 500, error: Failed to create group }
    expect: { step: invite, message: "could not create the collective: Failed to create group" }

# Checks the dialog makes before anything is sent.
guardCases:
  - name: an-empty-name-cannot-continue
    why: a collective needs a name; a blank one stays on the first step with the field marked.
    step: name and purpose
    input: "   "
    expect: a collective needs a name.

  - name: you-cannot-add-yourself
    why: >-
      the owner is a member already, so inviting them would only be refused;
      the dialog refuses the person's own handle, in any case.
    step: invite
    input: "@Alice-Dev"
    expect: that is you. you own the collective already.

  - name: a-person-is-listed-once
    why: the same username twice is one person.
    step: invite
    input: BOB-AI
    already: [bob-ai]
    expect: "@BOB-AI is on the list already."

  - name: an-org-collective-needs-a-visible-org
    why: >-
      with no org linked to the profile there is nothing to choose; the dialog
      says so and does not continue.
    step: access
    orgs: [{ login: hidden-org, visible: false }]
    expect: pick a github org, or choose who can publish another way.
