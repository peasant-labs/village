# Case corpus for `src/homePage.test.tsx` — the signed-in home route (`/`) and
# the explore route (`/explore`).
#
# Deletion protection is the required-NAME manifest in
# `src/test/homePageFixtures.ts`. A removed or renamed case fails the loader
# because its name goes missing from the declared set.

# Which surface each (path, viewer) pair must land on. `/` is the only route
# whose answer depends on who is asking.
routeCases:
  - name: signed-out-visitor-at-the-root-still-gets-explore
    path: "/"
    viewerUsername: null
    expectSurface: explore
  - name: signed-in-visitor-at-the-root-gets-their-own-home
    path: "/"
    viewerUsername: alice-dev
    expectSurface: home
  - name: signed-in-visitor-at-explore-gets-explore
    path: "/explore"
    viewerUsername: alice-dev
    expectSurface: explore
  - name: signed-out-visitor-at-explore-gets-explore
    path: "/explore"
    viewerUsername: null
    expectSurface: explore

# Which top-nav entry is marked active for a given (signed-in, pathname) pair.
# Discovery's entry moved off "/", so the entry a visitor sees highlighted is
# the part of the move most likely to regress quietly.
navCases:
  - name: signed-in-visitor-at-the-root-highlights-home
    isLoggedIn: true
    pathname: "/"
    expectLabels: [home, explore, collectives, publish, profile]
    expectActiveLabel: home
  - name: signed-in-visitor-at-explore-highlights-explore
    isLoggedIn: true
    pathname: "/explore"
    expectLabels: [home, explore, collectives, publish, profile]
    expectActiveLabel: explore
  - name: signed-out-visitor-at-the-root-highlights-explore
    isLoggedIn: false
    pathname: "/"
    expectLabels: [explore]
    expectActiveLabel: explore
  - name: signed-out-visitor-has-no-home-entry-at-explore
    isLoggedIn: false
    pathname: "/explore"
    expectLabels: [explore]
    expectActiveLabel: explore
  - name: a-transcript-page-still-highlights-explore
    isLoggedIn: true
    pathname: "/transcripts/abc123"
    expectLabels: [home, explore, collectives, publish, profile]
    expectActiveLabel: explore

# What the home surface renders for a given owner-scoped transcript list: the
# table of the person's own transcripts, the totals above it, and the rail of
# their collectives beside it.
#
# Three fields describe the REQUEST rather than the rows, and each is written on
# every case, never defaulted, so a case can never be silently read as the happy
# path because a field was forgotten.
#
#   usernameChosen     whether the account claims a chosen handle. A blank handle
#                      on an unchosen account is on its way to `/welcome`; a
#                      blank handle on a chosen one is a contract violation.
#   requestFailure     `never`, `always`, or `after-first-answer` (the refresh
#                      fails once rows have already been confirmed).
#   expectHomeSurface  which of the page's six answers the case must land on.
#                      A closed set, so a case cannot invent a seventh.
#
# Two more are written on every case too:
#
#   expectRowTitles     the titles the table lists when the page first settles,
#                       in order. The mock serves the rows in the order written
#                       here, a page at a time, so a case whose rows are NOT
#                       written newest first proves the page orders them itself.
#   expectProjectLinks  for each listed title, where its project name links: the
#                       project page under the viewer's own profile, or null for
#                       a row that arrived with no project identity.
#
# The rest are OPTIONAL, and each is present only on the case about it. Absent,
# the mock serves no totals, no collectives and nothing waiting.
#
#   stats / expectStats            GET /users/me/stats, and the summary line.
#   collectives                    GET /groups (the caller's memberships).
#   expectRailCollectives          what the rail names for each, in order.
#   contributions / expectWaiting  GET /users/me/collectives/contributions, and
#                                  the collectives the waiting section names.
#   search                         a query typed into the search box, and the
#                                  titles the table lists for it.
#   loadMore                       the titles after pressing `show N more` once.
#   expectPullRequestCells         the pull requests column for named rows.
#   expectSharedWithCells          the shared with column for named rows.
homeCases:
  - name: recent-sessions-lead-and-projects-follow
    # Newest first, whatever order the rows arrive in, and each row's project
    # name leads to that project's page.
    viewerUsername: alice-dev
    transcripts:
      - id: t-oldest
        title: first steps
        projectHash: "1111111111111111111111111111111111111111111111111111111111111111"
        projectDisplayName: village
        publishedAt: "2026-08-01T10:00:00.000Z"
      - id: t-newest
        title: publish wizard rebuild
        projectHash: "2222222222222222222222222222222222222222222222222222222222222222"
        projectDisplayName: peasant
        publishedAt: "2026-08-20T10:00:00.000Z"
        sharedWith: [Acme Platform, Acme Company]
      - id: t-middle
        title: license menu
        projectHash: "1111111111111111111111111111111111111111111111111111111111111111"
        projectDisplayName: village
        publishedAt: "2026-08-10T10:00:00.000Z"
        visibility: public
    usernameChosen: true
    requestFailure: never
    expectHomeSurface: rows
    expectRowTitles:
      - publish wizard rebuild
      - license menu
      - first steps
    expectProjectLinks:
      - title: publish wizard rebuild
        href: /users/alice-dev/projects/2222222222222222222222222222222222222222222222222222222222222222
      - title: license menu
        href: /users/alice-dev/projects/1111111111111111111111111111111111111111111111111111111111111111
      - title: first steps
        href: /users/alice-dev/projects/1111111111111111111111111111111111111111111111111111111111111111
    # The collectives that approved a row are named in their own case; with none,
    # the row's own visibility answers.
    expectSharedWithCells:
      - title: publish wizard rebuild
        text: [Acme Platform, Acme Company]
      - title: license menu
        text: [public]
      - title: first steps
        text: [only you]

