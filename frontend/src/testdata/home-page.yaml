    viewerUsername: alice-dev
    # The request never answers, so the page has no rows — but the person may
    # well own hundreds. Telling them they have published nothing, and offering
    # them a way to publish their first, is the failure this case forbids.
    transcripts: []
    usernameChosen: true
    requestFailure: always
    expectHomeSurface: failure
    expectRowTitles: []
    expectProjectLinks: []

  - name: a-failed-refresh-keeps-the-rows-it-already-had
    viewerUsername: alice-dev
    # The first answer arrives and is rendered; a later refresh fails. Replacing
    # the whole library with an error panel because a LATER request failed is
    # the same lie as calling it empty, so the rows stay and a notice says they
    # could not be refreshed.
    transcripts:
      - id: t-confirmed
        title: a confirmed session
        projectHash: "6666666666666666666666666666666666666666666666666666666666666666"
        projectDisplayName: village
        publishedAt: "2026-08-19T10:00:00Z"
    usernameChosen: true
    requestFailure: after-first-answer
    expectHomeSurface: stale
    expectRowTitles:
      - a confirmed session
    expectProjectLinks:
      - title: a confirmed session
        href: /users/alice-dev/projects/6666666666666666666666666666666666666666666666666666666666666666

  - name: a-handle-still-being-chosen-asks-for-nothing
    # No handle yet, and the account has not claimed one, so the handle gate is
    # already on its way to `/welcome`. A request now would carry a blank owner
    # filter, which the list handler drops: the whole commons would arrive under
    # a heading that says "your". The page holds still instead.
    viewerUsername: ""
    transcripts: []
    usernameChosen: false
    requestFailure: never
    expectHomeSurface: skeleton
    expectRowTitles: []
    expectProjectLinks: []

  - name: a-chosen-handle-that-is-blank-says-so
    # The account claims a chosen handle and carries none, so nothing is coming
    # to fix it: the redirect that rescues an unchosen handle never fires. The
    # page cannot ask, and says so rather than shimmering forever.
    viewerUsername: ""
    transcripts: []
    usernameChosen: true
    requestFailure: never
    expectHomeSurface: no-handle
    expectRowTitles: []
    expectProjectLinks: []

