# Ordering cases for the exported sort itself, including timestamps that do NOT
# parse. The mounted corpus above rejects an unparseable timestamp on purpose (a
# row that cannot be grouped teaches nothing about grouping), so the branch that
# keeps a bad value from throwing has no other way to be reached.
sortCases:
  - name: newest-first-among-parseable-timestamps
    given:
      - id: middle
        publishedAt: "2026-08-10T10:00:00Z"
      - id: newest
        publishedAt: "2026-08-20T10:00:00Z"
      - id: oldest
        publishedAt: "2026-08-01T10:00:00Z"
    expectOrder: [newest, middle, oldest]

  - name: an-unparseable-timestamp-sorts-last-instead-of-throwing
    given:
      - id: unparseable
        publishedAt: "not a timestamp"
      - id: older
        publishedAt: "2026-08-01T10:00:00Z"
      - id: newer
        publishedAt: "2026-08-20T10:00:00Z"
    expectOrder: [newer, older, unparseable]

  - name: two-unparseable-timestamps-keep-the-order-they-arrived-in
    # What this case can and cannot prove: it catches a comparator that returns
    # a NEGATIVE number for two unparseable values, which would reorder them.
    # It cannot tell zero from any other non-negative number, and no number of
    # rows would, because a sort never moves a pair on a non-negative
    # comparison. The extra row is here so the run is longer than a single
    # pair, not because length discriminates anything.
    given:
      - id: first-bad
        publishedAt: ""
      - id: second-bad
        publishedAt: "also not a timestamp"
      - id: third-bad
        publishedAt: "nor is this one"
    expectOrder: [first-bad, second-bad, third-bad]

# A failure remembered for one person's list must not describe the next one's.
# The session query is an ordinary query with focus refetching left on, so the
# handle CAN change while the page stays mounted; at that moment the new list
# request has no rows of its own, so the memory's clear condition cannot fire
# and only the owner-keyed read stops the previous person's failure being shown
# over a request that has not failed.
viewerChangeCases:
  - name: a-new-handle-does-not-inherit-the-previous-handle-failure
    firstViewer: alice-dev
    secondViewer: beta-dev
