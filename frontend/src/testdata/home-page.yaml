# Case corpus for `src/homePage.test.tsx`: the root route (`/`), the sign-in
# route (`/login`), the explore route (`/explore`), and the nav the app chrome
# mounts around them.
#
# Deletion protection is the required-NAME manifest in
# `src/test/homePageFixtures.ts`. A removed or renamed case fails the loader
# because its name goes missing from the declared set.

# Which surface each (path, viewer) pair must land on. The app's one signed-out
# view is a public transcript (`signed-out-transcript.yaml`); on these routes
# anybody without a session is sent to the marketing site's log-in popup (the
# frame says where it is taking them and leaves), `/login` included. A
# signed-in visitor gets the page: home at `/`, discovery at `/explore`, which
# left the root and the nav and keeps its own address.
routeCases:
  - name: signed-out-visitor-at-the-root-leaves-for-the-marketing-site
    path: "/"
    viewerUsername: null
    expectSurface: marketing
  - name: signed-out-visitor-at-login-leaves-for-the-marketing-site
    path: "/login"
    viewerUsername: null
    expectSurface: marketing
  - name: signed-in-visitor-at-the-root-gets-their-own-home
    path: "/"
    viewerUsername: alice-dev
    expectSurface: home
  - name: signed-in-visitor-at-explore-gets-explore
    path: "/explore"
    viewerUsername: alice-dev
    expectSurface: explore
  - name: signed-out-visitor-at-explore-leaves-for-the-marketing-site
    path: "/explore"
    viewerUsername: null
    expectSurface: marketing

# What the MOUNTED sidebar offers for a (signed-in, address) pair. Every
# signed-in case is served one collective the viewer belongs to, Acme Platform
# (c011ec71-0000-4000-8000-000000000001), so its row follows the sections.
#   expectNav          which navigation the chrome draws: `sections` (home,
#                      discover, pull requests, collectives and the viewer's
#                      collectives, on every signed-in page, a collective's
#                      settings page included), `public` (the public bar, on
#                      the one page a signed-out reader is served), or `none`
#                      (a signed-out visitor anywhere else is sent to sign in
#                      and gets no chrome at all).
#   expectLabels       that navigation's entries, in order.
#   expectActiveLabel  the one entry marked current, or null for none.
#   expectBackHref     where the settings navigation's way back leads, or null
#                      when there is none. Written on every case so none is
#                      read as "no link" by omission.
navCases:
  - name: signed-in-visitor-at-the-root-highlights-home
    isLoggedIn: true
    pathname: "/"
    expectNav: sections
    expectLabels: [home, discover, pull requests, collectives, Acme Platform]
    expectActiveLabel: home
    expectBackHref: null
  - name: signed-in-visitor-at-their-collective-highlights-it
    isLoggedIn: true
    pathname: "/collectives/c011ec71-0000-4000-8000-000000000001"
    expectNav: sections
    expectLabels: [home, discover, pull requests, collectives, Acme Platform]
    expectActiveLabel: Acme Platform
    expectBackHref: null
  - name: signed-in-visitor-at-another-collective-highlights-collectives
    isLoggedIn: true
    pathname: "/collectives/acme-elsewhere"
    expectNav: sections
    expectLabels: [home, discover, pull requests, collectives, Acme Platform]
    expectActiveLabel: collectives
    expectBackHref: null
  - name: a-transcript-page-highlights-home
    isLoggedIn: true
    pathname: "/transcripts/abc123"
    expectNav: sections
    expectLabels: [home, discover, pull requests, collectives, Acme Platform]
    expectActiveLabel: home
    expectBackHref: null
  # A transcript marks the place it was opened from, which its address carries
  # (`?in=`): the person's collective, collectives for one they are not in,
  # pull requests, or home.
  - name: a-transcript-opened-from-their-collective-highlights-it
    isLoggedIn: true
    pathname: "/transcripts/abc123?in=collective:c011ec71-0000-4000-8000-000000000001"
    expectNav: sections
    expectLabels: [home, discover, pull requests, collectives, Acme Platform]
    expectActiveLabel: Acme Platform
    expectBackHref: null
  - name: a-transcript-opened-from-another-collective-highlights-collectives
    isLoggedIn: true
    pathname: "/transcripts/abc123?in=collective:acme-elsewhere"
    expectNav: sections
    expectLabels: [home, discover, pull requests, collectives, Acme Platform]
    expectActiveLabel: collectives
    expectBackHref: null
  - name: a-transcript-opened-from-a-pull-request-highlights-pull-requests
    isLoggedIn: true
    pathname: "/transcripts/abc123?in=pull:acme/app/42&turn=3"
    expectNav: sections
    expectLabels: [home, discover, pull requests, collectives, Acme Platform]
    expectActiveLabel: pull requests
    expectBackHref: null
  - name: a-transcript-opened-from-home-highlights-home
    isLoggedIn: true
    pathname: "/transcripts/abc123?in=home"
    expectNav: sections
    expectLabels: [home, discover, pull requests, collectives, Acme Platform]
    expectActiveLabel: home
    expectBackHref: null
  - name: a-pull-request-page-highlights-pull-requests
    isLoggedIn: true
    pathname: "/pulls/acme/app/42"
    expectNav: sections
    expectLabels: [home, discover, pull requests, collectives, Acme Platform]
    expectActiveLabel: pull requests
    expectBackHref: null
  - name: discover-highlights-discover
    isLoggedIn: true
    pathname: "/discover"
    expectNav: sections
    expectLabels: [home, discover, pull requests, collectives, Acme Platform]
    expectActiveLabel: discover
    expectBackHref: null
  - name: signed-in-visitor-at-explore-highlights-discover
    isLoggedIn: true
    pathname: "/explore"
    expectNav: sections
    expectLabels: [home, discover, pull requests, collectives, Acme Platform]
    expectActiveLabel: discover
    expectBackHref: null
  - name: signed-in-visitor-at-publish-highlights-nothing
    isLoggedIn: true
    pathname: "/publish"
    expectNav: sections
    expectLabels: [home, discover, pull requests, collectives, Acme Platform]
    expectActiveLabel: null
    expectBackHref: null
  - name: a-collectives-settings-page-keeps-the-sections
    # The sidebar stays the app's own on a settings page, the collective marked
    # current; the settings sections are a bar inside the page body, as on
    # `/settings`.
    isLoggedIn: true
    pathname: "/collectives/c011ec71-0000-4000-8000-000000000001/settings?section=members"
    expectNav: sections
    expectLabels: [home, discover, pull requests, collectives, Acme Platform]
    expectActiveLabel: Acme Platform
    expectBackHref: null
  - name: signed-out-visitor-at-the-root-is-offered-no-entries
    isLoggedIn: false
    pathname: "/"
    expectNav: none
    expectLabels: []
    expectActiveLabel: null
    expectBackHref: null
  - name: signed-out-visitor-at-explore-is-offered-no-entries
    isLoggedIn: false
    pathname: "/explore"
    expectNav: none
    expectLabels: []
    expectActiveLabel: null
    expectBackHref: null
  - name: a-signed-out-transcript-reader-gets-no-sidebar
    # The reader of a transcript its server did not mark public, who is not
    # signed in, is sent to sign in first, with no sidebar of sections drawn
    # on the way. (A public one is `signed-out-transcript.yaml`'s.)
    isLoggedIn: false
    pathname: "/transcripts/abc123"
    expectNav: none
    expectLabels: []
    expectActiveLabel: null
    expectBackHref: null
  - name: a-signed-out-privacy-reader-gets-the-public-bar
    # The privacy notice is the one page served without a session (the log-in
    # popup links to it): the public bar, with one way in.
    isLoggedIn: false
    pathname: "/privacy"
    expectNav: public
    expectLabels: []
    expectActiveLabel: null
    expectBackHref: null

# The account menu at the foot of the sidebar, the only way to the signed-in
# person's profile and the only way to sign out from the chrome. Each row names the item as it is read and what choosing it
# must do: `navigate` pushes `target`; `sign-out` posts to the logout route.
# The rows are the menu's whole item set, in order.
accountMenuCases:
  - name: profile-opens-the-signed-in-persons-profile
    item: profile
    effect: navigate
    target: "/users/alice-dev"
  - name: settings-opens-the-signed-in-persons-settings
    item: settings
    effect: navigate
    target: "/settings"
  - name: sign-out-ends-the-session
    item: sign out
    effect: sign-out
    target: null

# What the home surface renders for a given owner-scoped transcript list: the
# table of the person's own transcripts, the totals above it, the newest few as
# cards, and what is waiting for a collective's approval. The person's
# collectives are listed in the sidebar (`src/sidebar.test.tsx`).
#
# Three fields describe the REQUEST rather than the rows, and each is written on
# every case, never defaulted, so a case can never be silently read as the happy
# path because a field was forgotten.
#
#   usernameChosen     whether the account claims a chosen handle. A blank handle
#                      on an unchosen account is on its way to `/welcome`; a
#                      blank handle on a chosen one is a contract violation.
#   requestFailure     `never`, `always`, or `after-first-answer` (the refresh
#                      fails once rows have already been confirmed).
#   expectHomeSurface  which of the page's six answers the case must land on.
#                      A closed set, so a case cannot invent a seventh.
#
# Two more are written on every case too:
#
#   expectRowTitles     the titles the table lists when the page first settles,
#                       in order. The mock serves the rows in the order written
#                       here, a page at a time, so a case whose rows are NOT
#                       written newest first proves the page orders them itself.
#   expectProjectLinks  for each listed title, where its project name links: the
#                       project page under the viewer's own profile, or null for
#                       a row that arrived with no project identity.
#
# The rest are OPTIONAL, and each is present only on the case about it. Absent,
# the mock serves no totals, no collectives and nothing waiting.
#
#   stats / expectStats            GET /users/me/stats, and the summary line.
#   collectives                    GET /collectives (the caller's memberships),
#                                  which the totals count.
#   contributions / expectWaiting  GET /users/me/collectives/contributions, and
#                                  the collectives the waiting notice names.
#   search                         a query typed into the search box, and the
#                                  titles the table lists for it.
#   pages                          the numbered pages the case presses through,
#                                  each naming its own rows.
#   clampFrom / startPage          a cold URL past the last page, and the page
#                                  the URL carries on mount.
#   expectRequestedPages           every page the test should see requested.
#   expectPullRequestCells         the pull requests column for named rows.
#   expectSharedWithCells          the shared with column for named rows.
homeCases:
  - name: canonical-provider-marks-use-received-harness-without-provider-facts
    viewerUsername: alice-dev
    transcripts:
      - { id: mark-claude, title: Claude recorded work, projectHash: "aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa", projectDisplayName: village, publishedAt: "2026-08-21T12:00:00Z", modelProvider: claude-code }
      - { id: mark-codex, title: Codex recorded work, projectHash: "aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa", projectDisplayName: village, publishedAt: "2026-08-21T11:00:00Z", modelProvider: codex }
      - { id: mark-unknown, title: Earlier recorded work, projectHash: "aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa", projectDisplayName: village, publishedAt: "2026-08-21T10:00:00Z", modelProvider: earlier-agent }
    usernameChosen: true
    requestFailure: never
    expectHomeSurface: rows
    expectRowTitles: [Claude recorded work, Codex recorded work, Earlier recorded work]
    expectProjectLinks: []
    expectProviderMarks:
      - { title: Claude recorded work, brand: claude, name: claude-code }
      - { title: Codex recorded work, brand: openai, name: codex }
      - { title: Earlier recorded work, brand: null, name: earlier-agent }
  - name: recent-sessions-lead-and-projects-follow
    # Newest first, whatever order the rows arrive in, and each row's project
    # name leads to that project's page.
    viewerUsername: alice-dev
    transcripts:
      - id: t-oldest
        title: first steps
        projectHash: "1111111111111111111111111111111111111111111111111111111111111111"
        projectDisplayName: village
        publishedAt: "2026-08-01T10:00:00.000Z"
      - id: t-newest
        title: publish wizard rebuild
        projectHash: "2222222222222222222222222222222222222222222222222222222222222222"
        projectDisplayName: peasant
        publishedAt: "2026-08-20T10:00:00.000Z"
        sharedWith: [Acme Platform, Acme Company]
      - id: t-middle
        title: license menu
        projectHash: "1111111111111111111111111111111111111111111111111111111111111111"
        projectDisplayName: village
        publishedAt: "2026-08-10T10:00:00.000Z"
        visibility: public
    usernameChosen: true
    requestFailure: never
    expectHomeSurface: rows
    expectRowTitles:
      - publish wizard rebuild
      - license menu
      - first steps
    expectProjectLinks:
      - title: publish wizard rebuild
        href: /users/alice-dev/projects/2222222222222222222222222222222222222222222222222222222222222222
      - title: license menu
        href: /users/alice-dev/projects/1111111111111111111111111111111111111111111111111111111111111111
      - title: first steps
        href: /users/alice-dev/projects/1111111111111111111111111111111111111111111111111111111111111111
    # The collectives that approved a row are named in their own case; with none,
    # the row's own visibility answers.
    expectSharedWithCells:
      - title: publish wizard rebuild
        text: [Acme Platform, Acme Company]
      - title: license menu
        text: [anyone with the link]
      - title: first steps
        text: [not shared with collective members]

  - name: public-link-access-is-named-alongside-approved-collectives
    viewerUsername: alice-dev
    transcripts:
      - { id: public-approved, title: Public approved session, projectHash: "aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa", projectDisplayName: village, publishedAt: "2026-08-21T10:00:00Z", visibility: public, sharedWith: [Acme Platform] }
    usernameChosen: true
    requestFailure: never
    expectHomeSurface: rows
    expectRowTitles: [Public approved session]
    expectProjectLinks: []
    expectSharedWithCells:
      - { title: Public approved session, text: [anyone with the link, Acme Platform] }

  - name: pending-private-submission-does-not-claim-author-only-access
    viewerUsername: alice-dev
    transcripts:
      - { id: private-pending, title: Private pending session, projectHash: "aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa", projectDisplayName: village, publishedAt: "2026-08-21T10:00:00Z", visibility: private }
    usernameChosen: true
    requestFailure: never
    expectHomeSurface: rows
    expectRowTitles: [Private pending session]
    expectProjectLinks: []
    contributions:
      - { id: 33333333-3333-4333-8333-333333333333, name: ML Reading Group, pending: 1 }
    expectWaiting: [ML Reading Group]
    expectSharedWithCells:
      - { title: Private pending session, text: [not shared with collective members] }

  - name: private-visibility-does-not-claim-retained-approved-members-can-read
    viewerUsername: alice-dev
    transcripts:
      - { id: private-approved, title: Private approved session, projectHash: "aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa", projectDisplayName: village, publishedAt: "2026-08-21T10:00:00Z", visibility: private, sharedWith: [Acme Platform] }
    usernameChosen: true
    requestFailure: never
    expectHomeSurface: rows
    expectRowTitles: [Private approved session]
    expectProjectLinks: []
    expectSharedWithCells:
      - { title: Private approved session, text: [not shared with collective members] }

