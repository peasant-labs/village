# Case corpus for `src/collectivePage.test.tsx`: the collective page and the
# collectives list, each mounted through its real route with REST stubbed at
# `fetch`. The collective page is composed from the online page patterns; the
# list is rendered by fairtrade's `CollectivesView`.
#
# Each overflow item names the route it opens; `{id}` is the collective's id.
#
# The three policy chips restate what the server decided (`data_access`,
# `acceptance_mode`, `your_role`, `can_read`) from the viewer's side; they
# decide nothing. A case states the server's answer and the words the page
# must show for it.
#
# Deletion protection is the required-name manifest in
# `src/test/collectivePageFixtures.ts`.

# The world every page case starts from. A case overrides the group fields,
# the viewer's role and what the server lets them read.
collective:
  id: 5b0c9a1e-0000-4000-8000-00000000c011
  name: Acme Platform
  description: Transcripts behind the ingest and web services.

viewer:
  id: 5b0c9a1e-0000-4000-8000-0000000000a1
  username: alice-dev

members:
  - { id: 5b0c9a1e-0000-4000-8000-0000000000a1, username: alice-dev, name: Alice Developer, role: owner }
  - { id: 5b0c9a1e-0000-4000-8000-0000000000b2, username: bob-ai, name: Bob Ainsley, role: member }
  - { id: 5b0c9a1e-0000-4000-8000-0000000000c3, username: carol-ml, name: Carol Mendes, role: member }
  - { id: 5b0c9a1e-0000-4000-8000-0000000000d4, username: dan-ops, name: Dan Okafor, role: contributor }
  - { id: 5b0c9a1e-0000-4000-8000-0000000000e5, username: erin-web, name: null, role: pending }

transcripts:
  - { id: 7a000000-0000-4000-8000-000000000001, title: Fix flaky ingest test, author: alice-dev, pullRequests: [acme/ingest-api#42, acme/ingest-api#45], pullRequestCount: 2 }
  - { id: 7a000000-0000-4000-8000-000000000002, title: Migrate retry queue to worker, author: bob-ai, pullRequests: [], pullRequestCount: 0 }

# What the GitHub App offers the owner, and how many members publish from each.
available:
  - { repo: acme/ingest-api, private: true, publishers: 2 }
  - { repo: acme/web, private: false, publishers: 0 }
  - { repo: acme/worker, private: false, publishers: 3 }
  - { repo: acme/cli, private: false, publishers: 1 }

# What waits for the owner's approval in a curated collective
# (`GET /collectives/{id}/pending`), for the cases that serve it.
pending:
  - { transcript_id: 7b000000-0000-4000-8000-000000000001, title: Add retries to the webhook, owner: dan-ops, provider: codex, project: ingest-api, branch: retries }
  - { transcript_id: 7b000000-0000-4000-8000-000000000002, title: Trim the onboarding copy, owner: carol-ml, provider: claude-code, project: web, branch: main }

# `signedIn: false` reads the page with no account (`/auth/me` answers 401).
# `actions` are the controls in the head's action row, in order, by name.
# `tabs` are the tabs offered, in order. `orgLine` is the stats tab's github
# org line; `memberBreakdown: null` is a member list the owner keeps private.
cases:
  - name: the-owner-sees-the-chips-the-org-total-and-both-overflow-items
    why: >-
      the owner of a curated collective linked to acme: the chips say they
      approve each session, members read and they are the owner; the stats tab
      counts the linked repositories against what the App offers; publish and
      review both move into more; the waiting tab is theirs; the members
      summary leaves out the pending request.
    signedIn: true
    role: owner
    canRead: true
    group: { acceptance_mode: curated, data_access: members_only, linked_github_org: acme, display_members: true }
    linked: [acme/ingest-api, acme/web]
    expect:
      whoCanPublish: you approve each session
      whoCanRead: members read
      yourRole: you are the owner
      actions: [more, settings, invite people]
      overflow:
        - { label: publish several transcripts, route: "/collectives/{id}/contribute" }
        - { label: review transcripts, route: "/collectives/{id}/review" }
      tabs: [transcripts, waiting for approval, members, stats]
      statusColumn: true
      transcriptRows: 2
      orgLine: "acme: 2 of 4 repos linked"
      manage: true
      memberBreakdown: 1 owner, 2 members, 1 contributor
      memberCount: 4

  - name: an-owner-without-an-org-is-offered-connect-github
    why: >-
      a collective with no linked org shows "nothing linked" and gives its
      owner the install handshake instead of a manage button; an open
      collective has no review item, no waiting tab and no status column.
    signedIn: true
    role: owner
    canRead: true
    group: { acceptance_mode: open, data_access: members_only, linked_github_org: null, display_members: true }
    linked: []
    expect:
      whoCanPublish: anyone who joins publishes
      whoCanRead: members read
      yourRole: you are the owner
      actions: [more, connect github, settings, invite people]
      overflow:
        - { label: publish several transcripts, route: "/collectives/{id}/contribute" }
      tabs: [transcripts, members, stats]
      statusColumn: false
      transcriptRows: 2
      orgLine: nothing linked
      manage: false
      memberBreakdown: 1 owner, 2 members, 1 contributor
      memberCount: 4

  - name: a-member-sees-the-org-without-the-total-and-can-leave
    why: >-
      only the owner may read what the App offers, so a member sees the org
      without the "of M" total and no manage button; members and contributors
      both read under data access contributors.
    signedIn: true
    role: member
    canRead: true
    group: { acceptance_mode: verified_only, data_access: contributors, linked_github_org: acme, display_members: true }
    linked: [acme/ingest-api, acme/web]
    expect:
      whoCanPublish: members of the acme github org publish
      whoCanRead: members and contributors read
      yourRole: you are a member
      actions: [more, leave]
      overflow:
        - { label: publish several transcripts, route: "/collectives/{id}/contribute" }
      tabs: [transcripts, members, stats]
      statusColumn: false
      transcriptRows: 2
      orgLine: acme
      manage: false
      memberBreakdown: 1 owner, 2 members, 1 contributor
      memberCount: 4

  - name: a-contributor-who-cannot-read-is-told-so
    why: >-
      under members_only a contributor publishes but does not read; the role
      chip restates the server's can_read, and the transcripts tab says the
      data access is restricted instead of drawing a table.
    signedIn: true
    role: contributor
    canRead: false
    group: { acceptance_mode: open, data_access: members_only, linked_github_org: acme, display_members: true }
    linked: [acme/ingest-api]
    expect:
      whoCanPublish: anyone who joins publishes
      whoCanRead: members read
      yourRole: you publish here but cannot read
      actions: [more, leave]
      overflow:
        - { label: publish several transcripts, route: "/collectives/{id}/contribute" }
      tabs: [transcripts, members, stats]
      statusColumn: false
      transcriptRows: 0
      orgLine: acme
      manage: false
      memberBreakdown: 1 owner, 2 members, 1 contributor
      memberCount: 4

  - name: a-non-member-of-an-open-collective-can-join
    why: >-
      someone who has not joined sees the chips, no overflow and no settings,
      and the one action open to them is join.
    signedIn: true
    role: ""
    canRead: false
    group: { acceptance_mode: open, data_access: members_only, linked_github_org: acme, display_members: true }
    linked: []
    expect:
      whoCanPublish: anyone who joins publishes
      whoCanRead: members read
      yourRole: you are not a member
      actions: [join]
      overflow: []
      tabs: [transcripts, members, stats]
      statusColumn: false
      transcriptRows: 0
      orgLine: acme
      manage: false
      memberBreakdown: 1 owner, 2 members, 1 contributor
      memberCount: 4

  - name: a-non-member-of-a-curated-collective-is-offered-no-join
    why: >-
      a curated collective is joined by invitation only (the join route refuses
      everyone else), so no join button is drawn.
    signedIn: true
    role: ""
    canRead: false
    group: { acceptance_mode: curated, data_access: members_only, linked_github_org: null, display_members: true }
    linked: []
    expect:
      whoCanPublish: the owner approves each session
      whoCanRead: members read
      yourRole: the owner invites members
      actions: []
      overflow: []
      tabs: [transcripts, members, stats]
      statusColumn: false
      transcriptRows: 0
      orgLine: nothing linked
      manage: false
      memberBreakdown: 1 owner, 2 members, 1 contributor
      memberCount: 4

  - name: a-signed-out-reader-of-a-public-collective-reads-and-is-asked-to-sign-in-to-join
    why: >-
      a public collective keeps working with no account: the transcripts are
      read, and joining, which needs an account, is offered as a sign-in that
      comes back to this page.
    signedIn: false
    role: ""
    canRead: true
    group: { acceptance_mode: open, data_access: public, linked_github_org: acme, display_members: true }
    linked: []
    expect:
      whoCanPublish: anyone who joins publishes
      whoCanRead: anyone can read
      yourRole: you are not a member
      actions: [sign in to join]
      overflow: []
      tabs: [transcripts, members, stats]
      statusColumn: false
      transcriptRows: 2
      orgLine: acme
      manage: false
      memberBreakdown: 1 owner, 2 members, 1 contributor
      memberCount: 4

  - name: a-member-of-a-collective-with-a-private-member-list-sees-no-members
    why: >-
      when the owner keeps the member list private, the members tab says so to
      everyone but the owner and counts nobody.
    signedIn: true
    role: member
    canRead: true
    group: { acceptance_mode: open, data_access: members_only, linked_github_org: null, display_members: false }
    linked: []
    expect:
      whoCanPublish: anyone who joins publishes
      whoCanRead: members read
      yourRole: you are a member
      actions: [more, leave]
      overflow:
        - { label: publish several transcripts, route: "/collectives/{id}/contribute" }
      tabs: [transcripts, members, stats]
      statusColumn: false
      transcriptRows: 2
      orgLine: nothing linked
      manage: false
      memberBreakdown: null
      memberCount: 4

# The collective page's tabs: which one an address opens, and where the arrow
# keys take the selection. `keys` are pressed in order on the selected tab;
# `expectSearch` is the address's query afterwards. `withPending` serves the
# root `pending` list on the owner's queue.
tabCases:
  - name: no-tab-in-the-address-opens-transcripts
    why: the transcripts tab is where a collective opens.
    role: member
    acceptance_mode: open
    withPending: false
    search: ""
    keys: []
    expectSelected: transcripts
    expectSearch: ""

  - name: the-address-opens-the-stats-tab
    why: a link can open a tab directly, so ?tab=stats lands on the numbers.
    role: member
    acceptance_mode: open
    withPending: false
    search: "?tab=stats"
    keys: []
    expectSelected: stats
    expectSearch: "?tab=stats"

  - name: an-unknown-tab-falls-back-to-transcripts
    why: a tab the page does not have opens the first tab, never an empty page.
    role: member
    acceptance_mode: open
    withPending: false
    search: "?tab=pull-requests"
    keys: []
    expectSelected: transcripts
    expectSearch: "?tab=pull-requests"

  - name: waiting-is-not-offered-to-a-member-of-a-curated-collective
    why: >-
      the pending queue is the owner's alone on the server, so a member's link
      to it opens the transcripts tab and no request for the queue is sent.
    role: member
    acceptance_mode: curated
    withPending: false
    search: "?tab=waiting"
    keys: []
    expectSelected: transcripts
    expectSearch: "?tab=waiting"

  - name: the-curated-owner-opens-waiting-from-the-address
    why: the owner of a curated collective can be linked straight to what waits for them.
    role: owner
    acceptance_mode: curated
    withPending: true
    search: "?tab=waiting"
    keys: []
    expectSelected: waiting
    expectSearch: "?tab=waiting"

  - name: arrow-keys-move-between-tabs-and-keep-the-address
    why: >-
      the arrow keys move the selection along the tablist, and the address
      follows, so a reload opens the same tab.
    role: member
    acceptance_mode: open
    withPending: false
    search: ""
    keys: [ArrowRight, ArrowRight]
    expectSelected: stats
    expectSearch: "?tab=stats"

  - name: arrow-left-wraps-to-the-last-tab
    why: from the first tab, ArrowLeft wraps round to the last.
    role: owner
    acceptance_mode: curated
    withPending: true
    search: ""
    keys: [ArrowLeft]
    expectSelected: stats
    expectSearch: "?tab=stats"

  - name: home-and-end-jump-and-the-first-tab-clears-the-address
    why: >-
      End and Home jump to the ends; the first tab is the page's own address,
      so choosing it drops the parameter.
    role: owner
    acceptance_mode: curated
    withPending: true
    search: "?tab=members"
    keys: [End, Home]
    expectSelected: transcripts
    expectSearch: ""

# The collectives list: a table of every collective the caller may see, and a
# search that swaps the rows for the server's matches.
listCases:
  - name: the-table-lists-every-visible-collective-with-its-org-and-joining
    why: >-
      one row per collective the caller may see, member or not, with the role
      they hold, the linked github org (or nothing linked) and how it is joined.
    query: ""
    expectCaption: collectives 3
    expectRows:
      - { name: Acme Platform, role: owner, org: acme, joining: open }
      - { name: Acme Company, role: member, org: acme, joining: verified only }
      - { name: ML Reading Group, role: "", org: nothing linked, joining: curated }

  - name: a-search-shows-only-the-server-matches
    why: >-
      a submitted search asks GET /collectives/search and shows only what it
      answered; a match the list already holds keeps its role and joining.
    query: acme
    expectCaption: search results 2
    expectRows:
      - { name: Acme Platform, role: owner, org: acme, joining: open }
      - { name: Acme Company, role: member, org: acme, joining: verified only }

  - name: a-match-the-list-does-not-hold-claims-no-role
    why: >-
      a search can answer a collective the list does not carry; its row states
      only what the search said, so it claims no role and no way of joining.
    query: night
    expectCaption: search results 1
    expectRows:
      - { name: Night Shift, role: "", org: nothing linked, joining: "" }

# The list world: what GET /collectives/visible and GET /collectives/search answer.
visible:
  - { id: 1c000000-0000-4000-8000-000000000001, name: Acme Platform, role: owner, org: acme, mode: open }
  - { id: 1c000000-0000-4000-8000-000000000002, name: Acme Company, role: member, org: acme, mode: verified_only }
  - { id: 1c000000-0000-4000-8000-000000000003, name: ML Reading Group, role: null, org: null, mode: curated }

searchable:
  - { id: 1c000000-0000-4000-8000-000000000001, name: Acme Platform, org: acme }
  - { id: 1c000000-0000-4000-8000-000000000002, name: Acme Company, org: acme }
  - { id: 1c000000-0000-4000-8000-000000000009, name: Night Shift, org: null }

# The pull request cells of the transcripts table (a pure function). Each row
# lists its pull requests as owner/name#number, most recent first, with the
# total count the server reported.
pullRequestCases:
  - name: one-repository-reads-as-numbers-under-the-repository
    why: a transcript whose pull requests share one repository reads "#42, #45" with the repository beneath.
    rows:
      - { id: t1, pullRequests: [acme/api#42, acme/api#45], count: 2 }
    expect:
      - { id: t1, labels: ["#42", "#45"], repo: acme/api }
    hrefs:
      "#42": /pulls/acme/api/42
      "#45": /pulls/acme/api/45

  - name: two-repositories-in-one-row-carry-their-repository
    why: a row that spans two repositories names each pull request with its repository, and no repository line.
    rows:
      - { id: t1, pullRequests: [acme/api#42, acme/web#7], count: 2 }
    expect:
      - { id: t1, labels: [acme/api#42, acme/web#7], repo: null }
    hrefs:
      acme/api#42: /pulls/acme/api/42
      acme/web#7: /pulls/acme/web/7

  - name: one-number-in-two-repositories-on-a-page-is-never-short
    why: >-
      two rows use #31 for different repositories; a short "#31" could lead to
      only one of them, so both rows carry their repository.
    rows:
      - { id: t1, pullRequests: [acme/api#31], count: 1 }
      - { id: t2, pullRequests: [acme/web#31], count: 1 }
    expect:
      - { id: t1, labels: [acme/api#31], repo: null }
      - { id: t2, labels: [acme/web#31], repo: null }
    hrefs:
      acme/api#31: /pulls/acme/api/31
      acme/web#31: /pulls/acme/web/31

  - name: more-pull-requests-than-the-row-names-are-counted
    why: the server names three pull requests per row; the repository line says how many there are in all.
    rows:
      - { id: t1, pullRequests: [acme/api#60, acme/api#51, acme/api#45], count: 5 }
    expect:
      - { id: t1, labels: ["#60", "#51", "#45"], repo: "acme/api, 5 pull requests" }
    hrefs:
      "#60": /pulls/acme/api/60
      "#51": /pulls/acme/api/51
      "#45": /pulls/acme/api/45

  - name: no-pull-requests-reads-as-not-linked
    why: a transcript attached to no pull request has no labels, which the view draws as "not linked".
    rows:
      - { id: t1, pullRequests: [], count: 0 }
    expect:
      - { id: t1, labels: [], repo: null }
    hrefs: {}
