        expectedTransition: null
      - name: sticky-inherited-fable
        content: Second assistant response inherits Fable.
        sourceObservation: null
        expectedEffectiveModel: anthropic/claude-fable-5
        expectedTransition: null
      - name: sticky-observed-opus
        content: Third assistant response records the switch to Opus.
        sourceObservation: anthropic/claude-opus-4-8
        expectedEffectiveModel: anthropic/claude-opus-4-8
        expectedTransition: 'model changed: anthropic/claude-fable-5 -> anthropic/claude-opus-4-8'
