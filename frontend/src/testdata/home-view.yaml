# Case corpus for `src/homeView.test.tsx`: how the Library is arranged in one
# browser. The grouping and the page come from the URL; the columns shown and
# the groups a reader closed are remembered on this device. Both change what is
# drawn, never what the server is asked or holds.
#
# Every case mounts the REAL root route for `alice-dev` over the same rows
# below, starting from `url` and `stored` (what this browser carried before the
# visit), then performs `steps` in order and checks `expect`.
#
# Deletion protection is the required-NAME manifest in
# `src/test/homeViewFixtures.ts`.

# Newest first, as the page ranks them. Two projects, two agents, three
# audiences: a row two collectives read, a public row, and a private one.
rows:
  - { id: v-1, title: Fix flaky ingest test, projectHash: "1111111111111111111111111111111111111111111111111111111111111111", projectDisplayName: ingest-api, publishedAt: "2026-08-21T12:00:00Z", modelProvider: claude-code, sharedWith: [Acme Platform, Acme Company] }
  - { id: v-2, title: Paginate the collectives list, projectHash: "2222222222222222222222222222222222222222222222222222222222222222", projectDisplayName: web, publishedAt: "2026-08-21T11:00:00Z", modelProvider: codex, sharedWith: [Acme Platform] }
  - { id: v-3, title: Guard empty turns, projectHash: "1111111111111111111111111111111111111111111111111111111111111111", projectDisplayName: ingest-api, publishedAt: "2026-08-21T10:00:00Z", modelProvider: codex, visibility: public }
  - { id: v-4, title: Reproduce the benchmark, projectHash: "2222222222222222222222222222222222222222222222222222222222222222", projectDisplayName: web, publishedAt: "2026-08-21T09:00:00Z", modelProvider: claude-code }

# Steps, each one of:
#   { groupBy: <label> }      choose a member in the table's grouping picker
#   { column: <label> }       tick or untick a column in the table's column picker
#   { project: <label> }      tick a project filter; `clear` empties the filter
#   { press: <label> }        press a group toggle by its label
# `expect`:
#   groups      the group rows, by label, in order ([] when ungrouped)
#   rows        the transcript rows on screen, by title, in order
#   columns     the table's column headers, in order
#   stored      the device half this browser remembers afterwards: hidden
#               columns and how many groups are closed
#   urlGroupBy  the grouping the URL carries afterwards, when a case changes it
cases:
  - name: a-first-visit-groups-by-project-with-every-group-open
    why: >-
      the table opens grouped by project, every group open, so the newest
      transcripts read in place without a press.
    stored: null
    steps: []
    expect:
      groups: [ingest-api, web]
      rows: [Fix flaky ingest test, Guard empty turns, Paginate the collectives list, Reproduce the benchmark]
      columns: [transcript, project, who can read, agent, when]
      stored: null

  - name: closing-a-group-hides-its-rows-and-is-remembered
    why: a group a person closes stays closed on their next visit to this page.
    stored: null
    steps:
      - { press: ingest-api }
    expect:
      groups: [ingest-api, web]
      rows: [Paginate the collectives list, Reproduce the benchmark]
      columns: [transcript, project, who can read, agent, when]
      stored: { hiddenColumns: [pullRequests, turns], collapsedGroups: 1 }

  - name: the-group-picker-regroups-and-the-url-carries-it
    why: >-
      a row two collectives read sits under both; a public row sits under
      anyone with the link; a row no collective reads says so in the same words
      its readers cell uses. The grouping enters the URL, not this device.
    stored: null
    steps:
      - { groupBy: collective }
    expect:
      groups: [Acme Platform, Acme Company, anyone with the link, not shared with collective members]
      rows: [Fix flaky ingest test, Paginate the collectives list, Fix flaky ingest test, Guard empty turns, Reproduce the benchmark]
      columns: [transcript, project, who can read, agent, when]
      stored: { hiddenColumns: [pullRequests, turns], collapsedGroups: 0 }
      urlGroupBy: collective

  - name: the-column-picker-shows-and-hides-columns
    why: >-
      a column a person turns on changes the header and every row, and the
      title column is always there.
    stored: { columns: [transcript, project, readers, agent, when], collapsed: [] }
    steps:
      - { column: turns }
    expect:
      groups: [ingest-api, web]
      rows: [Fix flaky ingest test, Guard empty turns, Paginate the collectives list, Reproduce the benchmark]
      columns: [transcript, project, who can read, agent, turns, when]
      stored: { hiddenColumns: [pullRequests], collapsedGroups: 0 }

  - name: a-saved-columns-record-migrates-to-the-closed-list
    why: >-
      the shipped view was a record of booleans under the earlier key. The true
      keys become the ordered column list, so a returning reader keeps the
      columns they chose; the grouping is not migrated because the URL owns it.
    legacy: true
    stored: { groupBy: project, columns: { project: true, readers: true, agent: true, pullRequests: false, turns: false, when: true }, open: [] }
    steps: []
    expect:
      groups: [ingest-api, web]
      rows: [Fix flaky ingest test, Guard empty turns, Paginate the collectives list, Reproduce the benchmark]
      columns: [transcript, project, who can read, agent, when]
      stored: { hiddenColumns: [pullRequests, turns], collapsedGroups: 0 }

  - name: a-saved-visible-columns-array-migrates-and-drops-an-unknown-member
    why: >-
      a stored array is validated member by member. An unknown member is
      dropped with one warning; the known ones keep their order.
    stored: { visibleColumns: [transcript, project, agent, nope], collapsed: [] }
    steps: []
    expect:
      groups: [ingest-api, web]
      rows: [Fix flaky ingest test, Guard empty turns, Paginate the collectives list, Reproduce the benchmark]
      columns: [transcript, project, agent]
      stored: { hiddenColumns: [readers, pullRequests, turns, when], collapsedGroups: 0 }

  - name: an-unreadable-remembered-view-falls-back-to-the-default
    why: a view stored by an older page, or damaged, never breaks the page.
    stored: "{not json"
    steps: []
    expect:
      groups: [ingest-api, web]
      rows: [Fix flaky ingest test, Guard empty turns, Paginate the collectives list, Reproduce the benchmark]
      columns: [transcript, project, who can read, agent, when]
      stored: null

  - name: a-url-grouping-overrides-the-default
    why: a copied URL reproduces the sender's grouping; the columns stay this device's.
    url: "groupBy=agent"
    stored: null
    steps: []
    expect:
      groups: [claude-code, codex]
      rows: [Fix flaky ingest test, Reproduce the benchmark, Paginate the collectives list, Guard empty turns]
      columns: [transcript, project, who can read, agent, when]
      stored: null

  - name: hiding-a-project-narrows-this-visit-only
    why: >-
      the projects filter narrows what is drawn, and is not remembered, so a
      project hidden once never makes a new session look missing later.
    stored: { columns: [transcript, project, readers, agent, when], collapsed: [] }
    steps:
      - { project: web }
    expect:
      groups: [ingest-api]
      rows: [Fix flaky ingest test, Guard empty turns]
      columns: [transcript, project, who can read, agent, when]
      stored: { hiddenColumns: [pullRequests, turns], collapsedGroups: 0 }

  - name: hiding-every-project-says-so-and-offers-them-back
    why: an empty filter is not an empty library, so it says what is hiding the rows.
    stored: { columns: [transcript, project, readers, agent, when], collapsed: [] }
    steps:
      - { project: clear }
    expect:
      groups: []
      rows: []
      columns: []
      stored: { hiddenColumns: [pullRequests, turns], collapsedGroups: 0 }
