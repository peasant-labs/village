# Source mutations of the positioned transcript page, each with the named cases
# that must fail under it. scripts/test-positioned-host-mutations.mjs applies
# one mutation at a time, runs its killers, requires a named killer to be among
# the failing cases, and restores the file.
#
# `occurrences` is how many times `original` appears in `file` (default 1); the
# mutation replaces every one of them. A killer of kind `journey` runs only with
# POSITIONED_MUTATIONS_JOURNEYS=1, since it needs the journey mock and a dev
# server; the vitest killer of the same row always runs.
mutations:
  - name: v2-error-reads-content
    why: a positioned failure that reads the whole document instead
    file: ../../src/components/session-detail/v2/SessionDetailV2.tsx
    original: "  const positionedRevision = positioned?.controls.header?.revision;\n"
    replacement: |
      const positionedRevision = positioned?.controls.header?.revision;
      useEffect(() => {
        if (!positioned?.viewerProps.positionedRead?.failure) return;
        void readTranscriptForDownload(
          { transcriptId, format: 'json', url: transcriptUrl, storedTitle: transcriptTitle },
          { signal: new AbortController().signal, isCurrent: () => false },
        );
      });
    killers:
      - {kind: vitest, file: src/transcriptPositionedHost.test.tsx, name: v2-failure-never-requests-content}
      - {kind: journey, file: scripts/journey/positioned-transcript.journey.mjs, name: journey-v2-failure-no-content-request}

  - name: version-token-substring
    why: a version token matched by substring instead of exact membership
    file: ../../src/lib/queries/segmentedReadCapability.ts
    original: "    return window?.current === SegmentedReadAPIVersion\n"
    replacement: "    return window?.current.includes(SegmentedReadAPIVersion)\n"
    killers:
      - {kind: vitest, file: src/lib/queries/segmentedReadCapability.test.ts, name: capability-lookalike-token-refused}

  - name: decide-on-min-alone
    why: the mode decided from minSegmentedReadVersion alone
    file: ../../src/lib/queries/segmentedReadCapability.ts
    original: "    const window = parseSegmentedReadVersionAdvertisement(await response.text());\n    return window?.current === SegmentedReadAPIVersion\n"
    replacement: "    const window = JSON.parse((await response.text()) || \"{}\");\n    return window?.minSegmentedReadVersion === SegmentedReadAPIVersion\n"
    killers:
      - {kind: vitest, file: src/lib/queries/segmentedReadCapability.test.ts, name: capability-min-only-uses-content}

  - name: decide-on-health-trait
    why: the mode decided from the health route's serves trait
    file: ../../src/lib/queries/segmentedReadCapability.ts
    original: "    const window = parseSegmentedReadVersionAdvertisement(await response.text());\n    return window?.current === SegmentedReadAPIVersion\n"
    replacement: "    const window = JSON.parse((await response.text()) || \"{}\");\n    return (window?.serves ?? []).includes(\"segmented-reads-v2\")\n"
    killers:
      - {kind: vitest, file: src/lib/queries/segmentedReadCapability.test.ts, name: capability-ignores-health-trait}

  - name: export-from-loaded-segments
    why: a download written from the segments in hand instead of one /content read
    file: ../../src/components/session-detail/v2/SessionDetailV2.tsx
    original: "    if (positioned) {\n      const { id, abort } = downloadEpoch.current;\n"
    replacement: |2
          if (positioned) {
            const loaded = (positioned.viewerProps.segments ?? []).flatMap((segment) => segment.turns);
            const viewModel = { ...positioned.viewerProps.viewModel!, turns: loaded };
            saveTranscriptFile(transcriptFile(format, { viewModel, detail: { ...viewModel.session, turns: loaded } as unknown as SessionDetailPayload, url: transcriptUrl, transcriptId }));
            return;
          }
          if (positioned) {
            const { id, abort } = downloadEpoch.current;
    killers:
      - {kind: vitest, file: src/transcriptPositionedHost.test.tsx, name: download-json-bytes-partial-load}

  - name: json-indent-dropped
    why: the JSON download without its two-space indent
    file: ../../src/lib/transcriptExport.ts
    original: "JSON.stringify(source.detail, null, 2)"
    replacement: "JSON.stringify(source.detail)"
    killers:
      - {kind: vitest, file: src/transcriptPositionedHost.test.tsx, name: download-json-bytes-partial-load}

  - name: json-trailing-newline-dropped
    why: the JSON download without its trailing newline
    file: ../../src/lib/transcriptExport.ts
    original: "text: `${JSON.stringify(source.detail, null, 2)}\\n` }"
    replacement: "text: JSON.stringify(source.detail, null, 2) }"
    killers:
      - {kind: vitest, file: src/transcriptPositionedHost.test.tsx, name: download-json-bytes-partial-load}

  - name: epoch-ignored
    why: a download saved after the page moved to another revision
    file: ../../src/lib/transcriptExport.ts
    original: "!epoch.isCurrent()"
    replacement: "false"
    occurrences: 2
    killers:
      - {kind: vitest, file: src/transcriptPositionedHost.test.tsx, name: download-no-partial-file-on-epoch-change}

  - name: revision-echo-dropped
    why: a segment or window read that no longer echoes the revision
    file: ../../src/lib/queries/positionedTransport.ts
    original: "[\"revision\", \"representation\"] as const"
    replacement: "[\"representation\"] as const"
    killers:
      - {kind: vitest, file: src/lib/queries/positionedTransport.test.ts, name: transport-sends-v2-and-echo}

  - name: representation-echo-dropped
    why: a segment or window read that no longer echoes the representation
    file: ../../src/lib/queries/positionedTransport.ts
    original: "[\"revision\", \"representation\"] as const"
    replacement: "[\"revision\"] as const"
    killers:
      - {kind: vitest, file: src/lib/queries/positionedTransport.test.ts, name: transport-sends-v2-and-echo}

  - name: http-date-read-as-seconds
    why: an HTTP-date Retry-After read as a number of seconds
    file: ../../src/lib/queries/positionedTransport.ts
    original: "  const date = httpDate(trimmed, at);\n"
    replacement: "  const date = at + Number.parseFloat(trimmed) * 1000;\n"
    killers:
      - {kind: vitest, file: src/lib/queries/positionedTransport.test.ts, name: transport-retry-after-parse}

  - name: graph-reads-content-on-mount
    why: the graph reading the whole document every time it mounts, instead of once per revision
    file: ../../src/components/session-detail/v2/SessionDetailV2.tsx
    original: "    if (!graphWanted || graphCurrent.status !== GraphReadStatus.Idle) return;\n    const revision = positionedRevision;\n    if (graphRequested.current && graphRequested.current.revision === revision) return;\n"
    replacement: "    if (!graphWanted) return;\n    const revision = positionedRevision;\n"
    killers:
      - {kind: vitest, file: src/transcriptPositionedHost.test.tsx, name: graph-open-reads-content-once}

  - name: list-reads-content
    why: the list reading the whole document though the graph was never opened
    file: ../../src/components/session-detail/v2/SessionDetailV2.tsx
    original: "  const graphWanted = positioned !== undefined && viewMode === TranscriptViewMode.Graph;\n"
    replacement: "  const graphWanted = positioned !== undefined;\n"
    killers:
      - {kind: vitest, file: src/transcriptPositionedHost.test.tsx, name: list-mode-never-reads-content}

  - name: snapped-line-prints-recorded-index
    why: the snapped-turn line naming the opened row by its recorded index instead of the label the row shows
    file: ../../src/components/session-detail/v2/SessionDetailV2.tsx
    original: "openedRow.numberAbsent ? undefined : openedRow.label"
    replacement: "String(landing.anchorTurn)"
    killers:
      - {kind: vitest, file: src/transcriptPositionedHost.test.tsx, name: turn-param-snapped-status-copy}
