# Self-check corpus for the collective grouped side-by-side gate
# (scripts/visual/collective-sxs.mjs + collective-stitch-sxs.mjs).
#
# The cases below drive the SAME predicate the stitcher fails closed with
# (`sideProblem`), so a composite can never be built from a side that is absent,
# blank, or byte-identical to its counterpart. Each case names the one branch it
# must exercise; `expected` is the substring the resulting reason must carry, and
# `null` means the side must be accepted.

# Deletion-protection manifest: every arm this gate stitches is present by NAME,
# never as a bare count, and renaming one away is a failure. Keep in step with
# REQUIRED_ARM_SURFACES in collective-sxs.mjs.
requiredArms:
  - collective-grouped-browse
  - collective-grouped-contribute
  - collective-grouped-review
  - collective-grouped-my-shares

cases:
  - name: reference-absent
    side: reference
    exists: false
    expected: no capture at
  - name: subject-absent
    side: subject
    exists: false
    expected: no capture at
  - name: reference-undersized
    side: reference
    exists: true
    measurement: { bytes: 5900, nonbgRatio: 0.0, distinctColors: 1, md5: aaaa }
    expected: content floor
  - name: reference-uniform-fill
    side: reference
    exists: true
    measurement: { bytes: 24000, nonbgRatio: 0.001, distinctColors: 3, md5: bbbb }
    expected: near-uniform fill
  - name: subject-flat-fill
    side: subject
    exists: true
    measurement: { bytes: 24000, nonbgRatio: 0.09, distinctColors: 2, md5: cccc }
    expected: flat fill
  - name: sides-byte-identical
    side: subject
    exists: true
    measurement: { bytes: 24000, nonbgRatio: 0.09, distinctColors: 40, md5: dddd }
    otherMd5: dddd
    expected: byte-identical
  - name: reference-real-content
    side: reference
    exists: true
    measurement: { bytes: 240000, nonbgRatio: 0.08, distinctColors: 90, md5: eeee }
    expected: null
  - name: subject-real-content
    side: subject
    exists: true
    measurement: { bytes: 180000, nonbgRatio: 0.12, distinctColors: 120, md5: ffff }
    expected: null
  - name: unmeasurable-side
    side: reference
    exists: true
    expected: unmeasurable

# ── the exact-release proof the demo shoot refuses to capture without ─────────
# `describeTag` is `git describe --tags --exact-match` in the named checkout; an
# empty string is what git answers for a checkout sitting between releases.
releaseProofCases:
  - name: pinned-release-passes
    checkout: /srv/fairtrade
    pinnedVersion: 0.0.20
    checkoutVersion: 0.0.20
    describeTag: fairtrade-v0.0.20
    expected: null
  - name: no-checkout-named
    checkout: ''
    pinnedVersion: 0.0.20
    checkoutVersion: null
    describeTag: ''
    expected: no demo checkout was named
  - name: checkout-version-drift
    checkout: /srv/fairtrade
    pinnedVersion: 0.0.20
    checkoutVersion: 0.0.21
    describeTag: fairtrade-v0.0.21
    expected: but this app pins
  - name: checkout-between-releases
    checkout: /srv/fairtrade
    pinnedVersion: 0.0.20
    checkoutVersion: 0.0.20
    describeTag: ''
    expected: (no exact tag)
  - name: checkout-on-another-release
    checkout: /srv/fairtrade
    pinnedVersion: 0.0.20
    checkoutVersion: 0.0.20
    describeTag: fairtrade-v0.0.19
    expected: instead of "fairtrade-v0.0.20"

# ── the served bytes must be the proven build's bytes ─────────────────────────
digestCases:
  - name: served-bytes-equal-the-proven-build
    served: { url: http://127.0.0.1:5190/assets/index-D0h_RPqm.js, sha256: aaaaaaaaaaaaaaaa }
    local: { sha256: aaaaaaaaaaaaaaaa }
    expected: null
  - name: served-bytes-drifted-from-the-proven-build
    served: { url: http://127.0.0.1:5190/assets/index-D0h_RPqm.js, sha256: bbbbbbbbbbbbbbbb }
    local: { sha256: aaaaaaaaaaaaaaaa }
    expected: differs from the same file
  - name: the-proven-build-has-no-matching-file
    served: { url: http://127.0.0.1:5190/assets/index-unknown.js, sha256: aaaaaaaaaaaaaaaa }
    local: null
    expected: no file matching
  - name: the-served-asset-cannot-be-fetched
    served: null
    local: { sha256: aaaaaaaaaaaaaaaa }
    expected: could not be fetched

# ── the computed-style comparison: one property set, named exceptions ─────────
# `styleBase` is what a faithful pair reads out. A case patches the reference or
# the subject (or removes an element) and names the mismatches it must produce,
# as `<element>.<property>` keys. An absence with no STYLE_EXCEPTIONS entry fails
# closed — there is no recorded-but-allowed category.
styleBase:
  elements:
    trigger: { fontFamily: '"Atkinson Hyperlegible Mono", ui-monospace, Menlo, Consolas, monospace', fontSize: 14px, borderRadius: 0px, minHeight: 44px, textTransform: lowercase, paddingLeft: 16px }
    count: { fontFamily: '"Atkinson Hyperlegible Mono", ui-monospace, Menlo, Consolas, monospace', fontSize: 14px, fontVariantNumeric: tabular-nums, textTransform: lowercase, borderRadius: 0px }
    facts: { fontFamily: '"Atkinson Hyperlegible Mono", ui-monospace, Menlo, Consolas, monospace', fontSize: 14px, fontVariantNumeric: tabular-nums, whiteSpace: normal }
    title: { fontFamily: '"Atkinson Hyperlegible", ui-sans-serif, system-ui, sans-serif', fontSize: 14px, textTransform: none, whiteSpace: nowrap, textOverflow: ellipsis, lineHeight: 21px }
    rail: { stroke: 'rgb(60, 56, 47)', strokeWidth: 1px }
styleCases:
  - name: faithful-pair-compares-clean
    subjectPatch: {}
    expectedMismatches: []
    expectedExceptions: []
  - name: the-app-font-alias-is-normalized
    referencePatch:
      count: { fontFamily: 'atkinsonHyperlegibleMono, "atkinsonHyperlegibleMono Fallback", ui-monospace, monospace' }
      title: { fontFamily: 'atkinsonHyperlegible, "atkinsonHyperlegible Fallback", ui-sans-serif, system-ui, sans-serif' }
    expectedMismatches: []
    expectedExceptions: []
  - name: a-different-typeface-fails
    subjectPatch: { count: { fontFamily: '"Inter", sans-serif' } }
    expectedMismatches: [count.fontFamily]
    expectedExceptions: []
  - name: a-size-drift-fails
    subjectPatch: { facts: { fontSize: 15px } }
    expectedMismatches: [facts.fontSize]
    expectedExceptions: []
  - name: a-numeric-variant-drift-fails
    subjectPatch: { count: { fontVariantNumeric: normal } }
    expectedMismatches: [count.fontVariantNumeric]
    expectedExceptions: []
  - name: a-square-radius-drift-fails
    subjectPatch: { trigger: { borderRadius: 4px } }
    expectedMismatches: [trigger.borderRadius]
    expectedExceptions: []
  - name: an-unexplained-missing-element-fails
    arm: collective-grouped-contribute
    subjectRemove: [facts]
    expectedMismatches: [facts.(element not mounted)]
    expectedExceptions: []
  - name: the-named-read-only-exception-covers-the-rail
    arm: collective-grouped-browse
    subjectRemove: [rail]
    expectedMismatches: []
    expectedExceptions: [rail]
  - name: the-named-exception-does-not-cover-another-element
    arm: collective-grouped-browse
    subjectRemove: [facts]
    expectedMismatches: [facts.(element not mounted)]
    expectedExceptions: []
  # The member-selecting arms mount per-member checkboxes, so their connector is
  # asserted: dropping it on either side is an unexplained absence and fails the
  # stitch closed. There is no recorded-but-allowed category.
  - name: the-connector-is-asserted-on-contribute
    arm: collective-grouped-contribute
    subjectRemove: [rail]
    expectedMismatches: [rail.(element not mounted)]
    expectedExceptions: []
  - name: the-connector-is-asserted-on-review
    arm: collective-grouped-review
    subjectRemove: [rail]
    expectedMismatches: [rail.(element not mounted)]
    expectedExceptions: []

# ── the positive connector assertion the member-selecting arms carry ──────────
# `connectorProblem` fails the stitch when an arm listed in CONNECTOR_ARMS does not
# mount the canonical connector on both sides. A display-only arm is not in that
# list and is never failed here; its absence is the STYLE_EXCEPTIONS case above.
connectorArms:
  - collective-grouped-contribute
  - collective-grouped-review
connectorCases:
  - name: both-sides-mount-the-connector
    arm: collective-grouped-contribute
    expected: null
  - name: the-subject-drops-the-connector
    arm: collective-grouped-contribute
    subjectRemove: [rail]
    expected: is absent on the subject side
  - name: the-reference-drops-the-connector
    arm: collective-grouped-review
    referenceRemove: [rail]
    expected: is absent on the reference side
  - name: both-sides-drop-the-connector
    arm: collective-grouped-review
    subjectRemove: [rail]
    referenceRemove: [rail]
    expected: is absent on both sides
  - name: a-display-only-arm-is-not-asserted
    arm: collective-grouped-browse
    subjectRemove: [rail]
    expected: null

# ── the markers each arm's OWN route bundle must carry ────────────────────────
# The contribute and review routes do not load the contributions panel's chunk, so
# requiring the panel marker there would refuse an attributable build; the two
# arms whose route does load it must require it. Pinned by name so a route that
# starts (or stops) loading a chunk cannot silently weaken the check.
armMarkers:
  - arm: collective-grouped-browse
    markers: [data-helper-group-owner, my-contributions-panel]
  - arm: collective-grouped-contribute
    markers: [data-helper-group-owner]
  - arm: collective-grouped-review
    markers: [data-helper-group-owner]
  - arm: collective-grouped-my-shares
    markers: [data-helper-group-owner, my-contributions-panel]
