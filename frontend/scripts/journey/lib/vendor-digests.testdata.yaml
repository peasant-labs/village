cases:
  - name: changed canonical body is refused
    mutation: body
    expected: digest mismatch
  - name: unclassified helper is refused
    mutation: unknown
    expected: unclassified
  - name: wrong body pin is refused
    mutation: pin
    expected: digest mismatch
  - name: malformed body pin is refused
    mutation: malformed-pin
    expected: invalid pin
  - name: unknown file kind is refused
    mutation: kind
    expected: invalid kind
  - name: relabeling a shared helper cannot remove its pin
    mutation: relabel
    expected: vendored membership
  - name: unsafe inventory path is refused
    mutation: path
    expected: unsafe filename
  - name: changed upstream is distinguished from the pinned copy
    mutation: upstream
    expected: upstream mismatch
  - name: rewording the banner preserves the canonical body pin
    mutation: banner
    expected: null
