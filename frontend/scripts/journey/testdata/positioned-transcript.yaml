# The positioned transcripts the journey mock and the visual mock serve. Every
# body comes from scripts/journey/lib/positioned-bodies.mjs, which checks it
# against Schema's parsers before either mock starts.
#
# `main` is the transcript page's subject: ten segments of four rows, one row
# the server sends no number for, and one earlier-history section. A deep link
# to `farTurn` opens a run far from the default open, so the page shows the
# gap between the two runs. `previewId` is the first submission the curated
# collective's review queue lists (lib/collective-fixtures.mjs), served as a
# smaller positioned transcript for the preview column.

advertisement: {segmentedReadVersion: '0.2.0', minSegmentedReadVersion: '0.1.0'}

# The actions Fairtrade's positioned failure states offer, as a reader meets them.
failureActions: {retry: try again}

# The trace canvas's view toggles, as a reader meets them.
viewButtons: {list: list, graph: graph}

main:
  transcriptId: 5e9d1c3a-7b2f-4d8e-9a61-0c4b7e2f1d93
  title: read a long session through the positioned reader
  owner: riley-owner
  ownerId: 0f1e2d3c-4b5a-4968-8776-655443322110
  rowsPerSegment: 4
  segments: 10
  numberAbsent: [2]
  session: {project: positioned-reader, gitBranch: feature/positioned-reads}
  prompts:
    - Open the reader at the deep link and check which segments it asks for.
    - Why does the boundary between the two runs name the segments it skips?
    - Make the history section show its recorded count while it is closed.
    - Check that a refetched segment keeps its numbers after eviction.
    - Summarise what changed in the fetch set and why.
  replies:
    - The window names its own run, so the reader asks for exactly those segments.
    - The directory says how many rows sit between the runs, so the boundary can name them.
    - The closed section shows the count the directory records, qualified until it opens.
  history:
    - state: uncertain_migrated
      turns:
        - {role: user, content: Start from the earlier plan before the session was resumed.}
        - {role: assistant, content: The earlier plan read the whole document at once.}
        - {role: user, content: Keep that plan in the history section.}
        - {role: assistant, content: It stays there, numbered on its own.}
  farTurn: 33
  unservedTurn: 999

# The snapped deep link's subject. Its recorded indexes start at 10 while the
# server labels its rows from 1, so a status line that named the opened row by
# its recorded index (10), or by a number the page derived from it (11),
# would not match the row's own label (#1).
snapped:
  transcriptId: 3c6a9e21-4d7b-4f0a-8e52-91b7c0d4a6f8
  title: open a deep link the transcript does not serve
  owner: riley-owner
  ownerId: 0f1e2d3c-4b5a-4968-8776-655443322110
  rowsPerSegment: 4
  segments: 2
  firstRecordedIndex: 10
  session: {project: positioned-reader, gitBranch: feature/positioned-reads}
  prompts:
    - Open the turn the link names, or say which one opened instead.
  replies:
    - The link names a turn this view does not serve, so the first row opened.
  unservedTurn: 999
  openedLabel: '#1'

preview:
  transcriptId: 7b000000-0000-4000-8000-000000000001
  title: Add retries to the webhook
  owner: dan-ops
  ownerId: 0f1e2d3c-4b5a-4968-8776-655443322111
  rowsPerSegment: 4
  segments: 2
  session: {project: ingest-api, gitBranch: retries}
  prompts:
    - Add retries to the webhook with a capped backoff.
  replies:
    - The webhook now retries three times with a capped backoff.
