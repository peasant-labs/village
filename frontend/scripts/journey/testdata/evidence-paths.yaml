      say so, in the job annotations and in the comment.
    tests:
      - attachments:
          - contentType: image/png
            path: /__w/village/village/frontend/scripts/journey/.artifacts/results/explore-dark/test-finished-1.png
          - contentType: video/webm
            path: /__w/village/village/frontend/scripts/journey/.artifacts/results/explore-dark/video.webm
      - attachments:
          - contentType: image/png
            path: /__w/village/village/frontend/scripts/journey/.artifacts/results/explore-light/test-finished-1.png
    present: []
    want:
      listed: 3
      resolved: 0
      problem: "no screenshots or clips: the report lists 3, but none of them is in the downloaded artifact."
      media:
        - image: null
          video: null
        - image: null
          video: null

  - name: some-media-resolves-is-not-the-error
