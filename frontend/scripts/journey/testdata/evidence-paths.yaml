# Where the evidence job finds each screenshot and clip that report.json records.
#
# The journey job runs inside the Playwright container, so report.json records
# container paths (/__w/village/village/...). The evidence job runs on the host
# and downloads the same artifact into its own checkout, so a recorded path that
# does not exist there is re-rooted: the part after the last segment named like
# the local artifacts directory is joined to that directory.
#
# Consumed by evidence-paths.test.mjs. `artifactsDir` is the evidence job's local
# artifacts directory for every case unless a case names its own. `present` lists
# the files that exist on that machine; no other file exists. Every path case
# also pins, in `probed`, every path the resolver checks, in order. Every case
# carries a non-empty `why`, and the required-name lists guard against deleting a
# case.

artifactsDir: /home/runner/work/village/village/frontend/scripts/journey/.artifacts

requiredPathCases:
  - container-path-re-roots-to-local
  - local-path-stays-unchanged
  - missing-file-resolves-to-null
  - last-artifacts-segment-is-the-root
  - path-without-an-artifacts-segment-resolves-to-null
  - artifacts-segment-is-named-by-the-local-directory

requiredReportCases:
  - container-report-resolves-every-file
  - media-listed-but-none-resolves-is-the-error
  - some-media-resolves-is-not-the-error
  - no-media-listed-is-not-the-error
  - the-page-clip-is-the-one-posted
  - the-first-screenshot-is-the-one-posted

