# Cases for loadShareCard. Each case runs its steps in order against a fake API
# (`parallel: true` fires them at once).
#
# `meta` and `content` describe what the API answers on that step. A reply is
# `{kind: response, status, ...}`, `{kind: reject}` or `{kind: hang}`; a response
# may carry `delayMs` (answered after that long on the fake clock). A metadata
# response carries `visibility`, `updated_at` and the stored `title` (absent: the
# title the content carries, "rewrite billing retries"); a content response carries
# `payload`: `figures` (both figures), `no-figures`, `no-first-prompt` (the first
# user turn has no text), `unparseable`, `long-prompt` (a ~1MB first prompt) or `surrogate-boundary`.
# `id` is the transcript id asked for (default `t1`).
# `expect` is `card-figures`, `card-no-figures` or `null`. A step's `card` lists
# fields the returned card must have; `firstPrompt` there is a string or
# `{repeat, times}` (one character repeated, for texts too long to write out).
# A step's `metadata` is the link text the page builds from that card: the
# title, the description and the share images' alt.
# `metadataUrl` is the exact metadata read the case expects (default the `t1` read).
# `storedPromptMaxUnits` bounds every stored card's first prompt, in UTF-16 units.
# `storedEqualsResult: true` pins that the cache holds exactly the card returned.
# `fakeTimers: true` runs the case on a fake clock, so a deadline is proven
# without waiting: a step's `startAfterMs` moves the clock before the step
# starts and its `advanceMs` moves it after, before the result is read.
# `cacheValues` pins what the cache holds afterwards: `card` (only card-shaped
# values) or `empty`.
defaults:
  updated_at: &t1 "2026-10-01T00:00:00Z"
cases:
  - name: public-both-figures
    steps:
      - meta: { kind: response, status: 200, visibility: public, updated_at: *t1 }
        content: { kind: response, status: 200, payload: figures }
        expect: card-figures
        card:
          title: rewrite billing retries
          firstPrompt: rewrite billing retries with SECRET-PROMPT-TEXT
          harness: claude-code
          brand: claude
          chip: Claude Code (Opus 5.5)
          figures: { prompts: 6, tokens: 84000 }
    metadataFetches: 1
    contentFetches: 1
    cacheValues: card

  - name: public-no-figures
    steps:
      - meta: { kind: response, status: 200, visibility: public, updated_at: *t1 }
        content: { kind: response, status: 200, payload: no-figures }
        expect: card-no-figures
        card: { figures: null }
    metadataFetches: 1
    contentFetches: 1
    cacheValues: card

  - name: shared
    steps:
      - meta: { kind: response, status: 403 }
        expect: "null"
    metadataFetches: 1
    contentFetches: 0
    cacheValues: empty

  - name: private
    steps:
      - meta: { kind: response, status: 403 }
        expect: "null"
    metadataFetches: 1
    contentFetches: 0
    cacheValues: empty

  - name: missing
    steps:
      - meta: { kind: response, status: 404 }
        expect: "null"
    metadataFetches: 1
    contentFetches: 0
    cacheValues: empty

  - name: non-public-body-on-200
    steps:
      - meta: { kind: response, status: 200, visibility: private, updated_at: *t1 }
        expect: "null"
    metadataFetches: 1
    contentFetches: 0

  - name: shared-body-on-200
    steps:
      - meta: { kind: response, status: 200, visibility: shared, updated_at: *t1 }
        expect: "null"
    metadataFetches: 1
    contentFetches: 0
    cacheValues: empty

  - name: long-first-prompt
    steps:
      - meta: { kind: response, status: 200, visibility: public, updated_at: *t1 }
        content: { kind: response, status: 200, payload: long-prompt }
        expect: card-figures
        card: { firstPrompt: { repeat: x, times: 2000 } }
    metadataFetches: 1
    contentFetches: 1
    storedPromptMaxUnits: 2000
    cacheValues: card

  - name: first-prompt-surrogate-boundary
    steps:
      - meta: { kind: response, status: 200, visibility: public, updated_at: *t1 }
        content: { kind: response, status: 200, payload: surrogate-boundary }
        expect: card-figures
        card: { firstPrompt: { repeat: x, times: 1999 } }
    metadataFetches: 1
    contentFetches: 1
    cacheValues: card

  - name: api-error-500
    steps:
      - meta: { kind: response, status: 500 }
        expect: "null"
    metadataFetches: 1
    contentFetches: 0

  - name: api-unreachable
    steps:
      - meta: { kind: reject }
        expect: "null"
    metadataFetches: 1
    contentFetches: 0

  - name: content-error-500
    steps:
      - meta: { kind: response, status: 200, visibility: public, updated_at: *t1 }
        content: { kind: response, status: 500 }
        expect: "null"
    metadataFetches: 1
    contentFetches: 1
    cacheValues: empty

  - name: missing-updated-at
    steps:
      - meta: { kind: response, status: 200, visibility: public }
        expect: "null"
    metadataFetches: 1
    contentFetches: 0
    cacheValues: empty

  - name: non-string-updated-at
    steps:
      - meta: { kind: response, status: 200, visibility: public, updated_at: 1790000000 }
        expect: "null"
    metadataFetches: 1
    contentFetches: 0
    cacheValues: empty

  - name: unparseable-content
    steps:
      - meta: { kind: response, status: 200, visibility: public, updated_at: *t1 }
        content: { kind: response, status: 200, payload: unparseable }
        expect: "null"
    metadataFetches: 1
    contentFetches: 1

  - name: deadline
    fakeTimers: true
    steps:
      - meta: { kind: hang }
        expect: "null"
        advanceMs: 3000
    metadataFetches: 1
    contentFetches: 0

  - name: deadline-content-hang
    fakeTimers: true
    steps:
      - meta: { kind: response, status: 200, visibility: public, updated_at: *t1 }
        content: { kind: hang }
        expect: "null"
        advanceMs: 3000
    metadataFetches: 1
    contentFetches: 1
    cacheValues: empty

  # Each read alone is inside its own 3s bound; together they pass the one overall deadline.
  - name: deadline-is-total
    fakeTimers: true
    steps:
      - meta: { kind: response, status: 200, visibility: public, updated_at: *t1, delayMs: 2000 }
        content: { kind: response, status: 200, payload: figures, delayMs: 2000 }
        expect: "null"
        advanceMs: 3000
    metadataFetches: 1
    contentFetches: 1

  # A cold read slower than a caller's deadline: that caller gets null at 3s,
  # but the fill runs on its own clock, lands at 4s and is cached, so a later
  # caller gets the card without reading the content again.
  - name: slow-cold-read
    fakeTimers: true
    steps:
      - meta: { kind: response, status: 200, visibility: public, updated_at: *t1 }
        content: { kind: response, status: 200, payload: figures, delayMs: 4000 }
        expect: "null"
        advanceMs: 3000
      - meta: { kind: response, status: 200, visibility: public, updated_at: *t1 }
        startAfterMs: 1500
        expect: card-figures
    metadataFetches: 2
    contentFetches: 1
    cacheValues: card

  - name: no-env
    env: false
    steps:
      - meta: { kind: response, status: 200, visibility: public, updated_at: *t1 }
        expect: "null"
    metadataFetches: 0
    contentFetches: 0

  - name: dot-segment-id
    # "." and ".." would be read by URL resolution as a path step, so the
    # request would reach another API route; no request is made for them.
    id: "."
    steps:
      - meta: { kind: response, status: 200, visibility: public, updated_at: *t1 }
        expect: "null"
    metadataFetches: 0
    contentFetches: 0

  - name: dot-dot-segment-id
    id: ".."
    steps:
      - meta: { kind: response, status: 200, visibility: public, updated_at: *t1 }
        expect: "null"
    metadataFetches: 0
    contentFetches: 0

  # A percent-encoded dot segment is an ordinary id: it is escaped again, so the
  # read stays one path segment under /transcripts.
  - name: percent-encoded-dot-dot-id
    id: "%2e%2e"
    steps:
      - meta: { kind: response, status: 404 }
        expect: "null"
    metadataFetches: 1
    contentFetches: 0
    metadataUrl: "http://backend:8080/api/v1/transcripts/%252e%252e"

  - name: visibility-flip
    steps:
      - meta: { kind: response, status: 200, visibility: public, updated_at: *t1 }
        content: { kind: response, status: 200, payload: figures }
        expect: card-figures
      - meta: { kind: response, status: 403 }
        expect: "null"
    metadataFetches: 2
    contentFetches: 1

  - name: cache-hit-same-updated-at
    steps:
      - meta: { kind: response, status: 200, visibility: public, updated_at: *t1 }
        content: { kind: response, status: 200, payload: figures }
        expect: card-figures
      - meta: { kind: response, status: 200, visibility: public, updated_at: *t1 }
        expect: card-figures
    metadataFetches: 2
    contentFetches: 1

  - name: cache-miss-new-updated-at
    steps:
      - meta: { kind: response, status: 200, visibility: public, updated_at: *t1 }
        content: { kind: response, status: 200, payload: figures }
        expect: card-figures
      - meta: { kind: response, status: 200, visibility: public, updated_at: "2026-10-02T00:00:00Z" }
        content: { kind: response, status: 200, payload: no-figures }
        expect: card-no-figures
    metadataFetches: 2
    contentFetches: 2

  # The cached function returns the card and nothing else: no cache key or value holds transcript text.
  - name: caches-card-not-content
    steps:
      - meta: { kind: response, status: 200, visibility: public, updated_at: *t1 }
        content: { kind: response, status: 200, payload: figures }
        expect: card-figures
    metadataFetches: 1
    contentFetches: 1
    storedEqualsResult: true
    cacheValues: card

  # The owner renamed the transcript. The page shows the stored title, so the card
  # and its link text do too, and a rename that keeps updated_at shows at once:
  # the stored title is read on every request, never from the cached card.
  - name: retitled-transcript
    steps:
      - meta: { kind: response, status: 200, visibility: public, updated_at: *t1, title: "billing retries, renamed" }
        content: { kind: response, status: 200, payload: no-figures }
        expect: card-no-figures
        card: { title: "billing retries, renamed", firstPrompt: rewrite billing retries with SECRET-PROMPT-TEXT }
        metadata:
          title: "billing retries, renamed"
          description: 'What prompts produced "billing retries, renamed"? Read every prompt on village.'
          alt: 'Share card: the first prompt of "billing retries, renamed" with Claude Code (Opus 5.5)'
      - meta: { kind: response, status: 200, visibility: public, updated_at: *t1, title: "retries, renamed again" }
        expect: card-no-figures
        card: { title: "retries, renamed again" }
        metadata:
          title: "retries, renamed again"
          description: 'What prompts produced "retries, renamed again"? Read every prompt on village.'
          alt: 'Share card: the first prompt of "retries, renamed again" with Claude Code (Opus 5.5)'
    metadataFetches: 2
    contentFetches: 1

  # With no first-prompt text the card draws the title in its place, so the
  # stored title stands in there too.
  - name: retitled-title-stands-in-for-prompt
    steps:
      - meta: { kind: response, status: 200, visibility: public, updated_at: *t1, title: "billing retries, renamed" }
        content: { kind: response, status: 200, payload: no-first-prompt }
        expect: card-figures
        card: { title: "billing retries, renamed", firstPrompt: "billing retries, renamed", firstPromptIsTitle: true }
    metadataFetches: 1
    contentFetches: 1

  # A blank stored title shows the page's untitled label, as the page does.
  - name: untitled-stored
    steps:
      - meta: { kind: response, status: 200, visibility: public, updated_at: *t1, title: "   " }
        content: { kind: response, status: 200, payload: no-figures }
        expect: card-no-figures
        card: { title: Untitled transcript }
        metadata:
          title: Untitled transcript
          description: 'What prompts produced "Untitled transcript"? Read every prompt on village.'
          alt: 'Share card: the first prompt of "Untitled transcript" with Claude Code (Opus 5.5)'
      - meta: { kind: response, status: 200, visibility: public, updated_at: *t1, title: null }
        expect: card-no-figures
        card: { title: Untitled transcript }
    metadataFetches: 2
    contentFetches: 1

  - name: single-flight
    parallel: true
    steps:
      - meta: { kind: response, status: 200, visibility: public, updated_at: *t1 }
        content: { kind: response, status: 200, payload: figures }
        expect: card-figures
      - meta: { kind: response, status: 200, visibility: public, updated_at: *t1 }
        content: { kind: response, status: 200, payload: figures }
        expect: card-figures
    metadataFetches: 2
    contentFetches: 1

  - name: no-auth-header
    steps:
      - meta: { kind: response, status: 200, visibility: public, updated_at: *t1 }
        content: { kind: response, status: 200, payload: figures }
        expect: card-figures
    metadataFetches: 1
    contentFetches: 1
